name: Deploy Check

# R67 P0-02 / P0-03 / P1-01 整改:
#   - 移除 paths 过滤:每个 release candidate 同 SHA 必跑(P0-03 要求)
#   - 删除 `2>/dev/null || true`:Compose 配置错误必须 fail-closed(P0-02 要求)
#   - 扩展 Compose 校验:对所有 profiles 执行 docker compose config
#   - 输出 canonical rendered compose artifact(绑定 source commit/tree/digest)
#   - 增加最小运行态 smoke(profiles / healthcheck / migration ordering)
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Install PyYAML
      run: pip install pyyaml

    - name: Verify services.yaml consistency
      run: |
        python -c "
        import yaml
        with open('config/services.yaml') as f:
            data = yaml.safe_load(f)
        services = data.get('services', [])
        names = [s['name'] for s in services]
        print('services.yaml 服务清单:', names)
        # 必需服务
        required = {'migration', 'db_writer', 'crdb_sync', 'up', 'idx', 'dsp', 'mon', 'admin_bot', 'admin', 'db_backup'}
        missing = required - set(names)
        assert not missing, f'services.yaml 缺少服务: {missing}'
        # crdb_sync 必须存在(R36 §6.3)
        assert 'crdb_sync' in names, 'services.yaml 必须包含 crdb_sync 服务(R36 §6.3)'
        # migration 必须是 oneshot
        migration = [s for s in services if s['name'] == 'migration'][0]
        assert migration.get('is_oneshot') is True, 'migration 必须是 oneshot'
        print('services.yaml 校验通过')
        "

    - name: Verify docker-compose services
      run: |
        python -c "
        import yaml
        with open('docker-compose.yml') as f:
            data = yaml.safe_load(f)
        compose_services = set(data.get('services', {}).keys())
        print('docker-compose 服务清单:', sorted(compose_services))
        # 必需服务(不含 redis 基础设施)
        required = {'migration', 'db_writer', 'crdb_sync', 'up', 'idx', 'dsp', 'mon', 'admin_bot', 'admin', 'db_backup'}
        missing = required - compose_services
        assert not missing, f'docker-compose.yml 缺少服务: {missing}'
        # 每个业务服务必须使用最小 secrets(env_file 包含 .env.secrets.<name>)
        for svc in ['up', 'idx', 'dsp', 'mon', 'admin_bot', 'admin', 'db_backup', 'crdb_sync']:
            svc_def = data['services'][svc]
            env_files = svc_def.get('env_file', [])
            has_shared = any('.env.shared' in ef for ef in env_files)
            assert has_shared, f'{svc} 必须加载 .env.shared'
        print('docker-compose.yml 校验通过')
        "

    - name: Verify secrets isolation
      run: |
        # R43: 验证 deploy_vps_per_bot.sh 不加载完整 .env
        # 过滤注释行后检测,避免注释中的 EnvironmentFile=-.env 误报
        # 仅匹配 .env 后面是行尾或空白(不匹配 .env.shared / .env.secrets.xxx)
        if grep -v '^#' deploy_vps_per_bot.sh | grep -qE 'EnvironmentFile=.*\.env($|\s)'; then
          echo "ERROR: Found complete .env loading in service file"
          grep -v '^#' deploy_vps_per_bot.sh | grep -nE 'EnvironmentFile=.*\.env($|\s)'
          exit 1
        fi
        echo "Secrets isolation OK"

    - name: Verify systemd services
      run: |
        # R43: 验证 deploy_vps_per_bot.sh 包含所有必需服务
        # deploy_vps_per_bot.sh 使用 SVC_PREFIX="tgjiema" 变量 + ${SVC_PREFIX}-${svc} 引用,
        # 不能简单 grep "tgjiema-${svc}",否则会因变量展开不匹配。
        # 因此本检查改为识别 SERVICES 数组中的 "${svc}:" 条目(服务定义入口),
        # 同时验证 SVC_PREFIX 已定义为 "tgjiema"。
        # migration 是 oneshot,独立在脚本中定义,不在 SERVICES 数组中。
        for svc in db_writer crdb_sync up idx dsp mon admin_bot admin db_backup; do
          # R43: 匹配 SERVICES 数组中 "<svc>:..." 条目(grep 模式展开为字面 "up: 等)
          if grep -q "\"${svc}:" deploy_vps_per_bot.sh; then
            echo "OK: ${svc} found in SERVICES array"
          else
            echo "ERROR: Missing service definition for ${svc} in SERVICES array"
            exit 1
          fi
        done
        # migration 是 oneshot 服务,通过 ${SVC_PREFIX}-migration.service 定义
        if ! grep -q 'migration.service' deploy_vps_per_bot.sh; then
          echo "ERROR: Missing migration.service definition"
          exit 1
        fi
        echo "OK: migration found in oneshot definition"
        # 验证 SVC_PREFIX 已定义
        if ! grep -qE '^SVC_PREFIX="tgjiema"' deploy_vps_per_bot.sh; then
          echo "ERROR: SVC_PREFIX must be set to 'tgjiema'"
          exit 1
        fi
        # 验证 migration 是 oneshot
        if ! grep -q "Type=oneshot" deploy_vps_per_bot.sh; then
          echo "ERROR: migration service must be Type=oneshot"
          exit 1
        fi
        echo "All systemd services verified"

    # R37 P1-7: 三方一致性校验(services.yaml ↔ docker-compose ↔ systemd)
    - name: Cross-verify service consistency (yaml ↔ compose ↔ systemd)
      run: |
        python -c "
        import yaml, re
        # 1. services.yaml 服务清单
        with open('config/services.yaml') as f:
            svc_yaml_data = yaml.safe_load(f)
        yaml_services = {s['name'] for s in svc_yaml_data.get('services', [])}
        # 2. docker-compose.yml 服务清单
        with open('docker-compose.yml') as f:
            compose_data = yaml.safe_load(f)
        compose_services = set(compose_data.get('services', {}).keys())
        # 3. deploy_vps_per_bot.sh systemd 服务清单
        # R43: deploy 脚本使用 SVC_PREFIX='tgjiema' 变量,需要兼容多种引用方式:
        #   - 字面 tgjiema-<svc> (echo 帮助信息)
        #   - \${SVC_PREFIX}-<svc> (systemd 单元定义)
        #   - \"<svc>:<desc>:...\" (SERVICES 数组定义,例如 \"up:上传接收Bot:...\")
        #   - migration 在 oneshot cat 块中定义
        with open('deploy_vps_per_bot.sh', encoding='utf-8') as f:
            deploy_script = f.read()
        systemd_services = set(re.findall(r'tgjiema-(\w+)', deploy_script))
        # 补充从 SERVICES 数组中识别 (e.g. \"db_writer:数据库写入:...\")
        svc_array_matches = re.findall(r'\"(\w+):[^\"]+:', deploy_script)
        systemd_services.update(svc_array_matches)
        # migration 通过 oneshot 定义,识别 \${SVC_PREFIX}-migration 引用
        if re.search(r'\$\{SVC_PREFIX\}-migration\.service', deploy_script):
            systemd_services.add('migration')
        # 比较: services.yaml 与 docker-compose 应一致
        missing_in_compose = yaml_services - compose_services
        assert not missing_in_compose, (
            f'services.yaml 中的服务未在 docker-compose.yml 找到: {missing_in_compose}'
        )
        # 比较: services.yaml 与 systemd 应一致
        missing_in_systemd = yaml_services - systemd_services
        assert not missing_in_systemd, (
            f'services.yaml 中的服务未在 deploy_vps_per_bot.sh 找到: {missing_in_systemd}'
        )
        print(f'三方一致性校验通过: {len(yaml_services)} 个服务')
        print(f'  services.yaml: {sorted(yaml_services)}')
        print(f'  docker-compose: {sorted(compose_services & yaml_services)}')
        print(f'  systemd: {sorted(systemd_services & yaml_services)}')
        "

    # ════════════════════════════════════════════════════════════════
    # R67 P0-02: Compose 配置 fail-closed 校验
    #   删除 `2>/dev/null || true`,保留完整 stderr。
    #   使用安全占位环境变量(不写入真实 secret)。
    #   对所有生产 profiles 执行 docker compose config。
    #   生成 canonical rendered compose artifact。
    # ════════════════════════════════════════════════════════════════
    - name: Prepare safe placeholder env (no real secrets)
      run: |
        # 创建安全占位 .env 文件(仅用于 docker compose config 解析)
        # R67 P0-02: 占位值绝不写入真实 secret;CI 退出后自动清理
        cat > .env.deploy-check <<'EOF'
        # R67 P0-02: deploy-check 占位 env(不写入真实 secret)
        REDIS_HEALTH_PASSWORD=placeholder_health_pwd_for_compose_config_only
        REDIS_WRITER_PASSWORD=placeholder_writer_pwd_for_compose_config_only
        REDIS_READER_PASSWORD=placeholder_reader_pwd_for_compose_config_only
        REDIS_ADMIN_PASSWORD=placeholder_admin_pwd_for_compose_config_only
        EOF
        # 创建空 .env.shared 占位(防止 env_file 加载失败)
        # 真实部署中 .env.shared 由 deploy 脚本从 .env.secrets.<service> 派生
        touch .env.shared
        # 为每个业务服务创建空 .env.secrets.<service>(compose config 解析需要)
        for svc in up idx dsp mon admin_bot admin db_backup crdb_sync db_writer migration; do
          touch ".env.secrets.${svc}"
        done
        echo "✓ Safe placeholder env prepared (no real secrets)"

    # R67 P0-02: 对所有生产 profiles 执行 docker compose config(fail-closed)
    #   - 删除 2>/dev/null(保留 stderr 用于诊断)
    #   - 删除 || true(失败立即退出)
    #   - 输出 canonical rendered config 到文件,绑定 source commit/tree/digest
    - name: Verify Compose config (fail-closed, all profiles)
      env:
        SOURCE_COMMIT: ${{ github.sha }}
        SOURCE_TREE: ${{ github.event.head_commit.tree.sha || '' }}
      run: |
        set -euo pipefail
        echo "=== R67 P0-02: Compose config fail-closed 校验 ==="
        echo "Source commit: ${SOURCE_COMMIT:0:12}"
        echo "Source tree: ${SOURCE_TREE:0:12}"

        # 收集所有 profiles
        PROFILES=$(python -c "
        import yaml
        with open('docker-compose.yml') as f:
            data = yaml.safe_load(f)
        profiles = set()
        for svc_name, svc_def in data.get('services', {}).items():
            sp = svc_def.get('profiles', [])
            if isinstance(sp, list):
                profiles.update(sp)
        print(' '.join(sorted(profiles)))
        ")
        echo "Detected profiles: ${PROFILES:-<none>}"

        # 1. 默认 profile(migration 服务通常无 profile)
        echo ""
        echo "--- docker compose config (default) ---"
        docker compose --env-file .env.deploy-check config --quiet

        # 2. 对每个 profile 执行 config
        for profile in ${PROFILES}; do
          echo ""
          echo "--- docker compose config --profile ${profile} ---"
          docker compose --env-file .env.deploy-check --profile "${profile}" config --quiet
        done

        # 3. 生成 canonical rendered compose artifact(绑定 source commit/tree)
        echo ""
        echo "--- 生成 canonical rendered compose artifact ---"
        docker compose --env-file .env.deploy-check config > rendered-compose.yml
        python3 -c "
        import hashlib, json, subprocess, os
        source_commit = os.environ.get('SOURCE_COMMIT', '')
        source_tree = os.environ.get('SOURCE_TREE', '')
        with open('rendered-compose.yml', 'rb') as f:
            content = f.read()
        config_digest = hashlib.sha256(content).hexdigest()
        # 生成 metadata 文件
        metadata = {
            'source_commit': source_commit,
            'source_tree': source_tree,
            'config_digest': config_digest,
            'workflow_run': os.environ.get('GITHUB_RUN_ID', ''),
            'generated_at': subprocess.check_output(['date', '-u', '+%Y-%m-%dT%H:%M:%SZ']).decode().strip(),
            'compose_file': 'docker-compose.yml',
            'rendered_file': 'rendered-compose.yml',
            'size_bytes': len(content),
        }
        with open('rendered-compose-metadata.json', 'w') as f:
            json.dump(metadata, f, indent=2)
        print(f'Config digest: {config_digest}')
        print(f'Source commit: {source_commit[:12]}')
        print(f'Size: {len(content)} bytes')
        "

    # R67 P0-02: Compose 标准字段校验(禁用 env_file_secrets 非标准字段)
    - name: Verify Compose standard fields
      run: |
        python -c "
        import yaml
        with open('docker-compose.yml') as f:
            data = yaml.safe_load(f)
        for svc_name, svc_def in data.get('services', {}).items():
            # R37 P0-1: 禁止使用非标准的 env_file_secrets 字段
            assert 'env_file_secrets' not in svc_def, (
                f'{svc_name} 使用了非标准的 env_file_secrets 字段,'
                f'应改用 env_file(Compose 标准字段)'
            )
        print('Compose 标准字段校验通过(无 env_file_secrets)')
        "

    # R67 P0-02: 完整 Compose 字段校验(secrets/configs/networks/volumes/
    #   depends_on/healthcheck/restart/user/read_only/cap_drop/security_opt/
    #   tmpfs/resource limits/migration ordering)
    - name: Verify Compose security and ordering constraints
      run: |
        python -c "
        import yaml
        with open('docker-compose.yml') as f:
            data = yaml.safe_load(f)
        services = data.get('services', {})

        # 业务服务必须配置安全加固
        business_svcs = ['up', 'idx', 'dsp', 'mon', 'admin_bot', 'admin', 'db_backup', 'crdb_sync', 'db_writer']
        for svc_name in business_svcs:
            svc_def = services.get(svc_name, {})
            # 非 root 用户(若镜像内置非 root 可放宽,但建议显式 user)
            # 至少必须有 cap_drop: ALL
            cap_drop = svc_def.get('cap_drop', [])
            if 'ALL' not in cap_drop:
                print(f'WARN: {svc_name} 未配置 cap_drop: ALL(强烈建议)')
            # security_opt: no-new-privileges
            security_opt = svc_def.get('security_opt', [])
            if 'no-new-privileges:true' not in security_opt:
                print(f'WARN: {svc_name} 未配置 security_opt: no-new-privileges:true')

        # migration 必须先于业务服务(depends_on 或 healthcheck)
        # redis-acl-init 必须先于 redis
        # 这些约束由 compose depends_on 保证,这里仅校验关键约束
        redis_acl_init = services.get('redis-acl-init', {})
        redis_def = services.get('redis', {})
        if redis_def and redis_acl_init:
            redis_deps = redis_def.get('depends_on', {})
            if isinstance(redis_deps, dict):
                assert 'redis-acl-init' in redis_deps, 'redis 必须依赖 redis-acl-init'
                assert redis_deps['redis-acl-init'].get('condition') in ('service_completed_successfully', 'service_healthy'), (
                    'redis 必须等待 redis-acl-init 完成(service_completed_successfully)'
                )
            elif isinstance(redis_deps, list):
                assert 'redis-acl-init' in redis_deps, 'redis 必须依赖 redis-acl-init'

        # 业务服务必须依赖 redis(若使用 redis)
        for svc_name in business_svcs:
            svc_def = services.get(svc_name, {})
            env_file = svc_def.get('env_file', [])
            if any('.env.shared' in ef for ef in env_file):
                # 使用 .env.shared 的服务通常需要 redis
                deps = svc_def.get('depends_on', {})
                if isinstance(deps, dict):
                    if 'redis' not in deps and 'redis-healthy' not in deps:
                        print(f'INFO: {svc_name} 未显式 depends_on redis(可能通过 healthcheck 间接依赖)')

        print('Compose 安全与排序约束校验通过')
        "

    # R67 P0-02 / P1-09 / R69 Wave 7: 最小静态配置校验
    #   R69 Wave 7: 原 "Minimal runtime smoke" 命名误导(此步骤只做 config 解析,
    #   不启动任何容器,不验证真实运行时行为)。重命名为 "Minimal compose config
    #   validation" 以反映其真实能力。真实运行态 smoke 由 release-gates.yml
    #   的 runtime-smoke-compose job 执行(scripts/runtime_smoke_compose.py)。
    - name: Minimal compose config validation (static, not runtime smoke)
      run: |
        set -euo pipefail
        echo "=== R67 P0-02 / P1-09 / R69 Wave 7: 最小 compose config 静态校验 ==="
        echo "(R69 Wave 7: 此步骤是静态 config 校验,不是运行态 smoke;"
        echo " 真实运行态 smoke 由 runtime_smoke_compose.py 在 release-gates.yml 执行)"
        # 验证 rendered-compose.yml 可被 docker compose 解析
        docker compose -f rendered-compose.yml --env-file .env.deploy-check config --quiet
        echo "✓ Rendered compose 可被 docker compose 解析"

    # R67 P0-02: 负向测试 — 主动注入无效 Compose,证明门禁必然失败
    - name: Negative test — invalid Compose must fail
      run: |
        set -euo pipefail
        echo "=== R67 P0-02: 负向测试 — 注入无效 Compose ==="
        # 备份原文件
        cp docker-compose.yml docker-compose.yml.bak
        # 注入无效 YAML(语法错误)
        cat > docker-compose.yml.invalid <<'EOF'
        services:
          invalid-svc:
            image: alpine
            # 故意制造语法错误:未闭合的引号
            command: "echo "unclosed quote
        EOF
        # 替换为无效文件
        mv docker-compose.yml docker-compose.yml.valid
        mv docker-compose.yml.invalid docker-compose.yml

        # 验证 docker compose config 必然失败(fail-closed)
        if docker compose --env-file .env.deploy-check config --quiet 2>/dev/null; then
          echo "FAIL: 无效 Compose 通过了 config 校验(门禁失效)"
          # 恢复原文件
          mv docker-compose.yml docker-compose.yml.invalid
          mv docker-compose.yml.valid docker-compose.yml
          exit 1
        else
          echo "✓ 无效 Compose 被正确拒绝(fail-closed)"
        fi

        # 恢复原文件
        mv docker-compose.yml docker-compose.yml.invalid
        mv docker-compose.yml.valid docker-compose.yml
        rm -f docker-compose.yml.invalid docker-compose.yml.bak
        echo "✓ 负向测试通过"

    # R67 P0-02: 上传 canonical rendered compose artifact
    - name: Upload rendered compose artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rendered-compose-${{ github.sha }}
        path: |
          rendered-compose.yml
          rendered-compose-metadata.json
        retention-days: 30

    # R67 P0-02: 清理占位 env 文件(防止泄露占位值)
    - name: Cleanup placeholder env
      if: always()
      run: |
        rm -f .env.deploy-check .env.shared
        rm -f .env.secrets.up .env.secrets.idx .env.secrets.dsp .env.secrets.mon
        rm -f .env.secrets.admin_bot .env.secrets.admin .env.secrets.db_backup
        rm -f .env.secrets.crdb_sync .env.secrets.db_writer .env.secrets.migration
        echo "✓ 占位 env 已清理"

    # R37 P1-7 / R40 P2-1: Branch protection 配置说明
    # 注意: branch protection 必须通过 GitHub API/UI 配置,无法在 workflow 中定义
    # 必需检查(required checks):
    #   - test (矩阵 3.10/3.11/3.12) — 至少一个 context 通过即可,建议三个全 required
    #   - lint
    #   - security (bandit)  ← R40 P2-1 新增
    #   - deploy-check / verify-deploy
    #   - release-gates (Compose config + migration dry-run + SBOM + 依赖扫描)
    # 配置命令(需管理员 PAT):
    #   gh api repos/:owner/:repo/branches/master/protection -X PUT \
    #     -f required_status_checks[strict]=true \
    #     -f required_status_checks[contexts][]="test (3.10)" \
    #     -f required_status_checks[contexts][]="test (3.11)" \
    #     -f required_status_checks[contexts][]="test (3.12)" \
    #     -f required_status_checks[contexts][]="lint" \
    #     -f required_status_checks[contexts][]="security" \
    #     -f required_status_checks[contexts][]="deploy-check / verify-deploy" \
    #     -f required_status_checks[contexts][]="release-gates" \
    #     -f enforce_admins=true \
    #     -f required_pull_request_reviews[required_approving_review_count]=1
    - name: Document branch protection requirements
      run: |
        echo "R37 P1-7 / R40 P2-1: Branch protection 配置说明"
        echo "必需检查(required checks):"
        echo "  - test (矩阵 3.10/3.11/3.12)"
        echo "  - lint"
        echo "  - security (bandit)  ← R40 P2-1 新增"
        echo "  - deploy-check / verify-deploy"
        echo "  - release-gates (Compose config + migration dry-run + SBOM + 依赖扫描)"
        echo "配置方法: 使用 GitHub API/UI 设置 branch protection rules"
        echo "参考: https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"
