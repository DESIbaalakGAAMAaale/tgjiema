name: Promote RC

# ══════════════════════════════════════════════════════════════════════
# R73 §5.6 (P0-07): Thin wrapper — delegates to single reusable workflow
# ══════════════════════════════════════════════════════════════════════
#
# 整改背景:
#   R73 §5.6 要求仓库中只允许存在 ONE production promotion 实现。
#   旧版本 (R72 P0-15) 的 promote-rc.yml 包含完整的内联晋级逻辑:
#     - gh run view 查询 RC run
#     - docker pull + RepoDigest 校验
#     - GPG 签名配置 + git tag -s 创建 signed production tag
#   与 release-gates.yml 的 production-promotion-gate / verify-rc-identity
#   形成两套平行晋级实现,违反 R73 §5.6 单一实现要求。
#
# 整改方案 (thin wrapper):
#   - 保留 workflow_dispatch 入口(运维手动触发,提供完整 RC 身份字段)
#   - 删除所有内联晋级逻辑 (gh run view / docker pull / GPG / git tag -s)
#   - Body 为单一 uses: ./.github/workflows/_promote-verified-rc.yml
#     所有晋级步骤 (a-p) 委托给 reusable workflow
#   - inputs 透传 (with:),不做任何本地校验
#
# 与 _promote-verified-rc.yml 的关系:
#   - _promote-verified-rc.yml: SINGLE reusable promotion workflow (steps a-p)
#   - promote-rc.yml (R73 §5.6): thin wrapper,workflow_dispatch → reusable call
#   - release-gates.yml (R73 §5.6): workflow_dispatch → reusable call
#     (production-v* tag push 仍保留 production-promotion-gate 作为冗余验证)
#
# 整改规范:
#   - 禁止 TODO 注释、pass 占位符、其他占位符
#   - 禁止 skip / warn / 吞异常 (所有校验 fail-closed,由 reusable workflow 保证)
#   - 本文件不包含任何 gh run list / gh run view / git tag / docker pull /
#     部署触发逻辑 — 全部委托给 _promote-verified-rc.yml

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag to promote (e.g. rc-v1.0.0)'
        required: true
        type: string
      rc_run_id:
        description: 'Release-gates.yml workflow run ID for the RC tag (must be successful)'
        required: true
        type: string
      rc_run_attempt:
        description: 'RC workflow run attempt number (must match the successful run)'
        required: true
        type: string
        default: '1'
      source_sha:
        description: 'Source commit SHA the RC was built from (40-char hex, must match rc_tag commit)'
        required: true
        type: string
      candidate_manifest_digest:
        description: 'Candidate manifest digest (sha256:<64-hex>) from RC run'
        required: true
        type: string
      image_repo_digest:
        description: 'Image RepoDigest (ghcr.io/<repo>@sha256:<64-hex>) from RC run'
        required: true
        type: string
      runtime_config_digest:
        description: 'Runtime config digest (sha256:<64-hex>) from RC run (host config binding)'
        required: true
        type: string
      typed_confirmation:
        description: 'Type PROMOTE-RC-TO-PRODUCTION to confirm'
        required: true
        type: string
      production_tag:
        description: 'Production tag to create (e.g. production-v1.0.0, format production-vX.Y.Z)'
        required: true
        type: string

# Production 晋级不可取消(避免半完成状态)
concurrency:
  group: promote-rc-${{ github.ref }}-${{ inputs.production_tag }}
  cancel-in-progress: false

permissions:
  contents: write   # 委托给 reusable workflow (创建并推送 signed production tag)
  packages: read    # 委托给 reusable workflow (docker pull RepoDigest)
  deployments: write  # 委托给 reusable workflow (production deployment record)
  id-token: write   # 委托给 reusable workflow (OIDC keyless signing)

jobs:
  # ─── R73 §5.6 (P0-07): Thin wrapper — delegate to reusable workflow ──
  # 所有晋级步骤 (a-p) 由 _promote-verified-rc.yml 实现:
  #   a.  Checkout at source_sha
  #   b.  Download RC artifacts
  #   c.  Verify RC tag signature (gh api + git verify-tag)
  #   d.  Peel RC tag commit == source_sha
  #   e.  Verify run event=push, ref=refs/tags/${rc_tag}
  #   f.  Verify run conclusion=success, attempt matches
  #   g.  Verify candidate manifest digest
  #   h.  Recompute all artifact digests
  #   i.  Verify image/runtime_config/SBOM/provenance/OCI digests
  #   j.  scan_production_bypasses.py (no P0/P1)
  #   k.  verify_rc_3x.py (rc gate level)
  #   l.  No open break-glass events
  #   m.  typed_confirmation verified
  #   n.  Production tag did not exist
  #   o.  Signed production tag created + pushed
  #   p.  Production deployment trigger recorded
  promote-via-reusable-workflow:
    uses: ./.github/workflows/_promote-verified-rc.yml
    with:
      rc_tag: ${{ inputs.rc_tag }}
      rc_run_id: ${{ inputs.rc_run_id }}
      rc_run_attempt: ${{ inputs.rc_run_attempt }}
      source_sha: ${{ inputs.source_sha }}
      candidate_manifest_digest: ${{ inputs.candidate_manifest_digest }}
      image_repo_digest: ${{ inputs.image_repo_digest }}
      runtime_config_digest: ${{ inputs.runtime_config_digest }}
      typed_confirmation: ${{ inputs.typed_confirmation }}
      production_tag: ${{ inputs.production_tag }}
