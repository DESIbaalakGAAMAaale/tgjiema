name: E2E Tests

# R44: 端到端测试(Playwright),SHA pin 所有 actions 引用避免供应链漂移
# R46 P0-6: 增加 push 触发 + 并发控制 + 超时
# R47 P0-3: 修复 Playwright 环境 + Admin bootstrap + 临时 SQLite + readiness 检查
# R48 P0-3: 整改 readiness 显式 JSONResponse(200/503) + 显式 webServer env
#           + CI 失败排查辅助(curl readiness / ls sqlite / 查询 admin_principals)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R47 P0-3: 测试环境变量(每个 run 独立,不污染)
      # R48 P0-3: DATABASE_URL 在 job 级别设置,确保 bootstrap 步骤和
      #           webServer(通过 playwright.config.ts env)连接同一 SQLite 文件
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
      BOT_TOKEN: test_token
      ADMIN_BOOTSTRAP_PASSWORD: test_bootstrap_pw
      SECRET_KEY: test_secret_key_for_e2e_only
      # Admin 凭证配置(SERVICE_ROLE=admin 跳过其他 Bot Token 校验)
      ADMIN_USERNAME: admin
      ADMIN_PRINCIPAL_ID: "1"
      ADMIN_PRINCIPAL_USERNAME: admin
      ADMIN_PRINCIPAL_BOOTSTRAP_ROLES: super_admin
      SERVICE_ROLE: admin
      CSRF_COOKIE_SECURE: "false"
      BREAK_GLASS_PASSWORD: test_bootstrap_pw
      ADMIN_WEB_HOST: "127.0.0.1"
      ADMIN_WEB_PORT: "8080"
      # Playwright 测试用登录密码(明文,对应 ADMIN_PASSWORD 哈希前的值)
      ADMIN_TEST_PASSWORD: test_bootstrap_pw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium

      # R47/R48 P0-3: 生成 ADMIN_PASSWORD 的 PBKDF2 哈希(与 admin._verify_password 兼容)
      # 不导入项目代码,避免 Settings 校验(此时 ADMIN_PASSWORD 尚未设置);仅用标准库生成哈希
      # R48 验证: hash 格式 $pbkdf2-sha256$200000$<salt_hex>$<hash_hex>(split by $ → 5 parts)
      #           _verify_password 解析: parts[2]=iterations, parts[3]=salt, parts[4]=hash
      # R50 P0-1: 修复 $ 在 shell/GITHUB_ENV 中被变量展开的问题
      #           改用临时 Python 脚本文件 + heredoc 'PYEOF'(单引号防 shell 展开 $)
      #           仅输出格式元数据,不暴露完整 hash;printf 写入 GITHUB_ENV 避免 echo 解析
      - name: Generate admin password hash
        run: |
          # R50 P0-1: 把 Python 脚本写入临时文件,避免 python -c 多层引号 + $ 转义
          cat > /tmp/gen_admin_hash.py <<'PYEOF'
          import hashlib, secrets, sys
          PASSWORD = "test_bootstrap_pw"
          ITERATIONS = 200000
          salt = secrets.token_bytes(16)
          h = hashlib.pbkdf2_hmac("sha256", PASSWORD.encode("utf-8"), salt, ITERATIONS)
          # 输出 hash 到 stdout(只输出 hash,不含其他内容)
          print(f"$pbkdf2-sha256${ITERATIONS}${salt.hex()}${h.hex()}")
          PYEOF
          HASH=$(python /tmp/gen_admin_hash.py)
          # R50 P0-1: 用 printf 写入 GITHUB_ENV,避免 echo 解析 $ 等特殊字符
          printf 'ADMIN_PASSWORD=%s\n' "$HASH" >> "$GITHUB_ENV"
          # R50 P0-1: 验证 hash 格式元数据(不输出完整 hash,只输出前 32 字符前缀)
          python -c "
          import os, re
          h = os.environ['ADMIN_PASSWORD']
          parts = h.split('$')
          assert len(parts) == 5, f'hash parts count != 5: {len(parts)}'
          assert parts[1] == 'pbkdf2-sha256', f'wrong algorithm: {parts[1]}'
          assert int(parts[2]) == 200000, f'wrong iterations: {parts[2]}'
          salt_len = len(parts[3])
          hash_len = len(parts[4])
          assert salt_len == 32, f'salt_hex length != 32: {salt_len}'
          assert hash_len == 64, f'hash_hex length != 64: {hash_len}'
          print(f'[R50 P0-1] hash format OK: algo={parts[1]} iter={parts[2]} salt_hex_len={salt_len} hash_hex_len={hash_len}')
          print(f'[R50 P0-1] hash prefix (first 32 chars only): {h[:32]}...')
          "

      # R50 P0-1: 独立验证步骤 — 使用项目 admin._verify_password() 对 hash 做正向 + 反向断言
      # 位于 hash 生成之后、Bootstrap 之前;若此步失败,后续 Bootstrap/Playwright 不应执行
      - name: Verify password hash with _verify_password
        env:
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          cat > /tmp/verify_admin_hash.py <<'PYEOF'
          import sys, os
          sys.path.insert(0, ".")
          # 仅导入 _verify_password,避免触发 Settings 完整校验
          # 用 importlib 防止 admin 模块初始化副作用
          import importlib.util
          spec = importlib.util.spec_from_file_location("admin_verify", "admin/__init__.py")
          mod = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(mod)
          except Exception as e:
              print(f"[WARN] admin 模块导入失败(可能因 Settings 校验,改用纯 PBKDF2 验证): {e}")
              # 退化路径:直接用 hashlib 验证 hash 格式正确性
              import hashlib
              h = os.environ["ADMIN_PASSWORD"]
              parts = h.split("$")
              assert len(parts) == 5
              salt = bytes.fromhex(parts[3])
              expected = bytes.fromhex(parts[4])
              actual = hashlib.pbkdf2_hmac("sha256", b"test_bootstrap_pw", salt, int(parts[2]))
              assert actual == expected, "PBKDF2 hash mismatch"
              print("[R50 P0-1] PBKDF2 hash verified via fallback (admin module import failed)")
              sys.exit(0)
          # 主路径:使用 admin._verify_password
          ok = mod._verify_password("test_bootstrap_pw", os.environ["ADMIN_PASSWORD"])
          assert ok, "_verify_password should accept test_bootstrap_pw"
          bad = mod._verify_password("wrong_password", os.environ["ADMIN_PASSWORD"])
          assert not bad, "_verify_password should reject wrong_password"
          print("[R50 P0-1] _verify_password 验证通过: correct pw=ok, wrong pw=rejected")
          PYEOF
          python /tmp/verify_admin_hash.py

      # R47/R48 P0-3: 初始化临时 SQLite + bootstrap admin principal
      # 必须在 Web 服务启动前完成,否则 startup 的 ensure_readiness_or_exit 会退出
      # R48: 显式传递 DATABASE_URL(与 job env 一致,确保连接同一 SQLite 文件)
      - name: Bootstrap admin principal
        env:
          DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
        run: |
          python -c "
          import asyncio, os
          from database.cache_store import get_cache_store, DB_PATH
          from admin import bootstrap_admin_principal

          # R48: 验证 DB_PATH 解析自 DATABASE_URL
          print(f'[E2E bootstrap] DATABASE_URL={os.environ.get(\"DATABASE_URL\")}')
          print(f'[E2E bootstrap] DB_PATH={DB_PATH}')
          assert str(DB_PATH) == '/tmp/e2e_${{ github.run_id }}.db', \
              f'DB_PATH mismatch: {DB_PATH} != /tmp/e2e_${{ github.run_id }}.db'

          async def main():
              store = get_cache_store()
              await store.init()
              ok = await bootstrap_admin_principal()
              if not ok:
                  raise RuntimeError('bootstrap_admin_principal 失败')
              print(f'[E2E bootstrap] OK: principal_id={os.environ.get(\"ADMIN_PRINCIPAL_ID\")} db={os.environ.get(\"DATABASE_URL\")}')
              await store.close()

          asyncio.run(main())
          "

      # R48 P0-3: 验证 SQLite 文件存在 + admin_principals 表有记录
      - name: Verify bootstrap persisted
        env:
          DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
        run: |
          echo "[R48] 验证 SQLite 文件存在:"
          ls -la /tmp/e2e_${{ github.run_id }}.db
          echo ""
          echo "[R48] 查询 admin_principals 表:"
          python -c "
          import sqlite3
          conn = sqlite3.connect('/tmp/e2e_${{ github.run_id }}.db')
          rows = conn.execute('SELECT id, username, is_active FROM admin_principals').fetchall()
          print(f'admin_principals: {rows}')
          roles = conn.execute('SELECT principal_id, role_name FROM admin_principal_roles').fetchall()
          print(f'admin_principal_roles: {roles}')
          assert len(rows) > 0, 'admin_principals 表为空'
          assert any('super_admin' in r[1] for r in roles), '无 super_admin 角色'
          print('[R48] bootstrap 验证通过')
          conn.close()
          "

      # R47/R48 P0-3: 运行 Playwright E2E 测试
      # webServer(在 playwright.config.ts 中定义)会自动启动 admin 服务并轮询 /readiness
      # R48: playwright.config.ts 显式传递 DATABASE_URL 等 env 给 webServer 子进程
      - name: Run Playwright E2E tests
        id: playwright
        run: |
          cd tests/e2e
          npx playwright test

      # R48 P0-3: CI 失败排查辅助 — 在 Playwright 步骤失败时输出诊断信息
      - name: Debug - readiness response on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] curl /readiness (尝试连接 admin 服务) ==="
          curl -v -sS --max-time 10 http://127.0.0.1:8080/readiness || echo "(curl 失败,服务可能未启动)"
          echo ""
          echo "=== [R48 Debug] 检查 admin 进程 ==="
          ps aux | grep -E "uvicorn|admin:app" | grep -v grep || echo "(无 uvicorn 进程)"
          echo ""
          echo "=== [R48 Debug] 检查端口 8080 监听 ==="
          ss -tlnp | grep 8080 || echo "(端口 8080 未监听)"

      - name: Debug - SQLite file on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] SQLite 文件存在性 ==="
          ls -la /tmp/e2e_*.db 2>/dev/null || echo "(无 e2e SQLite 文件)"
          echo ""
          echo "=== [R48 Debug] SQLite admin_principals 内容 ==="
          python -c "
          import sqlite3, glob, os
          files = glob.glob('/tmp/e2e_*.db')
          if not files:
              print('(无 SQLite 文件)')
          for f in files:
              print(f'\n--- {f} ---')
              try:
                  conn = sqlite3.connect(f)
                  tables = conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()
                  print(f'tables: {[t[0] for t in tables]}')
                  if any('admin_principals' in t[0] for t in tables):
                      rows = conn.execute('SELECT id, username, is_active FROM admin_principals').fetchall()
                      print(f'admin_principals: {rows}')
                      roles = conn.execute('SELECT principal_id, role_name FROM admin_principal_roles').fetchall()
                      print(f'admin_principal_roles: {roles}')
                  conn.close()
              except Exception as e:
                  print(f'查询失败: {e}')
          " || echo "(Python 查询失败)"

      - name: Debug - admin log on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] admin 日志(stderr 输出) ==="
          # Playwright webServer 的 stdout/stderr 会被捕获到 test-results 中
          if [ -f tests/e2e/test-results/.web-server-stdout.txt ]; then
            echo "--- webServer stdout ---"
            cat tests/e2e/test-results/.web-server-stdout.txt | tail -100
          fi
          if [ -f tests/e2e/test-results/.web-server-stderr.txt ]; then
            echo "--- webServer stderr ---"
            cat tests/e2e/test-results/.web-server-stderr.txt | tail -100
          fi
          # Playwright 的 webServer 日志也可能在 playwright-report 中
          echo ""
          echo "=== [R48 Debug] 检查 Playwright webServer 日志 ==="
          find tests/e2e -name "*.txt" -path "*web-server*" -exec echo "--- {} ---" \; -exec tail -50 {} \; 2>/dev/null || echo "(无 webServer 日志文件)"

      # R47/R48 P0-3: 失败时保留 trace、video、screenshot、axe JSON artifact
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/e2e-results/

      - name: Upload axe accessibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axe-accessibility-reports
          path: tests/e2e/e2e-results/axe-*.json
          if-no-files-found: warn
