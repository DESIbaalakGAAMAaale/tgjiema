name: E2E Tests

# R44: 端到端测试(Playwright),SHA pin 所有 actions 引用避免供应链漂移
# R46 P0-6: 增加 push 触发 + 并发控制 + 超时
# R47 P0-3: 修复 Playwright 环境 + Admin bootstrap + 临时 SQLite + readiness 检查
# R48 P0-3: 整改 readiness 显式 JSONResponse(200/503) + 显式 webServer env
#           + CI 失败排查辅助(curl readiness / ls sqlite / 查询 admin_principals)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R47 P0-3: 测试环境变量(每个 run 独立,不污染)
      # R48 P0-3: DATABASE_URL 在 job 级别设置,确保 bootstrap 步骤和
      #           webServer(通过 playwright.config.ts env)连接同一 SQLite 文件
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
      BOT_TOKEN: test_token
      ADMIN_BOOTSTRAP_PASSWORD: test_bootstrap_pw
      SECRET_KEY: test_secret_key_for_e2e_only
      # Admin 凭证配置(SERVICE_ROLE=admin 跳过其他 Bot Token 校验)
      ADMIN_USERNAME: admin
      ADMIN_PRINCIPAL_ID: "1"
      ADMIN_PRINCIPAL_USERNAME: admin
      ADMIN_PRINCIPAL_BOOTSTRAP_ROLES: super_admin
      SERVICE_ROLE: admin
      CSRF_COOKIE_SECURE: "false"
      BREAK_GLASS_PASSWORD: test_bootstrap_pw
      ADMIN_WEB_HOST: "127.0.0.1"
      ADMIN_WEB_PORT: "8080"
      # Playwright 测试用登录密码(明文,对应 ADMIN_PASSWORD 哈希前的值)
      ADMIN_TEST_PASSWORD: test_bootstrap_pw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium
          # R65 P1-02: testDir='..' 同时运行 tests/e2e/ + tests/a11y/ 测试。
          # tests/a11y/*.spec.ts 需要解析 @playwright/test,但 npm install 在
          # tests/e2e/ 完成,node_modules 仅在 tests/e2e/node_modules/。
          # Node 模块解析从文件位置向上查找:tests/a11y/ → tests/ → /。
          # 创建 tests/a11y/node_modules 符号链接指向 tests/e2e/node_modules,
          # 使 tests/a11y/*.spec.ts 能解析 @playwright/test / @axe-core/playwright。
          ln -sfn "$PWD/node_modules" ../a11y/node_modules
          ls -la ../a11y/node_modules | head -1

      # ════════════════════════════════════════════════════════════
      # R62 P1-06: a11y 测试预检查 — 在 Playwright 运行前硬失败检测假绿条件
      #
      # 审计 P1-06: 旧实现 try/catch require + stub replacement 导致
      #   依赖缺失时 test.describe 自动 skip → 0 用例 = 绿色 CI(假绿)。
      # 整改: 以下预检查必须全部通过才允许运行测试,
      #   任一失败即 exit 1(禁止 continue-on-error: true)。
      # ════════════════════════════════════════════════════════════

      # R62 P1-06 检查 1/4: 依赖检查 — @playwright/test + @axe-core/playwright 可 require
      - name: "R62 P1-06: Verify a11y test dependencies"
        run: |
          cd tests/e2e
          echo "[R62 P1-06] 检查 1/4: 验证 @playwright/test + @axe-core/playwright 已安装"
          node -e "require('@playwright/test') || (console.error('MISSING: @playwright/test'), process.exit(1))"
          node -e "require('@axe-core/playwright') || (console.error('MISSING: @axe-core/playwright'), process.exit(1))"
          echo "[R62 P1-06] 依赖检查通过"

      # R62 P1-06 检查 2/4: 用例数检查 — > 0(检测 stub 替换导致的 0 用例假绿)
      - name: "R62 P1-06: Verify a11y test case count > 0"
        run: |
          cd tests/e2e
          echo "[R62 P1-06] 检查 2/4: 验证 a11y 测试用例数 > 0(检测 stub 替换)"
          COUNT=$(npx playwright test --list accessibility_behavior.spec.ts 2>/dev/null | grep -c ".*" || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: 0 a11y test cases found — stub replacement detected"
            echo "[R62 P1-06] 预检查失败: 用例数为 0(检测到 stub 替换或 spec 文件加载失败)"
            exit 1
          fi
          echo "Found $COUNT a11y test cases"
          echo "[R62 P1-06] 用例数检查通过($COUNT 个用例)"

      # R62 P1-06 检查 3/4: locale 覆盖检查 — zh-CN + en-US 都必须有对应用例
      # /login en-US 旧实现复用 zh-CN 结果(跳过 /locale 切换),导致 en-US 实际未执行
      - name: "R62 P1-06: Verify locale coverage (zh-CN + en-US)"
        run: |
          cd tests/e2e
          echo "[R62 P1-06] 检查 3/4: 验证 zh-CN + en-US locale 都有对应用例"
          LISTING=$(npx playwright test --list accessibility_behavior.spec.ts 2>/dev/null || echo "")
          if [ -z "$LISTING" ]; then
            echo "ERROR: 无法列出测试用例(npx playwright test --list 失败)"
            exit 1
          fi
          ZH_COUNT=$(echo "$LISTING" | grep -c "zh-CN" || echo 0)
          EN_COUNT=$(echo "$LISTING" | grep -c "en-US" || echo 0)
          echo "zh-CN 用例数: $ZH_COUNT"
          echo "en-US 用例数: $EN_COUNT"
          if [ "$ZH_COUNT" -eq 0 ]; then
            echo "ERROR: 0 个 zh-CN locale 用例 — zh-CN 未被执行"
            exit 1
          fi
          if [ "$EN_COUNT" -eq 0 ]; then
            echo "ERROR: 0 个 en-US locale 用例 — en-US 未被执行(可能复用 zh-CN 结果)"
            exit 1
          fi
          echo "[R62 P1-06] locale 覆盖检查通过(zh-CN: $ZH_COUNT, en-US: $EN_COUNT)"

      # R62 P1-06 检查 4/4: 路由元数据完整性 — 每条 a11y_testable 用例必须有 path/route_path/method/permission
      - name: "R62 P1-06: Verify route metadata completeness"
        run: |
          echo "[R62 P1-06] 检查 4/4: 验证路由元数据完整性(path/route_path/method/permission)"
          python scripts/check_a11y_precheck.py --skip-node-require --skip-playwright || (
            echo "[R62 P1-06] 预检查失败: 路由元数据不完整或上述检查未通过"
            exit 1
          )

      # R52 P0-1: 生成 ADMIN_PASSWORD 的 PBKDF2 哈希(与 admin.passwords.verify_password 兼容)
      # 修复根因: 原实现在同一 step 内 printf 写入 $GITHUB_ENV 后立即用 Python 读取
      #   os.environ['ADMIN_PASSWORD'],但 $GITHUB_ENV 只对后续 steps 生效,
      #   当前 step 读取不到变量,导致格式校验失败。
      # 方案: export 让当前 step 后续命令可用 + 写入 $GITHUB_ENV 让后续 steps 可用;
      #   格式校验移到独立 step;不输出 hash 任何部分(安全考虑)。
      - name: Generate admin password hash
        run: |
          cat > /tmp/gen_admin_hash.py <<'PYEOF'
          import hashlib, secrets
          PASSWORD = "test_bootstrap_pw"
          ITERATIONS = 200000
          salt = secrets.token_bytes(16)
          h = hashlib.pbkdf2_hmac("sha256", PASSWORD.encode("utf-8"), salt, ITERATIONS)
          print(f"$pbkdf2-sha256${ITERATIONS}${salt.hex()}${h.hex()}")
          PYEOF
          HASH=$(python /tmp/gen_admin_hash.py)
          # R52 P0-1: export 让当前 step 后续命令可用
          export ADMIN_PASSWORD="$HASH"
          # R52 P0-1: 写入 $GITHUB_ENV 让后续 steps 可用
          echo "ADMIN_PASSWORD=$HASH" >> "$GITHUB_ENV"
          # R52 P0-1: 不输出 hash 任何部分(安全考虑)
          echo "[R52 P0-1] admin password hash generated successfully"

      # R52 P0-1: 格式校验独立 step(读取上一 step 写入 $GITHUB_ENV 的 ADMIN_PASSWORD)
      - name: Verify password hash format
        env:
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          python -c "
          import os, re
          h = os.environ['ADMIN_PASSWORD']
          parts = h.split('$')
          assert len(parts) == 5, f'hash parts count != 5: {len(parts)}'
          assert parts[1] == 'pbkdf2-sha256', f'wrong algorithm: {parts[1]}'
          assert int(parts[2]) == 200000, f'wrong iterations: {parts[2]}'
          assert len(parts[3]) == 32, f'salt_hex length != 32: {len(parts[3])}'
          assert len(parts[4]) == 64, f'hash_hex length != 64: {len(parts[4])}'
          print('[R52 P0-1] hash format OK')
          "

      # R52 P0-1: 用纯模块 admin.passwords.verify_password 做正向 + 反向断言
      # passwords.py 无 Settings 依赖,避免 import 整个 admin/__init__.py 的副作用
      - name: Verify password with admin.passwords module
        env:
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from admin.passwords import verify_password
          ok = verify_password('test_bootstrap_pw', os.environ['ADMIN_PASSWORD'])
          assert ok, 'verify_password should accept test_bootstrap_pw'
          bad = verify_password('wrong_password', os.environ['ADMIN_PASSWORD'])
          assert not bad, 'verify_password should reject wrong_password'
          print('[R52 P0-1] verify_password passed')
          "

      # R47/R48 P0-3: 初始化临时 SQLite + bootstrap admin principal
      # 必须在 Web 服务启动前完成,否则 startup 的 ensure_readiness_or_exit 会退出
      # R48: 显式传递 DATABASE_URL(与 job env 一致,确保连接同一 SQLite 文件)
      - name: Bootstrap admin principal
        env:
          DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
        run: |
          python -c "
          import asyncio, os
          from database.cache_store import get_cache_store, DB_PATH
          from admin import bootstrap_admin_principal

          # R48: 验证 DB_PATH 解析自 DATABASE_URL
          print(f'[E2E bootstrap] DATABASE_URL={os.environ.get(\"DATABASE_URL\")}')
          print(f'[E2E bootstrap] DB_PATH={DB_PATH}')
          assert str(DB_PATH) == '/tmp/e2e_${{ github.run_id }}.db', \
              f'DB_PATH mismatch: {DB_PATH} != /tmp/e2e_${{ github.run_id }}.db'

          async def main():
              store = get_cache_store()
              await store.init()
              ok = await bootstrap_admin_principal()
              if not ok:
                  raise RuntimeError('bootstrap_admin_principal 失败')
              print(f'[E2E bootstrap] OK: principal_id={os.environ.get(\"ADMIN_PRINCIPAL_ID\")} db={os.environ.get(\"DATABASE_URL\")}')
              await store.close()

          asyncio.run(main())
          "

      # R48 P0-3: 验证 SQLite 文件存在 + admin_principals 表有记录
      - name: Verify bootstrap persisted
        env:
          DATABASE_URL: sqlite:///tmp/e2e_${{ github.run_id }}.db
        run: |
          echo "[R48] 验证 SQLite 文件存在:"
          ls -la /tmp/e2e_${{ github.run_id }}.db
          echo ""
          echo "[R48] 查询 admin_principals 表:"
          python -c "
          import sqlite3
          conn = sqlite3.connect('/tmp/e2e_${{ github.run_id }}.db')
          rows = conn.execute('SELECT id, username, is_active FROM admin_principals').fetchall()
          print(f'admin_principals: {rows}')
          roles = conn.execute('SELECT principal_id, role_name FROM admin_principal_roles').fetchall()
          print(f'admin_principal_roles: {roles}')
          assert len(rows) > 0, 'admin_principals 表为空'
          assert any('super_admin' in r[1] for r in roles), '无 super_admin 角色'
          print('[R48] bootstrap 验证通过')
          conn.close()
          "

      # R47/R48 P0-3: 运行 Playwright E2E 测试
      # webServer(在 playwright.config.ts 中定义)会自动启动 admin 服务并轮询 /readiness
      # R48: playwright.config.ts 显式传递 DATABASE_URL 等 env 给 webServer 子进程
      # R62 P1-06: 用 tee 捕获输出到 /tmp/playwright_output.log,供 locale 执行验证步骤检查
      - name: Run Playwright E2E tests
        id: playwright
        run: |
          cd tests/e2e
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/playwright_output.log

      # R62 P1-06 后置验证: locale 执行验证 — 检查实际测试输出包含 zh-CN + en-US 标记
      # (precheck 检查用例列表;本步骤检查实际运行输出,防止用例存在但被 skip)
      - name: "R62 P1-06: Verify locale execution in test output"
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          echo "[R62 P1-06] 后置验证: 检查测试输出中的 locale 执行标记"
          if [ ! -f /tmp/playwright_output.log ]; then
            echo "ERROR: Playwright 输出日志未找到(/tmp/playwright_output.log)"
            echo "[R62 P1-06] 无法验证 locale 执行 — 测试输出缺失"
            exit 1
          fi
          ZH_COUNT=$(grep -c "zh-CN" /tmp/playwright_output.log || echo 0)
          EN_COUNT=$(grep -c "en-US" /tmp/playwright_output.log || echo 0)
          echo "测试输出中 zh-CN 标记数: $ZH_COUNT"
          echo "测试输出中 en-US 标记数: $EN_COUNT"
          if [ "$ZH_COUNT" -eq 0 ]; then
            echo "ERROR: zh-CN locale 未在实际测试输出中出现(可能被 skip 或用例名为空)"
            exit 1
          fi
          if [ "$EN_COUNT" -eq 0 ]; then
            echo "ERROR: en-US locale 未在实际测试输出中出现(可能被 skip 或复用 zh-CN 结果)"
            exit 1
          fi
          echo "[R62 P1-06] locale 执行验证通过(zh-CN: $ZH_COUNT 标记, en-US: $EN_COUNT 标记)"

      # ════════════════════════════════════════════════════════════
      # R65 P1-02: a11y 64 矩阵真实执行对等门禁(强制门禁)
      #
      # 审计 R65 P1-02: "A11y 64 矩阵是清单,不是 64 个已执行测试。"
      # scanner 默认调用不带 --test-report;代码明确在无报告时返回 ok=True
      # 并输出"跳过执行对等检查"。因此 CI 中 Scanner 9 只验证 generated JSON
      # 的笛卡尔积,不验证 Playwright 实际执行数、skip 或失败。
      #
      # 整改:
      #   1. Playwright config 启用 JSON reporter (输出 test-results/a11y-report.json)
      #   2. E2E 后强制运行 check_a11y_matrix_enforcement.py --test-report <report>
      #   3. 无报告、解析失败、executed ≠ 64、任何 skip/flaky/timedOut/unexpected 均失败
      #   4. failed/flaky/timedOut 不计合格 executed;要求 64 个最终状态全部 passed
      #   5. generated case 必须真正映射到测试函数与 route/state fixture
      #
      # 注意: 此步骤无 continue-on-error — 任一失败即阻断合并。
      # 矩阵 case → tests/a11y/*.spec.ts 的映射校验也在本步骤执行。
      # ════════════════════════════════════════════════════════════
      - name: "R65 P1-02: a11y matrix real execution parity gate"
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          echo "[R65 P1-02] 强制校验 Playwright JSON 报告(executed==64, passed==64, skipped==0)"
          REPORT_PATH="tests/e2e/test-results/a11y-report.json"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "ERROR: Playwright JSON report 未生成: $REPORT_PATH"
            echo "[R65 P1-02] 无报告即失败 — 必须启用 JSON reporter (playwright.config.ts)"
            exit 1
          fi
          echo "[R65 P1-02] 报告路径: $REPORT_PATH"
          python scripts/check_a11y_matrix_enforcement.py --test-report "$REPORT_PATH"

      - name: Upload a11y matrix report
        if: always() && steps.playwright.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a11y-matrix-report
          path: tests/e2e/test-results/a11y-report.json
          if-no-files-found: error

      # R48 P0-3: CI 失败排查辅助 — 在 Playwright 步骤失败时输出诊断信息
      - name: Debug - readiness response on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] curl /readiness (尝试连接 admin 服务) ==="
          curl -v -sS --max-time 10 http://127.0.0.1:8080/readiness || echo "(curl 失败,服务可能未启动)"
          echo ""
          echo "=== [R48 Debug] 检查 admin 进程 ==="
          ps aux | grep -E "uvicorn|admin:app" | grep -v grep || echo "(无 uvicorn 进程)"
          echo ""
          echo "=== [R48 Debug] 检查端口 8080 监听 ==="
          ss -tlnp | grep 8080 || echo "(端口 8080 未监听)"

      - name: Debug - SQLite file on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] SQLite 文件存在性 ==="
          ls -la /tmp/e2e_*.db 2>/dev/null || echo "(无 e2e SQLite 文件)"
          echo ""
          echo "=== [R48 Debug] SQLite admin_principals 内容 ==="
          python -c "
          import sqlite3, glob, os
          files = glob.glob('/tmp/e2e_*.db')
          if not files:
              print('(无 SQLite 文件)')
          for f in files:
              print(f'\n--- {f} ---')
              try:
                  conn = sqlite3.connect(f)
                  tables = conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()
                  print(f'tables: {[t[0] for t in tables]}')
                  if any('admin_principals' in t[0] for t in tables):
                      rows = conn.execute('SELECT id, username, is_active FROM admin_principals').fetchall()
                      print(f'admin_principals: {rows}')
                      roles = conn.execute('SELECT principal_id, role_name FROM admin_principal_roles').fetchall()
                      print(f'admin_principal_roles: {roles}')
                  conn.close()
              except Exception as e:
                  print(f'查询失败: {e}')
          " || echo "(Python 查询失败)"

      - name: Debug - admin log on failure
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          echo "=== [R48 Debug] admin 日志(stderr 输出) ==="
          # Playwright webServer 的 stdout/stderr 会被捕获到 test-results 中
          if [ -f tests/e2e/test-results/.web-server-stdout.txt ]; then
            echo "--- webServer stdout ---"
            cat tests/e2e/test-results/.web-server-stdout.txt | tail -100
          fi
          if [ -f tests/e2e/test-results/.web-server-stderr.txt ]; then
            echo "--- webServer stderr ---"
            cat tests/e2e/test-results/.web-server-stderr.txt | tail -100
          fi
          # Playwright 的 webServer 日志也可能在 playwright-report 中
          echo ""
          echo "=== [R48 Debug] 检查 Playwright webServer 日志 ==="
          find tests/e2e -name "*.txt" -path "*web-server*" -exec echo "--- {} ---" \; -exec tail -50 {} \; 2>/dev/null || echo "(无 webServer 日志文件)"

      # R47/R48 P0-3: 失败时保留 trace、video、screenshot、axe JSON artifact
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/e2e-results/

      - name: Upload axe accessibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axe-accessibility-reports
          path: tests/e2e/e2e-results/axe-*.json
          if-no-files-found: warn
