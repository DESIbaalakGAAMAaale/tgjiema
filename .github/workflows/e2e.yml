name: E2E Tests

# R44: 端到端测试(Playwright),SHA pin 所有 actions 引用避免供应链漂移

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5cb8c3157c4e73086e37156b7f4c5984b4

      - name: Set up Python
        uses: actions/setup-python@0b93614531b8e4e9d3f74f4a7c76b09f2cd5e7d8
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@39370e3977a6e5bfb88f5f4e7f4c5e3a7c5b3b1f
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          cd tests/e2e
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9289b47c7d4e1ce4c0bae89999e5c4a
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
