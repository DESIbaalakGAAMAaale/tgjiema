# TG文件解码器 — Secretless Contract E2E Workflow (R76 10.A / 10.A1 / 10.A2)
#
# ════════════════════════════════════════════════════════════════════════
# R76 整改目标(P0-03 / P0-04 / 10.A):
#   本工作流实现"无真实凭证即可完整跑通全部功能"的隔离测试环境。
#   所有外部边界(Telegram Provider / 对象存储 / CockroachDB)使用协议兼容
#   模拟服务,不读取任何 secrets.TEST_* / secrets.R2_* / secrets.COCKROACHDB_*
#   或生产 Environment。
#
# 关键约束(报告 10.A1):
#   - PR/push 必跑,不声明 environment: production 或 rc-candidate
#   - Bot/provider 使用仓库内 HTTP 协议模拟器(provider-sim),不需要 Telegram token
#   - R2 使用 MinIO 容器;CI 运行时生成 MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
#   - CRDB 使用 cockroachdb/cockroach@sha256:... start-single-node --insecure
#   - restore/provider/evidence HMAC key 使用 openssl rand -hex 32 生成
#   - 故障注入覆盖 401、429+Retry-After、500、连接超时、读超时、对象损坏和 CRDB 断连
#
# 禁止(报告 10.A1):
#   - 读取任何 secrets.TEST_* / secrets.R2_* / secrets.COCKROACHDB_* 或生产 Environment
#   - 缺 secret 时 warning/skip/伪 PASS
#   - 使用真实 Bot Token / R2 Key / 生产 CRDB Key / 生产部署 Hook
#
# 验收(报告 10.A1):
#   - 新拉取仓库后只需 Docker 和 Python,不需要任何个人或生产凭证
#   - 一条命令完整跑通(provider-sim + MinIO + 本地 CockroachDB + Redis + 全部应用角色)
#   - 完整业务链、备份恢复、切换回滚、故障注入和 CI 门禁在隔离环境真实通过
#   - 通过后输出: SECRETLESS FUNCTIONAL GO
# ════════════════════════════════════════════════════════════════════════

name: secretless-contract-e2e

on:
  push:
    branches: [master, main, "r*-remediation-*"]
  workflow_dispatch:

# R80 P0-03: 唯一权威事件模型 — 只保留 push 触发。
# 本单人同仓 PR 的 head commit 在 push 时已有权威 run;
# 删除 pull_request 触发消除同 SHA 双运行互相取消。
# Release Gate 继续要求 event=push,与权威触发一致。

# 不声明 environment: production 或 rc-candidate
# 不需要任何 GitHub Secrets

permissions:
  contents: read

concurrency:
  # R81 fix: include event_name in group so push and pull_request runs don't
  # cancel each other. The closed-loop gate (release-gates.yml) requires a
  # successful event=push run; if push run is cancelled by pull_request run
  # (shared group), the gate detects cancelled and fails (R80 P0-03).
  group: secretless-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  APP_ENV: test
  SECRETLESS_MODE: "true"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: Secretless Contract E2E — 完整功能闭环
  # ════════════════════════════════════════════════════════════════
  secretless-e2e:
    name: Secretless Contract E2E (no real credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ────────────────────────────────────────────────────────────
      # Step 1: Checkout
      # ────────────────────────────────────────────────────────────
      - name: "Step 1: Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────────────────────
      # Step 2: Setup Python (3.11/3.12 矩阵由 ci.yml 覆盖,此处用 3.11)
      # ────────────────────────────────────────────────────────────
      - name: "Step 2: Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      # ────────────────────────────────────────────────────────────
      # Step 3: Install Python dependencies
      # ────────────────────────────────────────────────────────────
      - name: "Step 3: Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试依赖(httpx for contract_adapter, jsonschema for manifest)
          pip install httpx jsonschema pydantic

      # ────────────────────────────────────────────────────────────
      # Step 4: Docker / Docker Compose setup
      # ────────────────────────────────────────────────────────────
      - name: "Step 4: Docker Compose setup"
        run: |
          # R83: 先落 current-run identity，再探测 Docker。这样 Docker/Compose
          # preflight 失败时，always finalizer 仍能生成绑定本次 run 的 NO-GO 证据。
          mkdir -p artifacts/secretless-e2e
          cat > artifacts/secretless-e2e/result.json <<EOF
          {
            "schema_version": "secretless-e2e/v1",
            "status": "in_progress",
            "head_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "workflow_path": ".github/workflows/secretless-contract-e2e.yml",
            "event": "${{ github.event_name }}",
            "run_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "phases": []
          }
          EOF
          python -c "import json; json.load(open('artifacts/secretless-e2e/result.json'))"
          echo "✓ result.json initialized (in_progress)"
          docker --version
          docker compose version

          # R76 §10.M: docker-compose.yml 引用 .env.shared 与 .env.secrets.<service>
          # 作为 env_file(项目规则:secrets 必须分层加载),这些文件被 gitignore 排除。
          # CI 环境必须先创建空 placeholder 文件,否则 docker compose config 立即失败
          # (env file not found)。实际 secrets 由 Step 6 通过 GITHUB_ENV 注入。
          touch .env.shared
          touch .env.secrets.migration \
                .env.secrets.crdb_sync \
                .env.secrets.up \
                .env.secrets.idx \
                .env.secrets.dsp \
                .env.secrets.mon \
                .env.secrets.admin_bot \
                .env.secrets.admin \
                .env.secrets.db_backup
          # R80 P0-01: 确保 bind mount 目标目录存在(CI 环境可能没有预创建)
          # docker-compose.yml 使用 ./data:/app/data, ./config:/app/config, ./logs:/app/logs
          mkdir -p data config logs
          # R80 P0-01: 容器以非 root 用户(app)运行,bind mount 继承宿主机权限;
          # CI runner 创建的目录对容器内 app 用户不可写 → SQLite 无法打开。
          chmod 777 data config logs
          # 验证 compose 文件可解析
          # R76 10.E: 使用临时 placeholder 验证 compose 语法,不写入 GITHUB_ENV
          # (所有 ${VAR:?...} 强制要求的变量在 Step 6 生成实际值;
          #  此处仅验证 compose 文件可解析,placeholder 不影响后续步骤)
          REDIS_HEALTH_PASSWORD=ci-placeholder \
          REDIS_WRITER_PASSWORD=ci-placeholder \
          REDIS_READER_PASSWORD=ci-placeholder \
          REDIS_ADMIN_PASSWORD=ci-placeholder \
          CI_PROVIDER_CONTRACT_TOKEN=ci-placeholder \
          CI_PROVIDER_RECEIPT_KEY=ci-placeholder \
          CI_MINIO_ROOT_USER=ci-placeholder \
          CI_MINIO_ROOT_PASSWORD=ci-placeholder \
          CI_BACKUP_SIGNING_KEY=ci-placeholder \
          CI_MANIFEST_SIGNING_KEY=ci-placeholder \
          SECRETLESS_CRDB_HOST=ci-placeholder \
          SECRETLESS_CRDB_SQL_PORT=ci-placeholder \
          SECRETLESS_CRDB_DATABASE=ci-placeholder \
          SECRETLESS_CRDB_URL=ci-placeholder \
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml config > /dev/null

      # ────────────────────────────────────────────────────────────
      # Step 5: Preflight — 确认真实凭证变量全部不存在(报告 O12 step 1)
      # ────────────────────────────────────────────────────────────
      - name: "Step 5: Preflight — verify no real credentials present"
        run: |
          echo "=== Step 5: Preflight check — no real credentials allowed ==="
          # 禁止存在的真实凭证环境变量
          FORBIDDEN_VARS=(
            "TEST_UPLOAD_BOT_TOKEN"
            "TEST_INDEX_BOT_TOKEN"
            "TEST_DISPLAY_BOT_TOKEN"
            "TEST_ADMIN_BOT_TOKEN"
            "TEST_MON_BOT_TOKEN"
            "R2_ACCOUNT_ID"
            "R2_ACCESS_KEY_ID"
            "R2_SECRET_ACCESS_KEY"
            "COCKROACHDB_URL"
            "DEPLOY_HOOK_URL"
            "DEPLOY_PROBE_URL"
            "BACKUP_SIGNING_KEY"
          )
          VIOLATION=0
          for var in "${FORBIDDEN_VARS[@]}"; do
            if [ -n "${!var:-}" ]; then
              echo "::error::Forbidden real credential '${var}' is set — secretless CI must not use real credentials"
              VIOLATION=1
            fi
          done
          if [ "${VIOLATION}" = "1" ]; then
            exit 1
          fi
          echo "✓ No real credentials present — proceeding with secretless mode"

      # ────────────────────────────────────────────────────────────
      # Step 6: 生成单次 run 临时凭据(报告 O12 step 2)
      # ────────────────────────────────────────────────────────────
      - name: "Step 6: Generate ephemeral credentials (single-run only)"
        id: gen-creds
        run: |
          echo "=== Step 6: Generate ephemeral credentials ==="
          # Redis ACL 密码(4 个独立用户)
          echo "REDIS_HEALTH_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "REDIS_WRITER_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "REDIS_READER_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "REDIS_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          # MinIO 临时凭据
          echo "CI_MINIO_ROOT_USER=minio-ci" >> $GITHUB_ENV
          echo "CI_MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)" >> $GITHUB_ENV
          # Provider contract token + receipt key
          echo "CI_PROVIDER_CONTRACT_TOKEN=$(openssl rand -hex 24)" >> $GITHUB_ENV
          echo "CI_PROVIDER_RECEIPT_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          # Restore / evidence / manifest HMAC key
          echo "CI_BACKUP_SIGNING_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "CI_MANIFEST_SIGNING_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          # R79 §10.2 / P0-03: 集中化 CRDB DSN — 单 CRDB 拓扑,服务名即基础键
          # cockroachdb(覆盖 docker-compose.yml 的 cockroachdb 服务)。
          # 禁止 11 处手写完整 DSN;禁止回退到第二套 cockroachdb-secretless。
          # production COCKROACHDB_URL 仍独立 fail-closed(禁止在此处设置)。
          echo "SECRETLESS_CRDB_HOST=cockroachdb" >> $GITHUB_ENV
          echo "SECRETLESS_CRDB_SQL_PORT=26258" >> $GITHUB_ENV
          echo "SECRETLESS_CRDB_DATABASE=tgjiema" >> $GITHUB_ENV
          echo "SECRETLESS_CRDB_URL=postgresql://root@cockroachdb:26258/tgjiema?sslmode=disable" >> $GITHUB_ENV
          echo "✓ Ephemeral credentials generated (single-run, masked)"
          echo "✓ CRDB DSN contract: cockroachdb:26258 (single-CRDB topology)"

      # ────────────────────────────────────────────────────────────────
      # Step 7: 启动权威基础设施(单 CRDB 拓扑 + 服务图门禁 + 失败证据)
      # ────────────────────────────────────────────────────────────────
      # R79 §10.4 / P0-03: 启动明确权威服务清单 — 单 CRDB 拓扑下只启动
      # redis / cockroachdb / minio / provider-sim,不再同时启动 production
      # 与 secretless 两套 CRDB。等待函数只接受权威服务名数组,不得扫描并
      # 等待多个 CRDB。失败时写出完整根因证据。
      - name: "Step 7: Start secretless infrastructure (authoritative services)"
        id: start-infra
        run: |
          cd "${{ github.workspace }}"
          # 7a) 导出 resolved config + 运行服务图硬门禁(单 CRDB/依赖/DSN/隔离/加固)
          # R79 §10.3: resolved config 上机器断言,不靠肉眼判断 overlay。
          set +e
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            config --format json > artifacts/secretless-e2e/compose-resolved.json \
            2>artifacts/secretless-e2e/compose-resolved.json.warn
          COMPOSE_CONFIG_RC=$?
          set -e
          # --format json 在旧版 compose 不可用时，仅对明确的 unknown flag 回退 YAML。
          if [ "${COMPOSE_CONFIG_RC}" -ne 0 ]; then
            if grep -q "unknown flag" artifacts/secretless-e2e/compose-resolved.json.warn; then
              docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
                config > artifacts/secretless-e2e/compose-resolved.json
            else
              cat artifacts/secretless-e2e/compose-resolved.json.warn >&2
              exit "${COMPOSE_CONFIG_RC}"
            fi
          fi
          python scripts/validate_secretless_service_graph.py \
            artifacts/secretless-e2e/compose-resolved.json \
            --export-graph artifacts/secretless-e2e/service-graph.json

          # 7b) 启动权威基础设施(单 CRDB 拓扑)
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            up -d \
            redis redis-acl-init \
            cockroachdb \
            minio \
            provider-sim
          # minio-init 必须等待 minio healthy 后运行(oneshot 创建 bucket)
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            up --exit-code-from minio-init minio-init

          # 7c) 等待权威基础设施 healthy(不得扫描多个 CRDB)
          echo "Waiting for authoritative infrastructure to become healthy..."
          sleep 8
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml ps
          for SERVICE in tgjiema-provider-sim tgjiema-minio tgjiema-cockroachdb; do
            for i in $(seq 1 30); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "${SERVICE}" 2>/dev/null || echo "none")
              if [ "${HEALTH}" = "healthy" ]; then
                echo "✓ ${SERVICE} is healthy"
                break
              fi
              echo "  attempt ${i}: ${SERVICE} health=${HEALTH}"
              sleep 3
            done
            if [ "${HEALTH}" != "healthy" ]; then
              echo "::error::${SERVICE} did not become healthy — collecting root-cause evidence"
              mkdir -p artifacts/secretless-e2e
              # R79 §10.4: 失败时写出完整根因证据
              docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
                ps -a > artifacts/secretless-e2e/compose-ps.txt 2>&1 || true
              docker inspect "${SERVICE}" \
                > artifacts/secretless-e2e/$(basename ${SERVICE})-inspect.json 2>&1 || true
              docker diff "${SERVICE}" \
                > artifacts/secretless-e2e/$(basename ${SERVICE})-diff.txt 2>&1 || true
              docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
                logs --no-color --tail 300 "${SERVICE#tgjiema-}" \
                > artifacts/secretless-e2e/crdb.log 2>&1 || true
              echo "error_code=SECRETLESS_INFRA_CRDB_UNHEALTHY" >> "$GITHUB_OUTPUT"
              return 1
            fi
          done
          echo "✓ All authoritative infrastructure healthy (single CRDB topology)"
          # R79 §10: record phase success marker(失败则不写入 → 定位首个失败)
          mkdir -p artifacts/secretless-e2e/phases
          printf '{"step":7,"name":"infrastructure","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/07-infrastructure.json

          # R80 P1-04: CRDB filesystem contract 真实执行(不仅依赖 env-gated 测试)
          # 验证只读 rootfs、最小写集合、cap_drop ALL、no-new-privileges
          echo "--- R80 P1-04: CRDB filesystem contract verification ---"
          python scripts/verify_crdb_filesystem_contract.py \
            --container tgjiema-cockroachdb \
            --output artifacts/secretless-e2e/crdb-filesystem-contract.json
          echo "✓ CRDB filesystem contract verified"

      # ────────────────────────────────────────────────────────────
      # Step 8: 运行 migration(R80 P1-01/P1-02: 保留容器 + 完整证据 + 失败 phase)
      # ────────────────────────────────────────────────────────────
      - name: "Step 8: Run database migration"
        run: |
          echo "=== Step 8: Run database migration ==="
          set +e
          mkdir -p artifacts/secretless-e2e/migration

          # R80 P1-01: 保留容器(不用 --rm)直到证据采集完成
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            run --name tgjiema-migration-e2e migration \
            2>&1 | tee artifacts/secretless-e2e/migration/stdout.log

          MIGRATION_RC=${PIPESTATUS[0]}

          # R80 P1-01: 证据采集(容错 — 采集命令失败不阻断)
          docker inspect tgjiema-migration-e2e \
            > artifacts/secretless-e2e/migration/inspect.json 2>&1 || true
          docker logs tgjiema-migration-e2e \
            > artifacts/secretless-e2e/migration/container.log 2>&1 || true
          docker cp \
            tgjiema-migration-e2e:/tmp/migration-result.json \
            artifacts/secretless-e2e/migration/migration-result.json \
            2>/dev/null || true

          # 证据采集完成后删除容器
          docker rm -f tgjiema-migration-e2e 2>/dev/null || true
          set -e

          # R80 P1-02: 无论成功或失败都写 phase 文件
          if [ "${MIGRATION_RC}" = "0" ]; then
            echo "✓ Migration completed successfully"
            printf '{"step":8,"name":"migration","status":"success","exit_code":0,"error_code":null,"ts":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/08-migration.json
          else
            # 从 migration-result.json 提取结构化错误码(如有)
            ERROR_CODE="MIGRATION_UNKNOWN_EXIT_${MIGRATION_RC}"
            if [ -f artifacts/secretless-e2e/migration/migration-result.json ]; then
              PARSED_CODE=$(python3 -c "
          import json, sys
          try:
              r = json.load(open('artifacts/secretless-e2e/migration/migration-result.json'))
              print(r.get('error_code') or 'MIGRATION_UNKNOWN_EXIT_${MIGRATION_RC}')
          except Exception:
              print('MIGRATION_UNKNOWN_EXIT_${MIGRATION_RC}')
          " 2>/dev/null || echo "MIGRATION_UNKNOWN_EXIT_${MIGRATION_RC}")
              ERROR_CODE="${PARSED_CODE}"
            fi
            echo "::error::Migration failed with exit code ${MIGRATION_RC} (error_code=${ERROR_CODE})"
            printf '{"step":8,"name":"migration","status":"failure","exit_code":%s,"error_code":"%s","ts":"%s"}\n' \
              "${MIGRATION_RC}" "${ERROR_CODE}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > artifacts/secretless-e2e/phases/08-migration.json
            exit 1
          fi

      # ────────────────────────────────────────────────────────────
      # Step 9: 启动全部应用角色(报告 O12 step 6)
      # ────────────────────────────────────────────────────────────
      - name: "Step 9: Start all application roles"
        run: |
          echo "=== Step 9: Start all application roles ==="
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            up -d db_writer crdb_sync up idx dsp
          sleep 15
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml ps
          printf '{"step":9,"name":"start-apps","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/09-start-apps.json

      # ────────────────────────────────────────────────────────────
      # Step 10: 执行正常业务交易(报告 O12 step 7 / 10.B / 10.C)
      # 通过公开 HTTP 入口驱动,不导入 bots.* 私有函数
      # ────────────────────────────────────────────────────────────
      - name: "Step 10: Execute normal business transaction"
        run: |
          echo "=== Step 10: Normal business transaction ==="
          # R80 P0-02: 等待 up bot contract web adapter 就绪(uvicorn 启动需要数秒)
          echo "Waiting for contract web adapter (port 8000)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ Contract web adapter ready (${i}s)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Contract web adapter not ready after 30s"
              docker compose -f docker-compose.yml -f docker-compose.secretless.yml logs --tail=50 up
              exit 1
            fi
            sleep 1
          done
          # 通过 e2e_update_adapter.py 公开接口驱动(已重写为外部黑盒驱动器)
          # R76 §10.4: --receipt-key 必填(receipt HMAC 验签密钥)
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode normal-transaction \
            --timeout 120
          ADAPTER_RC=$?
          if [ "${ADAPTER_RC}" != "0" ]; then
            echo "::error::Normal transaction failed with exit code ${ADAPTER_RC}"
            docker compose -f docker-compose.yml -f docker-compose.secretless.yml logs --tail=100 up idx dsp db_writer
            exit 1
          fi
          echo "✓ Normal business transaction completed"
          printf '{"step":10,"name":"normal-transaction","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/10-normal-transaction.json

      # ────────────────────────────────────────────────────────────
      # Step 11: 执行故障注入矩阵(报告 10.A1 / 10.4 / O12 step 8)
      # 覆盖 401、429+Retry-After、500、连接超时、读超时、对象损坏、CRDB 断连
      # ────────────────────────────────────────────────────────────
      - name: "Step 11: Execute fault injection matrix"
        run: |
          echo "=== Step 11: Fault injection matrix ==="
          # 401 — 不重试或按策略终止
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode fault-injection \
            --fault 401 \
            --expect failure \
            --timeout 60
          # 429 + Retry-After — 按 RetryAfter 退避且幂等
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode fault-injection \
            --fault 429 \
            --retry-after 2 \
            --expect retry-then-success \
            --timeout 60
          # 500 — 有界重试后明确终态
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode fault-injection \
            --fault 500 \
            --expect bounded-retry-then-failure \
            --timeout 60
          # timeout — 连接/读超时
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode fault-injection \
            --fault timeout \
            --expect timeout-failure \
            --timeout 30
          # duplicate — 同一 effect ID 幂等
          python scripts/e2e_update_adapter.py \
            --provider-url http://localhost:8088 \
            --provider-token "${CI_PROVIDER_CONTRACT_TOKEN}" \
            --app-url http://localhost:8000 \
            --receipt-key "${CI_PROVIDER_RECEIPT_KEY}" \
            --mode fault-injection \
            --fault duplicate \
            --expect idempotent-success \
            --timeout 60
          echo "✓ Fault injection matrix passed"
          printf '{"step":11,"name":"fault-matrix","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/11-fault-matrix.json

      # ────────────────────────────────────────────────────────────
      # Step 12: 备份 + 损坏对象负测 + blank restore(报告 O12 step 9 / 10.G)
      # R81 §10.5: 三个子阶段各自独立留证(stdout/stderr/exitcode/evidence),
      # 任一失败立即阻断,失败时仍上传已产生的诊断。fail-closed。
      # ────────────────────────────────────────────────────────────
      - name: "Step 12: Backup, corruption negative test, blank restore"
        run: |
          set -Eeuo pipefail
          echo "=== Step 12: Backup, corruption negative test, blank restore ==="
          mkdir -p artifacts/secretless-e2e/step12 artifacts/secretless-e2e/phases

          # R81 §10.5: 每个子阶段独立保存 stdout/stderr/exitcode/evidence
          run_phase() {
            local phase="$1"; shift
            set +e
            python scripts/compose_runtime_e2e.py \
              --phase "${phase}" \
              --storage-backend minio \
              --endpoint http://localhost:9000 \
              --bucket tgjiema-backup \
              --access-key "${CI_MINIO_ROOT_USER}" \
              --secret-key "${CI_MINIO_ROOT_PASSWORD}" \
              --signing-key "${CI_BACKUP_SIGNING_KEY}" \
              --output "artifacts/secretless-e2e/step12/${phase}.json" \
              "$@" \
              >"artifacts/secretless-e2e/step12/${phase}.stdout.log" \
              2>"artifacts/secretless-e2e/step12/${phase}.stderr.log"
            local rc=$?
            set -e
            printf '%s\n' "${rc}" >"artifacts/secretless-e2e/step12/${phase}.exitcode"
            if [ "${rc}" -ne 0 ]; then
              evidence="artifacts/secretless-e2e/step12/${phase}.json"
              stdout_log="artifacts/secretless-e2e/step12/${phase}.stdout.log"
              stderr_log="artifacts/secretless-e2e/step12/${phase}.stderr.log"
              set +e
              python scripts/report_phase_failure.py \
                --evidence "${evidence}" \
                --phase "${phase}" \
                --wrapper-returncode "${rc}" \
                --stdout-log "${stdout_log}" \
                --stderr-log "${stderr_log}"
              report_rc=$?
              set -e
              if [ "${report_rc}" -ne 0 ]; then
                echo "::warning title=Phase evidence reporter::reporter_exit=${report_rc}"
              fi
              echo "----- stderr tail -----" >&2
              tail -n 200 "${stderr_log}" >&2 || echo "stderr missing" >&2
              echo "----- stdout tail -----" >&2
              tail -n 200 "${stdout_log}" >&2 || echo "stdout missing" >&2
              return "${rc}"
            fi
          }

          # 1. 正向:三对象(payload/manifest/COMPLETE)备份到 MinIO
          run_phase full_backup_to_s3_contract_store

          # 2. 负向:损坏 payload 对象 → DR validate 必须失败(--expect failure)
          run_phase corrupt_payload_negative --expect failure

          # 3. 正向:blank restore from MinIO
          run_phase blank_restore_from_s3_contract_store

          # R81 §10.5: 只有三个子阶段全部通过,才能写 success phase
          printf '{"step":12,"name":"backup-restore","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/secretless-e2e/phases/12-backup-restore.json
          echo "✓ Step 12: Backup, corruption negative test, blank restore passed"

      # ────────────────────────────────────────────────────────────
      # Step 13: Switch / switch probe failure / rollback(报告 O12 step 10)
      # R81 §10.10: 每步独立 evidence,负测 fail-closed,禁止 || echo 吞异常。
      # ────────────────────────────────────────────────────────────
      - name: "Step 13: Switch, probe failure, rollback"
        run: |
          set -Eeuo pipefail
          echo "=== Step 13: Switch, probe failure, rollback ==="
          mkdir -p artifacts/secretless-e2e/step13 artifacts/secretless-e2e/phases

          # current-SHA restore-state 绑定的真实 CRDB source → target switch。
          python scripts/compose_runtime_e2e.py \
            --phase secretless_actual_switch \
            --signing-key "${CI_BACKUP_SIGNING_KEY}" \
            --output artifacts/secretless-e2e/step13/actual_switch.json
          echo "✓ source → restored target identity switch and target business probe passed"

          # active target 的受控 HTTP 503 必须被识别为 rollback-required expected failure。
          python scripts/compose_runtime_e2e.py \
            --phase switch_probe_failure \
            --signing-key "${CI_BACKUP_SIGNING_KEY}" \
            --expect no-production-tag \
            --output artifacts/secretless-e2e/step13/switch_probe_failure.json
          echo "✓ active target HTTP 503 correctly required rollback"

          # CAS rollback 后必须恢复 source identity 并重新通过业务读取。
          python scripts/compose_runtime_e2e.py \
            --phase secretless_actual_rollback \
            --signing-key "${CI_BACKUP_SIGNING_KEY}" \
            --output artifacts/secretless-e2e/step13/actual_rollback.json
          echo "✓ source identity restored and rollback business probe passed"

          # 仅在 source 已恢复 active 后删除本 run 的隔离 target database。
          python scripts/compose_runtime_e2e.py \
            --phase secretless_drop_restore_target \
            --signing-key "${CI_BACKUP_SIGNING_KEY}" \
            --output artifacts/secretless-e2e/step13/target_cleanup.json
          echo "✓ isolated restore target cleaned after rollback"

          printf '{"step":13,"name":"switch-rollback","status":"success","ts":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/secretless-e2e/phases/13-switch-rollback.json

      # ────────────────────────────────────────────────────────────
      # Step 14: Manifest 生成、文件重 hash、验签(报告 O12 step 11 / 10.K)
      # ────────────────────────────────────────────────────────────
      - name: "Step 14: Candidate manifest validation"
        run: |
          set -Eeuo pipefail
          echo "=== Step 14: Candidate manifest cross-validation ==="
          mkdir -p artifacts/secretless-e2e/step14 artifacts/secretless-e2e/phases
          # 从 Step 7 的 current-run resolved Compose JSON 读取 db_backup.image，随后由
          # manifest builder 使用 Docker Engine image inspect 绑定不可变 content digest。
          # 禁止依赖已被 `compose run --rm` 删除的一次性容器，也禁止随机 digest。

          # 生成 current-SHA-bound Secretless candidate manifest。生产 RC tag schema 保持
          # 独立且不弱化；分支 push 不伪造 annotated tag identity。
          python scripts/build_secretless_candidate_manifest.py \
            --artifact-dir artifacts/secretless-e2e \
            --output artifacts/secretless-e2e/step14/candidate-manifest.json \
            --resolved-compose artifacts/secretless-e2e/compose-resolved.json \
            --compose-service db_backup \
            --signing-key "${CI_MANIFEST_SIGNING_KEY}" \
            --expected-sha "${GITHUB_SHA}"

          python scripts/validate_candidate_manifest.py \
            --manifest artifacts/secretless-e2e/step14/candidate-manifest.json \
            --schema schemas/secretless-candidate-manifest.schema.json \
            --artifact-dir artifacts/secretless-e2e \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-workflow-path ".github/workflows/secretless-contract-e2e.yml" \
            --expected-event "${GITHUB_EVENT_NAME}" \
            --expected-ref "${GITHUB_REF}" \
            --expected-source-sha "${GITHUB_SHA}" \
            --verification-key "${CI_MANIFEST_SIGNING_KEY}" \
            --strict
          echo "✓ Candidate manifest five-layer cross-validation passed"
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("artifacts/secretless-e2e/step14/candidate-manifest.json"); m=json.loads(p.read_text()); out={"step":14,"name":"candidate-manifest","status":"success","source_sha":m["source_sha"],"tree_sha":m["tree_sha"],"image_digest":m["image_digest"],"runtime_config_digest":m["runtime_config_digest"],"manifest_sha256":"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest()}; pathlib.Path("artifacts/secretless-e2e/phases/14-candidate-manifest.json").write_text(json.dumps(out,sort_keys=True)+"\n")'

      # ────────────────────────────────────────────────────────────
      # Step 15: 部署状态机成功/失败矩阵(报告 O12 step 12 / 10.L / O10)
      # 使用 deployment_simulator,不访问真实生产 hook
      # ────────────────────────────────────────────────────────────
      - name: "Step 15: Deployment state machine success/failure matrix"
        run: |
          set -Eeuo pipefail
          echo "=== Step 15: Deployment state machine matrix ==="
          mkdir -p artifacts/secretless-e2e/step15 artifacts/secretless-e2e/phases

          # R81 §10.10: 启动 deployment simulator,不访问真实生产 hook
          python tests/support/deployment_simulator.py --port 8099 &
          SIM_PID=$!
          sleep 3

          # cleanup 函数:cleanup 失败只能作为 secondary error,不得覆盖主失败
          cleanup_sim() {
            if ! kill ${SIM_PID} 2>/dev/null; then
              echo "::warning::failed to kill SIM_PID=${SIM_PID} (already exited?)"
            fi
          }
          trap cleanup_sim EXIT

          # R81 §10.10: 每个子场景独立保存 stdout/stderr/exitcode
          CANDIDATE_MANIFEST="artifacts/secretless-e2e/step14/candidate-manifest.json"
          ROLLBACK_EVIDENCE="artifacts/secretless-e2e/step13/actual_rollback.json"
          CANDIDATE_SOURCE_SHA="$(python -c 'import json; print(json.load(open("artifacts/secretless-e2e/step14/candidate-manifest.json"))["source_sha"])')"
          CANDIDATE_IMAGE_DIGEST="$(python -c 'import json; print(json.load(open("artifacts/secretless-e2e/step14/candidate-manifest.json"))["image_digest"])')"
          CANDIDATE_RUNTIME_DIGEST="$(python -c 'import json; print(json.load(open("artifacts/secretless-e2e/step14/candidate-manifest.json"))["runtime_config_digest"])')"
          CANDIDATE_REPO_DIGEST="ghcr.io/secretless/tgjiema@${CANDIDATE_IMAGE_DIGEST}"

          run_scenario() {
            local scenario="$1"; shift
            local state_file="$1"; shift
            set +e
            python scripts/deployment_state_machine.py run \
              --production-tag "rc-v1.0.83-secretless-${scenario}" \
              --source-sha "${CANDIDATE_SOURCE_SHA}" \
              --image-repo-digest "${CANDIDATE_REPO_DIGEST}" \
              --runtime-config-digest "${CANDIDATE_RUNTIME_DIGEST}" \
              --candidate-manifest "${CANDIDATE_MANIFEST}" \
              --rollback-evidence "${ROLLBACK_EVIDENCE}" \
              --deploy-hook-url "http://localhost:8099/deploy-hook" \
              --deploy-probe-url "http://localhost:8099" \
              --state-file "${state_file}" \
              --scenario "${scenario}" \
              --probe-max-attempts 3 \
              --probe-interval 1 \
              "$@" \
              >"artifacts/secretless-e2e/step15/${scenario}.stdout.log" \
              2>"artifacts/secretless-e2e/step15/${scenario}.stderr.log"
            local rc=$?
            set -e
            printf '%s\n' "${rc}" >"artifacts/secretless-e2e/step15/${scenario}.exitcode"
            return "${rc}"
          }

          # 1. 正向:success — 生命周期必须成功
          run_scenario success ./deployment-state-success.json \
            || { echo "::error::Step 15 success scenario failed (rc=$?)" >&2; exit 1; }
          echo "✓ success scenario passed"

          # R81 §10.10: 负测 — deployment_state_machine.py 已实现 --expect failure 语义:
          # 生命周期正确失败 → exit 0;生命周期意外成功 → exit 1。
          # 禁止 || echo 吞异常退出码(会掩盖"故障未生效"的真实失败)。

          # 2. 负向:runtime config drift → 必须 failed,不得创建 production tag。
          # Secretless image identity 由 Step 14 已签名 manifest 独立绑定，不信任应用自报。
          run_scenario runtime_config_drift ./deployment-state-config-drift.json \
            --expect failure \
            || { echo "::error::Step 15 runtime_config_drift negative test failed (rc=$?) — 故障未被识别或 production tag 被错误创建" >&2; exit 1; }
          echo "✓ runtime_config_drift correctly prevented production tag"

          # 3. 负向:probe failure → 必须 failed
          run_scenario business_probe_failure ./deployment-state-probe-fail.json \
            --expect failure \
            || { echo "::error::Step 15 business_probe_failure negative test failed (rc=$?) — 故障未被识别或 production tag 被错误创建" >&2; exit 1; }
          echo "✓ business_probe_failure correctly prevented production tag"

          # 三个场景必须共享同一 manifest identity；成功场景 verified，负测 failed，
          # 且全部证明 Step 13 rollback 后 source identity 已恢复。
          python -c 'import json,pathlib; files=["deployment-state-success.json","deployment-state-config-drift.json","deployment-state-probe-fail.json"]; docs=[json.load(open(p)) for p in files]; assert docs[0]["current_state"]=="verified"; assert all(d["current_state"]=="failed" for d in docs[1:]); assert len({d["candidate_manifest_sha256"] for d in docs})==1; assert all(d["identity_restored"] is True and d["rollback_source_identity"]==d["source_database_identity"] for d in docs); out={"step":15,"name":"deployment-matrix","status":"success","source_sha":docs[0]["source_sha"],"candidate_manifest_sha256":docs[0]["candidate_manifest_sha256"],"source_database_identity":docs[0]["source_database_identity"],"target_database_identity":docs[0]["target_database_identity"],"terminals":{"success":docs[0]["current_state"],"runtime_config_drift":docs[1]["current_state"],"business_probe_failure":docs[2]["current_state"]}}; pathlib.Path("artifacts/secretless-e2e/phases/15-deployment-matrix.json").write_text(json.dumps(out,sort_keys=True)+"\n")'
          echo "✓ Deployment state machine matrix passed with shared immutable identity"

      # ───────────────────────────────────────────────────────────────────
      # Step 16: Finalize result.json(R79 §10.5 / P0-04 — always,失败也必须生成)
      # ───────────────────────────────────────────────────────────────────
      # 业务步骤(Step 7-15)各自在成功时写入相位文件 phases/<step>-<name>.json,
      # 失败则不写入 → 首个缺失阶段即首个失败。cleanup 失败只能作为 secondary
      # error,不能覆盖主失败。
      - name: "Step 16: Finalize result.json (always)"
        if: always()
        run: |
          echo "=== Step 16: Finalize result.yaml (always — 失败也必须生成) ==="
          # 汇总步骤写入的 error_code(首个失败步骤设置 error_code 输出)
          ERROR_CODE=""
          if [ -n "${{ steps.start-infra.outputs.error_code }}" ]; then
            ERROR_CODE="${{ steps.start-infra.outputs.error_code }}"
          fi
          # job.status 在 always step 中表示本 job 截至当前步骤的聚合状态；
          # finalizer 还会逐字段校验 Step 4 落盘的 current-run identity。
          python scripts/finalize_secretless_result.py \
            --job-status '${{ job.status }}' \
            --expected-sha '${{ github.sha }}' \
            --expected-run-id '${{ github.run_id }}' \
            --expected-run-attempt '${{ github.run_attempt }}' \
            --expected-workflow-path '.github/workflows/secretless-contract-e2e.yml' \
            --expected-event '${{ github.event_name }}' \
            --error-code "${ERROR_CODE}" \
            --output artifacts/secretless-e2e/result.json
          echo "✓ result.json finalized (path always present)"

      # ────────────────────────────────────────────────────────────
      # Step 17: Diagnostic — 在 upload 之前采集所有诊断证据
      # (R81 §10.6: 诊断必须在 upload 之前,确保 artifact 包含完整证据)
      # ────────────────────────────────────────────────────────────
      - name: "Step 17: Collect diagnostics (before upload)"
        if: always()
        run: |
          set +e
          mkdir -p artifacts/secretless-e2e/diagnostics
          echo "=== Step 17: Collect diagnostics ==="

          # R81 §10.6: 容器日志
          docker logs tgjiema-up > artifacts/secretless-e2e/diagnostics/up-bot.log 2>&1 || true
          docker logs tgjiema-provider-sim > artifacts/secretless-e2e/diagnostics/provider-sim.log 2>&1 || true
          docker logs tgjiema-idx > artifacts/secretless-e2e/diagnostics/idx-bot.log 2>&1 || true
          docker logs tgjiema-dsp > artifacts/secretless-e2e/diagnostics/dsp-bot.log 2>&1 || true
          docker logs tgjiema-minio > artifacts/secretless-e2e/diagnostics/minio.log 2>&1 || true
          docker logs tgjiema-cockroachdb > artifacts/secretless-e2e/diagnostics/cockroachdb.log 2>&1 || true
          docker logs tgjiema-redis > artifacts/secretless-e2e/diagnostics/redis.log 2>&1 || true

          # R81 §10.6: compose logs / ps
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            logs --no-color > artifacts/secretless-e2e/diagnostics/compose.log 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            ps --all > artifacts/secretless-e2e/diagnostics/compose-ps.txt 2>&1 || true

          # R81 §10.6: git SHA + compose config 脱敏版本
          git rev-parse HEAD > artifacts/secretless-e2e/diagnostics/git-sha.txt 2>&1 || true
          git log -1 --format=fuller > artifacts/secretless-e2e/diagnostics/git-log.txt 2>&1 || true

          # R81 §10.6: 汇总 Step 12/13/14/15 各 phase 的 exitcode(若存在)
          {
            echo "=== Phase exitcodes ==="
            for d in artifacts/secretless-e2e/step12 artifacts/secretless-e2e/step13 artifacts/secretless-e2e/step14 artifacts/secretless-e2e/step15; do
              if [ -d "${d}" ]; then
                echo "--- ${d} ---"
                for f in "${d}"/*.exitcode; do
                  [ -f "${f}" ] && echo "$(basename "${f}"): $(cat "${f}")"
                done
              fi
            done
          } > artifacts/secretless-e2e/diagnostics/phase-exitcodes.txt 2>&1 || true

          # R81 §10.6: result.json + phase JSONs 汇总
          [ -f artifacts/secretless-e2e/result.json ] && \
            cp artifacts/secretless-e2e/result.json artifacts/secretless-e2e/diagnostics/result.json || true
          if [ -d artifacts/secretless-e2e/phases ]; then
            mkdir -p artifacts/secretless-e2e/diagnostics/phases
            cp artifacts/secretless-e2e/phases/*.json artifacts/secretless-e2e/diagnostics/phases/ 2>/dev/null || true
          fi
          echo "✓ Diagnostics collected"

      # ────────────────────────────────────────────────────────────
      # Step 18: Cleanup(报告 O12 step 14 — finally)
      # ────────────────────────────────────────────────────────────
      # cleanup 失败不得覆盖此前主失败，但在此前业务阶段全成功时必须阻断 GO。
      # 先落盘结构化 evidence，再原样返回 cleanup rc；Step 19 使用最新 job.status
      # 重算最终 result.json，确保 Step 20 不会在 cleanup 失败后误报 GO。
      - name: "Step 18: Cleanup (always)"
        if: always()
        run: |
          set +e
          echo "=== Step 18: Cleanup ==="
          docker compose -f docker-compose.yml -f docker-compose.secretless.yml \
            down -v --remove-orphans
          CLEANUP_RC=$?
          set -e
          python - "${CLEANUP_RC}" <<'PY'
          import json
          import sys
          from pathlib import Path

          returncode = int(sys.argv[1])
          output = Path("artifacts/secretless-e2e/cleanup.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {
                      "schema_version": "secretless-cleanup/v1",
                      "status": "success" if returncode == 0 else "failure",
                      "returncode": returncode,
                      "error_code": "" if returncode == 0 else "SECRETLESS_CLEANUP_FAILED",
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          exit "${CLEANUP_RC}"

      - name: "Step 19: Re-finalize result after cleanup (always)"
        if: always()
        run: |
          set -Eeuo pipefail
          ERROR_CODE=""
          if [ -n "${{ steps.start-infra.outputs.error_code }}" ]; then
            ERROR_CODE="${{ steps.start-infra.outputs.error_code }}"
          fi
          python scripts/finalize_secretless_result.py \
            --job-status '${{ job.status }}' \
            --expected-sha '${{ github.sha }}' \
            --expected-run-id '${{ github.run_id }}' \
            --expected-run-attempt '${{ github.run_attempt }}' \
            --expected-workflow-path '.github/workflows/secretless-contract-e2e.yml' \
            --expected-event '${{ github.event_name }}' \
            --error-code "${ERROR_CODE}" \
            --output artifacts/secretless-e2e/result.json

      # ────────────────────────────────────────────────────────────
      # Step 20: Final verdict — SECRETLESS FUNCTIONAL GO / NO-GO
      # ────────────────────────────────────────────────────────────
      - name: "Step 20: Final verdict"
        if: always()
        run: |
          set -Eeuo pipefail
          python scripts/verify_secretless_final_result.py \
            --result artifacts/secretless-e2e/result.json \
            --expected-sha "${GITHUB_SHA}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-workflow-path ".github/workflows/secretless-contract-e2e.yml" \
            --expected-event "${GITHUB_EVENT_NAME}" \
            --output artifacts/secretless-e2e/step20/final-verdict.json
          echo "============================================================"
          echo "  SECRETLESS FUNCTIONAL GO"
          echo "============================================================"

      # ────────────────────────────────────────────────────────────
      # Step 21: 最终 artifact 上传。必须位于 Step 20 之后，确保上传包包含
      # machine-readable final-verdict.json；Step 20 失败时仍上传 rejected evidence。
      # ────────────────────────────────────────────────────────────
      - name: "Step 21: Upload final secretless e2e artifacts"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secretless-e2e-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/secretless-e2e/
            deployment-state-*.json
          retention-days: 14

  # ════════════════════════════════════════════════════════════════
  # Job 2: 负向验收 — 验证无禁止模式存在(报告 10.B 负向验收)
  # ════════════════════════════════════════════════════════════════
  negative-acceptance:
    name: Negative acceptance (no forbidden patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: "Negative acceptance — grep forbidden patterns"
        run: |
          echo "=== Negative acceptance: forbidden patterns must NOT appear ==="
          VIOLATION=0

          # 报告 10.B 负向验收:e2e_update_adapter.py 不得含私有 handler 直调
          echo "[1] Check e2e_update_adapter.py for private handler calls..."
          if grep -E '(_dispatch_media|_process_one_pending|process_queue)' scripts/e2e_update_adapter.py; then
            echo "::error::Forbidden private handler call found in e2e_update_adapter.py"
            VIOLATION=1
          fi

          # 报告 10.B 负向验收:Update 不得含 _e2e_file_content_b64
          # R76 10.B: 只检查 e2e_update_adapter.py 是否在构造 Update 时赋值此字段
          # (测试文件中引用此字段名用于验证负向场景是合理的,不应误报)
          echo "[2] Check for _e2e_file_content_b64 in e2e_update_adapter.py..."
          if grep -E '_e2e_file_content_b64' scripts/e2e_update_adapter.py 2>/dev/null; then
            echo "::error::Forbidden _e2e_file_content_b64 found in e2e_update_adapter.py"
            VIOLATION=1
          fi

          # 报告 10.B 负向验收:不得有 bot=None / print('OK') 作为成功标准
          echo "[3] Check for bot=None / print('OK') success criteria..."
          if grep -E 'bot\s*=\s*None' scripts/e2e_update_adapter.py; then
            echo "::error::Forbidden bot=None found in e2e_update_adapter.py"
            VIOLATION=1
          fi

          # 报告 10.B 负向验收:不得有 docker compose exec ... python -c
          echo "[4] Check for docker compose exec ... python -c..."
          if grep -E 'docker\s+compose\s+exec.*python\s+-c' scripts/e2e_update_adapter.py; then
            echo "::error::Forbidden docker compose exec ... python -c found"
            VIOLATION=1
          fi

          # 报告 10.F:不得有 lightweight tag fallback
          # R76 10.F: 只匹配明确的 lightweight tag fallback/warning 文本,
          # 不匹配通用 shell 错误处理 `2>/dev/null || echo ""`(误报太多)
          echo "[5] Check for lightweight tag fallback in release-gates.yml..."
          if grep -v '^\s*#' .github/workflows/release-gates.yml | grep -E 'lightweight.*fallback|warning.*lightweight'; then
            echo "::error::Forbidden lightweight tag fallback found in release-gates.yml"
            VIOLATION=1
          fi

          # 报告 10.M:scanner 不得含 curl / git tag -d / git tag 全局豁免
          echo "[6] Check scanner UTILITY_CMD_PREFIXES for curl/git tag..."
          if grep -E '"curl"|"git\s+tag\s+-d"|"git\s+tag"' scripts/scan_production_bypasses.py; then
            echo "::error::Forbidden curl/git tag in UTILITY_CMD_PREFIXES"
            VIOLATION=1
          fi

          # 报告 10.M:scanner 不得含 _run / _compose_cmd 函数级豁免
          echo "[7] Check scanner _FUNC_LEVEL_EXEMPT_FUNCTIONS for _run/_compose_cmd..."
          if grep -E '"_run"|"_compose_cmd"' scripts/scan_production_bypasses.py; then
            echo "::error::Forbidden _run/_compose_cmd in _FUNC_LEVEL_EXEMPT_FUNCTIONS"
            VIOLATION=1
          fi

          # 报告 10.J:restore_capability_file.py 不得含 /tmp/restore_nonce_store 默认
          # R76 10.J: 排除注释和文档字符串行,只检查实际代码(函数签名/赋值)
          # (文件中 docstring 引用 "/tmp/restore_nonce_store 默认值" 用于说明删除原因,是合理的)
          echo "[8] Check restore_capability_file.py for /tmp nonce store..."
          if grep -v '^\s*#\|^\s*-\|^\s*\*\*\|^\s*`' services/restore_capability_file.py | grep -E '/tmp/restore_nonce_store|nonce_store_dir'; then
            echo "::error::Forbidden /tmp nonce store found in restore_capability_file.py"
            VIOLATION=1
          fi

          # 报告 10.I:restore_writer.py 不得从 capability 回填 expected 值
          echo "[9] Check restore_writer.py for capability self-comparison..."
          if grep -E 'operation_id\s*=\s*capability\.get\(|source_sha\s*=\s*capability\.get\(|expected_nonce\s*=\s*capability\.get\(' services/restore_writer.py; then
            echo "::error::Forbidden capability self-comparison found in restore_writer.py"
            VIOLATION=1
          fi

          # 报告 10.A:工作流不得读取 secrets.TEST_* / secrets.R2_* / secrets.COCKROACHDB_*
          # R76 10.A: 排除注释行,只检查实际的 secrets.* 引用
          # (文件头部注释中说明"不读取 secrets.TEST_*"是合理的,不应误报)
          echo "[10] Check workflows for forbidden secrets references..."
          if grep -v '^\s*#' .github/workflows/secretless-contract-e2e.yml | grep -E 'secrets\.(TEST_|R2_|COCKROACHDB_)'; then
            echo "::error::Forbidden secrets.* reference found in secretless-contract-e2e.yml"
            VIOLATION=1
          fi

          if [ "${VIOLATION}" = "1" ]; then
            echo "::error::Negative acceptance FAILED — forbidden patterns detected"
            exit 1
          fi
          echo "✓ All negative acceptance checks passed"

      - name: "Validate workflow syntax (actionlint-style)"
        run: |
          echo "=== Validate workflow YAML syntax ==="
          pip install --quiet pyyaml
          python -c "
          import yaml
          import sys
          with open('.github/workflows/secretless-contract-e2e.yml') as f:
              doc = yaml.safe_load(f)
          if 'jobs' not in doc:
              print('ERROR: no jobs key')
              sys.exit(1)
          if len(doc['jobs']) == 0:
              print('ERROR: 0 jobs')
              sys.exit(1)
          print(f'✓ {len(doc[\"jobs\"])} jobs parsed successfully')
          for name, job in doc['jobs'].items():
              print(f'  - {name}: {len(job.get(\"steps\", []))} steps')
          "

  # ════════════════════════════════════════════════════════════════
  # Job 3: 总结 — 所有 job 必须通过
  # ════════════════════════════════════════════════════════════════
  summary:
    name: Secretless E2E Summary
    runs-on: ubuntu-latest
    needs: [secretless-e2e, negative-acceptance]
    if: always()
    steps:
      - name: "Final summary"
        run: |
          echo "============================================================"
          echo "Secretless Contract E2E Summary"
          echo "============================================================"
          echo "secretless-e2e: ${{ needs.secretless-e2e.result }}"
          echo "negative-acceptance: ${{ needs.negative-acceptance.result }}"
          echo "============================================================"
          if [ "${{ needs.secretless-e2e.result }}" != "success" ]; then
            echo "::error::secretless-e2e job failed"
            exit 1
          fi
          if [ "${{ needs.negative-acceptance.result }}" != "success" ]; then
            echo "::error::negative-acceptance job failed"
            exit 1
          fi
          echo "SECRETLESS FUNCTIONAL GO"
