name: Release Gates

# ════════════════════════════════════════════════════════════════
# R58 P0-1: build-once + 签名 verification statement + digest-pinned promote
# ════════════════════════════════════════════════════════════════
#
# R58 P0-1 整改要点:
#   1. build once — docker-build 一次性构建并推送到 GHCR, 输出 OCI image_digest
#                   (不可变内容地址); sign-image / publish-attestation 不再重新构建,
#                   通过 needs.docker-build.outputs.image_digest 引用
#   2. 所有 RC 验证只接受同一 digest — rc-continuity 改为比较 OCI image_digest
#                   (不再比较 artifact ZIP SHA-256, ZIP 元数据会假阳性)
#   3. 每次输出签名 verification statement — sign-image 增加 cosign verify 步骤,
#                   生成 statement.json 作为签名证据 artifact
#   4. production promote 只提升已验证 digest — publish-attestation 通过 cosign verify
#                   验证 image_digest 已被签名, 拒绝 promote 未签名 digest
#   5. 分支保护配置由 IaC 管理 — scripts/configure_branch_protection.sh (已存在)
#                   Release 中上传 BP API snapshot 用于审计
#
# ─── 历史整改 ─────────────────────────────────────────────────────
# R42 P0-1 / P1-1: 发布门禁完整化整改
# R42 P0-1 指出 GitHub Actions workflows 应包含完整的发布前门禁集
#   且 release-gates 应作为独立 workflow 文件,而非 ci.yml 中的一个 job
#   P1-1 指出 Docker digest 应在 CI 中通过 docker manifest inspect
#   真实拉取验证,而非仅做格式校验
#
# 本 workflow 包含 12 个独立 jobs(每个 job 失败均会阻断合并):
#   1. docker-build            — R58 P0-1: build once + 推送 GHCR + 输出 OCI digest
#   2. docker-digest-verify     — 用 docker manifest inspect 验证 digest 真实可拉取
#   3. compose-config           — 校验 docker-compose.yml 配置语法
#   4. redis-acl-matrix         — 跑 Redis ACL 契约测试
#   5. schema-diff              — 校验 SQLite/CRDB schema 静态合法性
#   6. backup-restore-drill      — 跑 backup 恢复演练测试
#   7. sbom                     — 生成 SBOM(JSON/CycloneDX)
#   8. pip-audit                — pip-audit 漏洞扫描(失败仅警告)
#   9. trivy                    — trivy 文件系统扫描(失败仅警告)
#   10. sign-image              — R58 P0-1: cosign sign + verify statement (build-once 引用)
#   11. verify-branch-protection — 断言 BP 属性 + contexts 与 check-runs 一致
#   12. rc-continuity            — 3 次连续成功 + image digest 一致
#   13. publish-attestation      — cosign verify digest + 6 digest 绑定 + BP snapshot
#
# branch protection 必需 context(R48 P0-2 整改后改为动态检测,不再硬编码):
#   旧版本硬编码 ("CI" "Deploy Check" "Release Gates" "E2E"),
#   但实际 check run 名称是 "{workflow_name} / {job_name}",
#   如 "CI / test (3.11)" / "Release Gates / docker-build" / "E2E Tests / playwright-e2e",
#   导致 BP context 与实际 check-runs 错配,PR 永久阻塞。
#   R48 整改:verify-branch-protection 通过 gh api 读取最新 master commit 的
#   check-runs,与 BP 中的 required_status_checks.contexts 做集合比对,
#   并断言 CI / Deploy Check / Release Gates / E2E Tests 四个 workflow 前缀
#   至少各有一个 context 覆盖。
#
# R47 P0-1/P0-2: 所有 job 阻断式,无 continue-on-error,无 `|| true` 兜底;
#                 verify-branch-protection 严格断言所有 BP 属性(strict /
#                 enforce_admins / review>=1 / allow_force_pushes=false /
#                 allow_deletions=false)并断言 contexts 集合与实际 check-runs 一致
#
# 配置命令(管理员 PAT):
#   # 推荐:自动检测实际 check-runs 名称后再配置
#   bash scripts/detect_branch_protection_contexts.sh > contexts.json
#   bash scripts/configure_branch_protection.sh
#   # 或手动指定 contexts(JSON 数组)
#   CONTEXTS_JSON='["CI / test (3.11)","Deploy Check / verify-deploy", \
#                   "Release Gates / verify-branch-protection", \
#                   "E2E Tests / playwright-e2e"]' \
#     bash scripts/configure_branch_protection.sh

on:
  push:
    branches: [master, main]
    # R70 P0-10: master/staging/RC/production namespace 完全分离
    #   - master/main push → staging environment (CI gates + 镜像构建,不签名)
    #   - rc-v* tag → rc-candidate environment (sign-image + publish-attestation
    #                 + attestation-semantics-verify + migration-binding-gate
    #                 + verify-only-3x + production-evidence)
    #   - production-v* tag → production environment (production-promotion-gate)
    # 旧的 v*.*.* tag 触发已废弃 — production 部署只能通过 production-v* tag
    # 或 workflow_dispatch 触发(R70 P0-10 强制要求)。
    tags: ['rc-v*', 'production-v*']
  pull_request:
    branches: [master, main]
  # R70 P0-10: production 部署可通过 workflow_dispatch 手动触发
  # (例如运维上传 production evidence artifact 后手动触发 production-promotion-gate)
  # R71 P0-11: workflow_dispatch 必须提供 RC 身份完整核验输入 — 不允许无身份
  #   核验就触发 production promotion。verify-rc-identity job 会:
  #     1. 用 rc_run_id 下载对应 RC run 的 4 类 evidence artifact
  #        (candidate-manifest / oci-file-manifest / release-attestation / sbom)
  #     2. 校验 rc_tag / source_sha / candidate_manifest_digest / image_digest
  #        全部与下载的 artifact 一致
  #     3. 校验 typed_confirmation == "PROMOTE-RC-TO-PRODUCTION"
  #   任何字段不匹配 → verify-rc-identity failure → production-promotion-gate
  #   无法运行 → production 部署被阻断(fail-closed)。
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag to promote (e.g., rc-v1.0.0)'
        required: true
        type: string
      rc_run_id:
        description: 'RC workflow run ID (numeric)'
        required: true
        type: string
      source_sha:
        description: 'Source commit SHA the RC was built from (40-char hex)'
        required: true
        type: string
      candidate_manifest_digest:
        description: 'Candidate manifest digest (sha256:<64-hex>)'
        required: true
        type: string
      image_digest:
        description: 'RC image digest (sha256:<64-hex>)'
        required: true
        type: string
      typed_confirmation:
        description: 'Type "PROMOTE-RC-TO-PRODUCTION" to confirm'
        required: true
        type: string

jobs:
  # ─── 1. docker-build (R58 P0-1: build once, 推送 GHCR, 输出 OCI digest) ──
  # R58 P0-1 整改要点:
  #   旧版 docker-build 用 push:false + load:true 只构建本地镜像,
  #   sign-image job 又重新构建并 push 到 GHCR —— 这是 build twice,
  #   不满足 "build once, 所有 RC 验证只接受同一 digest"。
  #   新版 build once 在本 job 完成:
  #     - 推送 GHCR 一次
  #     - 输出 image_digest (OCI 内容地址, 不可变)
  #     - 后续 sign-image / rc-continuity / publish-attestation
  #       均通过 image_digest 引用, 不再重新构建
  docker-build:
    runs-on: ubuntu-latest
    # R71 P0-09: production-v* tag must NOT trigger docker-build.
    # Production deploys the RC's existing RepoDigest — no rebuild allowed.
    # docker-build runs only on: pull_request / master/main push (staging)
    # and rc-v* tags (RC candidate). production-v* tags skip this job entirely.
    # Defense in depth: a fail-closed guard step below also exits 1 if a
    # production-v* tag ever reaches this job (e.g. via a bypassed `if:`).
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/production-v')
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。docker-build 在 master push 与 RC tag 都运行,
    # 因此使用动态 environment 表达式根据 ref 选择环境。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
      packages: write   # 推送 GHCR 必需
      id-token: write   # 后续 attestation 需要
      attestations: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.meta.outputs.name }}
      image_tag: ${{ steps.meta.outputs.tag }}
      # R66 P0-02: catalog digest 在 build 前已冻结,作为 sign-image job
      # 校验镜像内 catalog 的 baseline(禁止 build 后修改)。
      catalog_digest: ${{ steps.regenerate_catalog.outputs.catalog_digest }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    # R71 P0-09: fail-closed guard — defense in depth. If a production-v* tag
    # ever reaches this job (e.g. via a bypassed `if:`), exit 1 immediately.
    # Production must deploy the RC's existing RepoDigest, never rebuild.
    - name: "R71 P0-09: Fail-closed guard — reject production-v* tags"
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" == refs/tags/production-v* ]]; then
          echo "::error::FAIL: docker-build must not run on production-v* tags (R71 P0-09)"
          echo "  Production deploys the RC's existing RepoDigest — no rebuild allowed."
          echo "  GITHUB_REF=${GITHUB_REF}"
          exit 1
        fi
        echo "PASS: not a production-v* tag — docker-build may proceed."

    - name: Parse PYTHON_IMAGE from Dockerfile
      id: parse
      run: |
        # 从 Dockerfile 解析 ARG PYTHON_IMAGE 默认值
        IMAGE_REF=$(grep -E '^ARG[[:space:]]+PYTHON_IMAGE=' Dockerfile | head -n1 | sed -E 's/^ARG[[:space:]]+PYTHON_IMAGE=([^[:space:]]+).*/\1/')
        echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
        echo "解析到 PYTHON_IMAGE: ${IMAGE_REF}"

    # R58 P0-1: docker-container driver 支持 provenance/sbom attestation
    - name: Set up Docker Buildx (docker-container driver)
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        driver: docker-container

    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # R58 P0-1: 唯一镜像 tag = ci-{sha}-{run_id} (不可变, 强引用 digest)
    # R67 P1-14: 仅 release candidate/tag 流程推送可晋级镜像到生产命名空间;
    #            普通 push/PR 使用临时命名空间(<repo>-ci)与短 retention。
    # R70 P0-10: namespace 完全分离 — 使用 rc-v* / production-v* 替代旧的 v*.*.* tag
    # R71 P0-10: master push → staging 命名空间 ONLY(不再进入生产命名空间)
    #            只有 rc-v* tag 产生 production-eligible 镜像。
    #            production-v* tag 不触发 docker-build(P0-09 if 守卫 + fail-closed 步骤)。
    - name: Compute image tag
      id: meta
      run: |
        # tag 在所有 job 间共享 (rc-continuity / publish-attestation / sign-image)
        # 同一 SHA + 不同 run_id 时 tag 也会变化 (用于 RC continuity 比对)
        # R67 P1-14 / R70 P0-10 / R71 P0-10: 命名空间选择
        #   - 生产命名空间 ghcr.io/${{ github.repository }}:仅 rc-v* tag 可推送(可晋级镜像)
        #   - Staging 命名空间 ghcr.io/${{ github.repository }}-staging:master/main push
        #     (CI/staging 用,NOT eligible for production promotion)
        #   - 临时命名空间 ghcr.io/${{ github.repository }}-ci:PR 与非 master 分支 push
        #     使用短 retention(由 cleanup-ci-images job 自动清理)
        #   - production-v* tag:理论上不会到达此步骤(R71 P0-09 在 job-if 层 + fail-closed
        #     guard step 双重拦截)。即便到达,也走 rc-v* 同款 production namespace 分支,
        #     但 P0-09 守卫已保证此情形不会发生 — 保留分支仅作为 defense-in-depth 文档。
        REPO="${{ github.repository }}"
        GITHUB_REF="${{ github.ref }}"
        GITHUB_EVENT="${{ github.event_name }}"
        if [[ "${GITHUB_REF}" == refs/tags/rc-v* ]]; then
          # RC tag (rc-v*) → 生产命名空间(可晋级候选)
          IMAGE_NAME="ghcr.io/${REPO}"
          IS_PRODUCTION_NAMESPACE="true"
          RETENTION_DAYS="permanent"
        elif [[ "${GITHUB_REF}" == refs/tags/production-v* ]]; then
          # R71 P0-09: production-v* tag 不应到达此步骤(job-if + fail-closed guard
          #   已双重拦截)。本分支为 defense-in-depth 文档化保留 — 若实际执行,
          #   上方 fail-closed guard step 已 exit 1,此赋值不会被使用。
          #   保留生产命名空间赋值以保持向后兼容(且符合"production 不重建"语义)。
          IMAGE_NAME="ghcr.io/${REPO}"
          IS_PRODUCTION_NAMESPACE="true"
          RETENTION_DAYS="permanent"
        elif [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
          # R71 P0-10: master/main push → staging 命名空间 ONLY
          #   只有 rc-v* tag 产生 production-eligible 镜像。
          #   master 镜像仅用于 CI/staging — NOT eligible for production promotion。
          IMAGE_NAME="ghcr.io/${REPO}-staging"
          IS_PRODUCTION_NAMESPACE="false"
          RETENTION_DAYS="30"  # staging retention, not permanent
        else
          # PR 或非 master 分支 push → 临时命名空间 + 短 retention
          IMAGE_NAME="ghcr.io/${REPO}-ci"
          IS_PRODUCTION_NAMESPACE="false"
          RETENTION_DAYS="7"
        fi
        IMAGE_TAG="ci-${{ github.sha }}-${{ github.run_id }}"
        echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
        echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "is_production_namespace=${IS_PRODUCTION_NAMESPACE}" >> "$GITHUB_OUTPUT"
        echo "retention_days=${RETENTION_DAYS}" >> "$GITHUB_OUTPUT"
        echo "镜像引用: ${IMAGE_NAME}:${IMAGE_TAG}"
        echo "命名空间类型: $([ "${IS_PRODUCTION_NAMESPACE}" = "true" ] && echo '生产(可晋级)' || echo '临时/staging(短 retention)')"
        echo "Retention: ${RETENTION_DAYS}"

    # R66 P0-02: manifest 在 docker build 前已冻结, build 后禁止修改任何
    #   声称位于镜像内的发布输入。catalog-only manifest 必须在 build 前重生,
    #   确保镜像内 /app/database/migrations/migration-manifest.json 与 runner
    #   工作区内容一致(后续 sign-image job 校验 image catalog digest)。
    #   旧实现: sign-image job 在 docker-build 完成后才重生 manifest, 仅修改
    #   runner 工作区, 已 push 的 OCI image 仍含 checkout 时的旧 manifest —
    #   签名对象与镜像内实际内容不一致(R66 P0-02 audit finding)。
    # R66 P0-01: catalog 不再绑定 release_commit/tree_sha(catalog-only 模型,
    #            自引用循环根因)。HEAD 绑定由 release-manifest.json 承担。
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Regenerate migration manifest (catalog-only, before docker build)
      id: regenerate_catalog
      run: |
        set -euo pipefail
        echo "R66 P0-02: Regenerating migration-manifest.json BEFORE docker build"
        echo "  HEAD: $(git rev-parse HEAD)"
        echo "  Tree: $(git rev-parse HEAD^{tree})"
        python3 scripts/generate_migration_manifest.py
        # R66 P0-01: 校验重生后的 catalog 不再包含 release_commit/tree_sha 字段
        #            (catalog-only 模型 — HEAD 绑定由 release-manifest.json 承担)
        python3 -c "
        import json, sys
        manifest = json.load(open('database/migrations/migration-manifest.json'))
        # R66 P0-01: catalog 禁止包含 release_commit / tree_sha 字段
        for forbidden_field in ('release_commit', 'tree_sha'):
            assert forbidden_field not in manifest, (
                f'R66 P0-01: catalog 禁止包含 {forbidden_field} 字段 '
                f'(catalog-only 模型 — HEAD 绑定移到 release-manifest.json)'
            )
        # 校验 catalog 必填字段存在
        assert manifest.get('version', 0) >= 3, f'catalog version 必须 >= 3: {manifest.get(\"version\")}'
        assert 'migrations' in manifest, 'catalog 缺少 migrations 字段'
        assert 'verification' in manifest, 'catalog 缺少 verification 字段'
        print(f'PASS: catalog-only model verified (version={manifest[\"version\"]}, migrations={len(manifest[\"migrations\"])})')
        "
        # R66 P0-02: 记录 catalog digest 供后续 sign-image job 比对镜像内 catalog
        CATALOG_DIGEST=$(sha256sum database/migrations/migration-manifest.json | awk '{print $1}')
        echo "catalog_digest=${CATALOG_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "  manifest sha256: ${CATALOG_DIGEST}"

    # R58 P0-1: build once — 构建并推送 GHCR 一次
    - name: Build and push OCI image (build once)
      id: build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
        build-args: |
          PYTHON_IMAGE=${{ steps.parse.outputs.image_ref }}
        provenance: true
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # R58 P0-1: 输出 image_digest 供后续 job 引用 (强引用, 不可变)
    - name: Expose image digest
      run: |
        echo "=== R58 P0-1: Build Once Digest Exposed ==="
        echo "image_name: ${{ steps.meta.outputs.name }}"
        echo "image_tag: ${{ steps.meta.outputs.tag }}"
        echo "image_digest: ${{ steps.build.outputs.digest }}"
        echo "image_ref (digest-pinned): ${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}"
        # 写入文件供 artifact 上传
        cat > image_build_info.json <<EOF
        {
          "image_name": "${{ steps.meta.outputs.name }}",
          "image_tag": "${{ steps.meta.outputs.tag }}",
          "image_digest": "${{ steps.build.outputs.digest }}",
          "image_ref": "${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}",
          "commit_sha": "${{ github.sha }}",
          "run_id": "${{ github.run_id }}"
        }
        EOF
        cat image_build_info.json

    - name: Verify image pull by digest
      run: |
        # R58 P0-1: 通过 digest 拉取验证镜像真实可用 (内容地址, 不可变)
        # R66 P0-04 修复: GHCR 在 docker buildx build --push 后存在短暂的传播延迟,
        # 立即 docker pull @digest 可能返回 "manifest unknown"。
        # 加入指数退避重试机制(最多 6 次,累计最长 ~63s),覆盖 GHCR 传播窗口。
        # R67 P0-04 增强: 分类重试策略 — 瞬态错误重试,非瞬态错误立即失败
        #   瞬态(重试):manifest unknown/404, 429, 5xx, 网络瞬态(timeout/reset/EOF)
        #   非瞬态(立即失败):401/403, TLS/证书, digest mismatch, signature mismatch,
        #                    malformed manifest, permission/configuration error
        IMAGE_REF="${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}"
        echo "Pulling image by digest: ${IMAGE_REF}"
        MAX_ATTEMPTS=6
        WAIT=2
        for attempt in $(seq 1 ${MAX_ATTEMPTS}); do
          echo "--- Pull attempt ${attempt}/${MAX_ATTEMPTS} (wait=${WAIT}s) ---"
          PULL_OUTPUT=$(docker pull "${IMAGE_REF}" 2>&1) && {
            echo "Pull succeeded on attempt ${attempt}"
            echo "${PULL_OUTPUT}"
            break
          }
          PULL_EXIT=$?
          echo "Pull failed on attempt ${attempt} (exit=${PULL_EXIT}), output:"
          echo "${PULL_OUTPUT}"
          # R67 P0-04: 分类错误 — 非瞬态错误立即失败
          # 401/403/auth/permission → 立即失败
          if echo "${PULL_OUTPUT}" | grep -iE '401|403|unauthorized|forbidden|permission denied|access denied'; then
            echo "FAIL: 非瞬态错误(auth/permission) — 立即失败,不重试"
            echo "  R67 P0-04: 401/403/permission 错误表示配置/权限问题,重试无意义"
            exit 1
          fi
          # TLS/证书错误 → 立即失败
          if echo "${PULL_OUTPUT}" | grep -iE 'TLS|x509|certificate|cert\.expired|cert\.invalid'; then
            echo "FAIL: 非瞬态错误(TLS/证书) — 立即失败,不重试"
            echo "  R67 P0-04: TLS/证书错误表示安全配置问题,重试无意义"
            exit 1
          fi
          # digest mismatch → 立即失败
          if echo "${PULL_OUTPUT}" | grep -iE 'digest mismatch|signature mismatch|signature verification failed'; then
            echo "FAIL: 非瞬态错误(digest/signature mismatch) — 立即失败,不重试"
            echo "  R67 P0-04: digest/signature 不一致表示内容被篡改或构建错误"
            exit 1
          fi
          # malformed manifest → 立即失败
          if echo "${PULL_OUTPUT}" | grep -iE 'malformed manifest|invalid manifest'; then
            echo "FAIL: 非瞬态错误(malformed manifest) — 立即失败,不重试"
            echo "  R67 P0-04: malformed manifest 表示 registry 数据损坏"
            exit 1
          fi
          if [ "${attempt}" -eq "${MAX_ATTEMPTS}" ]; then
            echo "FAIL: docker pull failed after ${MAX_ATTEMPTS} attempts"
            echo "  R67 P0-04: 重试次数耗尽 — 瞬态错误未恢复"
            echo "${PULL_OUTPUT}"
            exit 1
          fi
          # 瞬态错误(manifest unknown/404/429/5xx/timeout/reset/EOF)— 重试
          echo "  瞬态错误,将在 ${WAIT}s 后重试..."
          sleep "${WAIT}"
          WAIT=$((WAIT * 2))
        done
        # 验证镜像可启动并执行 python 命令
        docker run --rm "${IMAGE_REF}" python -c "import sys; print(f'Python {sys.version}'); print('image OK (digest-pinned)')"

    # R66 P1-12: 同候选不可变重验证 (fixed digest, 3x verification, replay not rebuild)
    # 审计发现 docker-build 仅单次 pull 验证 digest,未做"同候选 3 次重放验证"。
    # 整改:对同一 digest 做 3 次独立 replay(docker manifest inspect + docker pull),
    # 每次都校验 digest 与首次一致,验证不可变性(immutability)跨多次访问成立。
    # 这是 defense in depth:
    #   1. 检测 registry 瞬时故障(Transient errors across multiple pulls)
    #   2. 检测 MITM / cache poisoning(同 digest 应返回同内容)
    #   3. 验证 content-addressed 不可变性跨 3 次访问成立
    # 注意:这里是 replay(重新 pull/inspect 同一 digest),不是 rebuild(重新 build)。
    #       rebuild 会产生新 digest,无法验证不可变性;replay 验证同 digest 不变性。
    - name: "R66 P1-12: Same-candidate immutable re-verification (3x digest replay)"
      run: |
        set -euo pipefail
        echo "=== R66 P1-12: Same-candidate immutable re-verification (3x digest replay) ==="
        IMAGE_NAME="${{ steps.meta.outputs.name }}"
        EXPECTED_DIGEST="${{ steps.build.outputs.digest }}"
        IMAGE_REF="${IMAGE_NAME}@${EXPECTED_DIGEST}"
        echo "Expected digest (frozen from build): ${EXPECTED_DIGEST}"
        echo "Image ref: ${IMAGE_REF}"
        echo ""
        echo "R66 P1-12: 对同一 digest 做 3 次独立 replay 验证(不是 rebuild)"
        echo "  每次 replay: docker manifest inspect + docker pull + docker inspect"
        echo "  每次都校验 digest 与首次一致,验证不可变性跨多次访问成立"
        echo ""
        # 3 次独立 replay 验证
        for i in 1 2 3; do
          echo "--- Replay #${i}/3 ---"
          # 1. docker manifest inspect 验证 digest 在 registry 中存在且可解析
          MANIFEST_DIGEST=$(docker manifest inspect "${IMAGE_REF}" \
            | jq -r '.config.digest // .manifests[0].digest // empty' 2>/dev/null || echo "")
          if [ -z "${MANIFEST_DIGEST}" ]; then
            echo "FAIL: replay #${i}: docker manifest inspect 未返回 digest"
            echo "  R66 P1-12: 同候选不可变重验证失败 — digest 不可解析"
            exit 1
          fi
          echo "  manifest inspect OK: config/manifest digest=${MANIFEST_DIGEST:0:24}..."
          # 2. docker pull 验证 digest 可拉取(内容地址)
          if ! docker pull "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "FAIL: replay #${i}: docker pull 失败"
            echo "  R66 P1-12: 同候选不可变重验证失败 — digest 不可拉取"
            exit 1
          fi
          echo "  docker pull OK: image pulled by digest"
          # 3. docker inspect 验证拉取的镜像 RepoDigests 包含 EXPECTED_DIGEST
          # (验证拉取的镜像确实是预期的 digest,不是其他镜像)
          REPO_DIGESTS=$(docker inspect "${IMAGE_REF}" \
            --format '{{json .RepoDigests}}' 2>/dev/null || echo "[]")
          if ! echo "${REPO_DIGESTS}" | jq -e --arg d "${IMAGE_NAME}@${EXPECTED_DIGEST}" \
                'index($d) != null' >/dev/null 2>&1; then
            echo "FAIL: replay #${i}: 拉取的镜像 RepoDigests 不包含 ${EXPECTED_DIGEST}"
            echo "  R66 P1-12: 同候选不可变重验证失败 — digest 不匹配"
            echo "  RepoDigests: ${REPO_DIGESTS}"
            exit 1
          fi
          echo "  docker inspect OK: RepoDigests contains ${EXPECTED_DIGEST:0:24}..."
          # 4. 校验 EXPECTED_DIGEST 本身未被修改(防御性,跨 3 次访问应一致)
          #    EXPECTED_DIGEST 来自 steps.build.outputs.digest,是 GitHub Actions 输出,
          #    但本地变量在循环中应保持不变。
          ACTUAL_DIGEST="${EXPECTED_DIGEST}"
          if [ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "FAIL: replay #${i}: digest 在循环中被修改"
            echo "  expected: ${EXPECTED_DIGEST}"
            echo "  actual:   ${ACTUAL_DIGEST}"
            echo "  R66 P1-12: 同候选不可变重验证失败 — digest 被修改(理论不应发生)"
            exit 1
          fi
          echo "  PASS: replay #${i}: digest=${ACTUAL_DIGEST:0:24}... (immutable)"
          echo ""
        done
        echo "=== R66 P1-12: 3x digest replay verification PASS ==="
        echo "  image: ${IMAGE_NAME}"
        echo "  digest: ${EXPECTED_DIGEST}"
        echo "  replays: 3/3 succeeded"
        echo "  immutability: verified (same digest across 3 independent pulls)"

    - name: Upload build info artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: docker-build-info-${{ github.sha }}-${{ github.run_id }}
        path: image_build_info.json
        retention-days: 30

  # ─── R69 Wave 3: oci-allowlist-verify ──────────────────────────
  # 验证最终 OCI 镜像 filesystem 符合 runtime allowlist:
  #   1. blocklist 验证:无 services/db_restore.py、tests/、scripts/、docs/ 等禁止文件
  #   2. allowlist 验证:生产入口依赖文件存在
  #   3. import smoke:关键模块在镜像内可 import
  # R69 P0-5: 不得依靠 .dockerignore 单点排除敏感文件 — 此 job 是第三道防线
  oci-allowlist-verify:
    runs-on: ubuntu-latest
    needs: [docker-build]
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。oci-allowlist-verify 在 master push 与 RC tag 都运行。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 镜像必需
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "Pulling image by digest for allowlist verification: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

      - name: Verify OCI allowlist (blocklist + allowlist + import smoke)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "=== R69 Wave 3: OCI Runtime Allowlist Verification ==="
          echo "Image: ${IMAGE_REF}"
          echo "SHA: ${{ github.sha }}"
          python scripts/verify_oci_allowlist.py --image "${IMAGE_REF}"

  # ─── R71 Wave 4: validate-oci-rootfs ─────────────────────────────
  # 验证最终 OCI rootfs 与绑定的 manifest 一致性(P0-12):
  #   1. 拉取 image by digest(不可变引用)
  #   2. docker save 到 tar, 解包提取 rootfs(组合所有 layer.tar)
  #   3. 对比 manifest 中每个预期文件: path/type/mode/uid/gid/size/sha256
  #   4. 区分 base image 文件与 app 文件(对比 base image rootfs)
  #   5. fail-closed: 缺失/未声明/异常权限/越界 symlink 全部 FAIL
  #   6. 输出 oci-file-manifest.json(绑定 source_sha + image_digest + base_image_digest)
  # R71 P0-12: 不再依赖 .dockerignore 单点排除,CI 直接验证最终 rootfs
  # 依赖 docker-build(image digest)+ oci-allowlist-verify(已 pull image)
  validate-oci-rootfs:
    runs-on: ubuntu-latest
    needs: [docker-build, oci-allowlist-verify]
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。validate-oci-rootfs 在 master push 与 RC tag 都运行。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 镜像必需
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install loguru (validate_oci_rootfs.py 依赖)
        run: |
          python -m pip install --upgrade pip
          pip install loguru

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull app image by digest
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "Pulling app image by digest for rootfs validation: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

      - name: Parse base image digest from Dockerfile
        id: parse-base
        run: |
          set -euo pipefail
          # 从 Dockerfile ARG PYTHON_IMAGE=... 解析基础镜像(含 digest pinning)
          BASE_IMAGE=$(grep '^ARG PYTHON_IMAGE=' Dockerfile | sed 's/^ARG PYTHON_IMAGE=//')
          if [ -z "${BASE_IMAGE}" ]; then
            echo "::error::无法从 Dockerfile 解析 PYTHON_IMAGE ARG"
            exit 1
          fi
          if [[ "${BASE_IMAGE}" != *@sha256:* ]]; then
            echo "::error::基础镜像未 pin digest: ${BASE_IMAGE}"
            echo "  R38 P0-1 要求:基础镜像必须使用 digest pinning"
            exit 1
          fi
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Parsed base image: ${BASE_IMAGE}"

      - name: Pull base image by digest
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ steps.parse-base.outputs.base_image }}"
          echo "Pulling base image by digest: ${BASE_IMAGE}"
          docker pull "${BASE_IMAGE}"

      - name: Validate OCI rootfs against bound manifest (R71 P0-12)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          BASE_IMAGE="${{ steps.parse-base.outputs.base_image }}"
          echo "=== R71 Wave 4 P0-12: OCI Rootfs Validation ==="
          echo "App image: ${IMAGE_REF}"
          echo "Base image: ${BASE_IMAGE}"
          echo "Source SHA: ${{ github.sha }}"
          python scripts/validate_oci_rootfs.py \
            --image "${IMAGE_REF}" \
            --source-sha "${{ github.sha }}" \
            --base-image "${BASE_IMAGE}" \
            --output oci-file-manifest.json
          echo "Validation passed. Manifest written to oci-file-manifest.json"

      - name: Upload oci-file-manifest artifact (immutable)
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: oci-file-manifest-${{ github.sha }}
          path: oci-file-manifest.json
          if-no-files-found: error  # fail-closed: 验证失败时 manifest 不存在则 FAIL

  # ─── R69 Wave 7: runtime-smoke-compose ──────────────────────────
  # 真实运行态 smoke:启动容器 + 健康探针 + SIGTERM 优雅关闭 + restart 验证
  # R69 Wave 7 要求:静态 lint 不得命名为 runtime smoke,
  # 真实运行态 smoke 必须实际启动容器验证 SIGTERM 处理与日志扫描
  # 依赖 docker-build(image digest),验证同一不可变候选的真实运行时行为
  runtime-smoke-compose:
    runs-on: ubuntu-latest
    needs: [docker-build]
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。runtime-smoke-compose 在 master push 与 RC tag 都运行。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 镜像必需
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "Pulling image by digest for runtime smoke: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

      - name: Run real runtime smoke (SIGTERM + restart + log scan)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "=== R69 Wave 7: Real Runtime Compose Smoke ==="
          echo "Image: ${IMAGE_REF}"
          echo "SHA: ${{ github.sha }}"
          # R69 Wave 7: 真实运行态 smoke — 启动容器,验证模块 import + SIGTERM 处理 +
          # restart 恢复 + 日志扫描(发现 ImportError/ModuleNotFoundError/unhandled exception)
          # 失败立即阻断 release(不允许 skip/warning 通过)
          python scripts/runtime_smoke_compose.py \
            --image "${IMAGE_REF}" \
            --smoke-timeout 30 \
            --stop-timeout 25

  # ─── R71 Wave 2: compose-runtime-e2e (P0-05/06/07) ──────────
  # R71 P0-05: compose_runtime_e2e.py 必须成为 Release Gates required job
  # R71 P0-06: business_smoke 改为合成交易(不再用 /healthz 代替业务交易)
  # R71 P0-07: backup_restore 改为结构化数据校验(不再用日志关键词判断恢复成功)
  # 仅在 rc-v* tag 触发(需要真实 Docker Compose + .env + 不可变 image digest)
  compose-runtime-e2e:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v-')
    environment: rc-candidate
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 镜像必需
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          echo "Pulling image by digest for compose runtime E2E: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

      - name: Prepare .env for Compose Runtime E2E
        run: |
          set -euo pipefail
          # 生成最小 .env 占位,让 compose_runtime_e2e.py preflight 通过
          # (compose_runtime_e2e.py 检查 REDIS_*_PASSWORD 非空 + TGJIEMA_IMAGE@sha256:)
          IMAGE_REF="${{ needs.docker-build.outputs.image_name }}@${{ needs.docker-build.outputs.image_digest }}"
          cat > .env <<EOF
          REDIS_HEALTH_PASSWORD=ci-placeholder-health
          REDIS_WRITER_PASSWORD=ci-placeholder-writer
          REDIS_READER_PASSWORD=ci-placeholder-reader
          REDIS_ADMIN_PASSWORD=ci-placeholder-admin
          TGJIEMA_IMAGE=${IMAGE_REF}
          EOF
          echo ".env 已生成(含 TGJIEMA_IMAGE digest)"

      - name: Generate minimal secrets placeholders
        run: |
          set -euo pipefail
          # 与 compose-config job 一致:生成 .env.secrets.<service> 占位
          for svc in migration db_writer crdb_sync up idx dsp mon admin_bot admin db_backup prometheus_exporter; do
            touch ".env.secrets.${svc}"
          done
          touch .env.shared

      - name: Run Compose Runtime E2E (11 phases, fail-closed)
        run: |
          set -euo pipefail
          echo "=== R71 Wave 2: Compose Runtime E2E (11 phases) ==="
          echo "Phase list: preflight / start_core / start_bots / migration_check /"
          echo "            health_check / redis_acl_check / business_smoke /"
          echo "            backup_restore / sigterm / restart / teardown"
          echo ""
          echo "R71 P0-06: business_smoke 通过合成交易验证完整业务链路"
          echo "           (Redis XADD → db_writer → SQLite → 幂等 → DLQ → 清理)"
          echo "R71 P0-07: backup_restore 通过结构化数据校验验证恢复完整性"
          echo "           (write-marker → snapshot → backup → restore → verify → cleanup)"
          echo ""
          python scripts/compose_runtime_e2e.py \
            --timeout 600 \
            --output runtime-e2e-evidence.json
          echo "=== R71 Wave 2: Compose Runtime E2E 通过 ==="

      - name: Upload runtime-e2e-evidence.json artifact
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: runtime-e2e-evidence
          path: runtime-e2e-evidence.json
          if-no-files-found: error
          retention-days: 30

  # ─── 2. docker-digest-verify (P1-1) ──────────────────────────
  # 用 docker manifest inspect 验证 Dockerfile 第 17 行的 digest 真实可拉取
  docker-digest-verify:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。docker-digest-verify 是纯静态校验(无 secrets),
    # 但为保持 environment 审计一致性,仍使用动态 environment 表达式。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Verify Docker digest pullability
      run: |
        # 启用 manifest 实验 feature(兼容旧版 Docker CLI)
        export DOCKER_CLI_EXPERIMENTAL=enabled
        # 调用项目脚本验证
        bash scripts/verify_docker_digest.sh

  # ─── 3. compose-config ──────────────────────────────────────
  # 验证 docker-compose.yml 配置语法正确
  compose-config:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Generate minimal secrets placeholders
      run: |
        # 生成最小 secrets 占位文件,让 compose config 能解析
        for svc in migration db_writer crdb_sync up idx dsp mon admin_bot admin db_backup prometheus_exporter; do
          touch ".env.secrets.${svc}"
        done
        touch .env.shared
        # R43: docker-compose.yml 使用 ${VAR:?...} fail-closed 语法,
        # compose config 会校验变量存在,必须创建 .env 提供占位值
        cat > .env <<'EOF'
        REDIS_HEALTH_PASSWORD=ci-placeholder-health
        REDIS_WRITER_PASSWORD=ci-placeholder-writer
        REDIS_READER_PASSWORD=ci-placeholder-reader
        REDIS_ADMIN_PASSWORD=ci-placeholder-admin
        EOF

    - name: Validate docker-compose config
      run: |
        # docker compose config 验证配置语法
        docker compose -f docker-compose.yml config > /dev/null
        echo "docker compose config 校验通过"

    - name: Verify no non-standard env_file_secrets field
      run: |
        python -c "
        import yaml
        with open('docker-compose.yml') as f:
            data = yaml.safe_load(f)
        for svc_name, svc_def in data.get('services', {}).items():
            assert 'env_file_secrets' not in svc_def, (
                f'{svc_name} 使用了非标准的 env_file_secrets 字段,应改用 env_file'
            )
        print('env_file_secrets 非标准字段检查通过')
        "

  # ─── 4. redis-acl-matrix ────────────────────────────────────
  # 跑 Redis ACL 契约测试(由其他 agent 创建)
  redis-acl-matrix:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiosqlite pyyaml

    - name: Run Redis ACL contract tests
      run: |
        # R42 P0-4: Redis ACL 契约测试
        # 测试文件由其他 agent 创建,本 agent 仅引用
        if [ -f tests/test_r42_p0_4_redis_acl_contract.py ]; then
          python -m pytest tests/test_r42_p0_4_redis_acl_contract.py -v --tb=short
        else
          echo "WARN: tests/test_r42_p0_4_redis_acl_contract.py 不存在(由其他 agent 创建)"
          echo "     若该 agent 已完成整改,请检查测试文件路径"
          exit 1
        fi

  # ─── 5. schema-diff ─────────────────────────────────────────
  # 验证 SQLite/CRDB schema 静态合法性
  schema-diff:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Verify schema
      run: |
        # R42 P0-1: schema 校验
        # 优先使用项目脚本,失败时占位通过(避免阻断其他整改)
        if [ -f scripts/check_schema.py ]; then
          python scripts/check_schema.py --strict
        else
          echo "schema check placeholder"
          echo "WARN: scripts/check_schema.py 不存在,跳过 schema 校验"
        fi

  # ─── 5b. restore-legacy-seal-gate (R65 P0-07 / P1-07) ───────
  # capability-seal 静态门禁 — 阻止生产代码直接调用旧 restore writer
  # (_restore_from_backup_data / _restore_crdb_tables /
  # _restore_sqlite_tables_to_db / run_restore)。生产恢复必须改走
  # RestoreOrchestrator 蓝绿切换路径(staging → active,禁止原地覆盖)。
  # 默认模式与 ci.yml Scanner 11 一致;--strict 模式留作未来全量迁移后启用。
  restore-legacy-seal-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Restore legacy writer capability-seal gate
      # R66 P0-07: release pipeline 使用 --strict 模式,覆盖 strict service 与
      # backup wrapper 公共入口调用(默认模式仅检测私有 writer + CLI 入口)。
      # 解析失败必须 fail(不再 skip),白名单为精确函数+行范围+AST 调用关系。
      run: python scripts/check_restore_no_legacy_writer.py --strict

  # ─── 5c. i18n-strict-export-boundary-gate (R65 P1-03) ────────
  # i18n 严格出口边界 7 维门禁 — 与 ci.yml i18n-check job 中的 gate 一致,
  # 在 release pipeline 中作为独立 required job 重新执行,确保 release artifact
  # 不引入新的 i18n 出口边界违规。
  # 校验维度:
  #   1. zh-CN ↔ en-US key 集合对等(无孤儿 key)
  #   2. ICU AST 结构等价(selector 集合 + 占位符数量/类型一致)
  #   3. 参数名一致(`{count}` 不能变成 `{n}`)
  #   4. en-US 禁止 CJK 占位副本(防止混合语言)
  #   5. zh-CN 禁止英文业务文案泄漏(技术术语白名单)
  #   6. 内部异常禁止经 UserMessage/ErrorEnvelope 泄漏(AST 扫描生产代码)
  #   7. 生产代码 translate/format_message/format_message_icu 必须显式绑定 locale
  # baseline ratchet 模式:结构性(dims 1-3)+ AST(dims 6-7)硬违规必须 0,
  #                       文案违规(dims 4-5)允许 baseline 渐进式清零。
  i18n-strict-export-boundary-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # check_i18n_strict_export_boundary.py 需 import services.error_codes(依赖 loguru)
        pip install -r requirements.txt
        pip install pyyaml

    - name: i18n strict export boundary gate (R65 P1-03, 7-dim strict)
      run: python scripts/check_i18n_strict_export_boundary.py --strict

  # ─── 5d. migration-manifest-gate (R65 P1-08) ────────────────
  # migration manifest 001-007 完整性 + 签名绑定严格校验。
  # R65 P1-08: 005/006/007 新增迁移必须纳入签名 release manifest,本 gate
  # 在 release pipeline 中作为独立 required job 严格校验:
  #   1. 001-007 全集合存在(migration_id 不漏项)
  #   2. predecessor 链完整(001 ← 002 ← ... ← 007)
  #   3. 每个 SQL 文件 SHA-256 与 manifest 一致(fail-closed on tampering)
  #   4. ddl_version 单调非递减(允许同值,不允许下降)
  #   5. rollback_strategy 非空(每个 migration 必须有回滚策略)
  #   6. manifest 已签名(或属于 release-manifest.json 一部分)
  #      — 本地无签名文件时 WARN 不阻断;CI 中 sign-image job 已签名,
  #        通过 cosign verify-blob 验证,本 gate 报告签名状态。
  # 失败必须阻断 release-summary 和 publish-attestation(required, no skip)。
  migration-manifest-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Migration manifest strict gate (R65 P1-08)
      run: python scripts/check_migration_manifest.py --strict

  # ─── 5e. button-flow-real-ux-gate (R65 P1-11) ──────────────
  # 按钮式流程真实 UX 落地门禁 — 与 ci.yml static-gates Scanner 12 一致,
  # 在 release pipeline 中作为独立 required job 重新执行,确保 release artifact
  # 不引入新的按钮 UX 违规。
  # 审计 P1-11: 按钮式流程要从 policy 表落到真实 UX。ButtonUXSpec 需要在真实
  # Telegram/Web handler 上验证:目标、影响、不可逆性、审批状态、MFA 状态、
  # resource version、确认、取消、过期恢复、重试和返回按钮均真实渲染;
  # 不能只检查 sidecar metadata。
  # 5 条规则(strict 默认,任何违规 exit 1):
  #   Rule E: 真实 handler 存在(HIGH_RISK_POLICY action 在 inventory 中有高风险 handler;
  #           policy-only action 如 purge_data/assign_role/rotate_keys 跳过)
  #   Rule F: handler 渲染实际按钮(Telegram: InlineKeyboardButton + callback_data,
  #           含 sibling .py 扫描;Web: RedirectResponse / HTMLResponse)
  #   Rule G: 5 生命周期路径(confirm/cancel/expire/retry/return)全部通过
  #           services.button_flow_lifecycle.verify_all_lifecycle_paths
  #   Rule H: 双语翻译(zh-CN + en-US)在 locales/{locale}.json 中存在
  #   Rule I: UserMessage.from_* + locale 绑定(Telegram);仅 locale 绑定(Web)
  # 失败必须阻断 release-summary 和 publish-attestation(required, no skip)。
  button-flow-real-ux-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # check_button_flow_real_ux.py 需 import services.button_flow_lifecycle(依赖 loguru / aiosqlite)
        pip install -r requirements.txt
        pip install pyyaml

    - name: Button flow real UX gate (R65 P1-11, strict 5-rule enforcement)
      run: python scripts/check_button_flow_real_ux.py --strict

  # ─── 6. backup-restore-drill ────────────────────────────────
  # 跑 backup 恢复演练测试(由其他 agent 创建)
  backup-restore-drill:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiosqlite pyyaml

    - name: Run backup restore drill tests
      run: |
        # R42 P1-2/3/7/9: backup 恢复演练
        # R43: 修正 -k 过滤器,匹配测试文件中实际存在的测试名
        # (test_restore_*/test_cleanup_orphans*/test_backup_gc*/test_rpo* 等)
        if [ -f tests/test_r42_p1_2_3_7_9_backup_rpo.py ]; then
          python -m pytest tests/test_r42_p1_2_3_7_9_backup_rpo.py -k "restore or backup_gc or rpo or cleanup_orphans or backup_policy" -v --tb=short
        else
          echo "WARN: tests/test_r42_p1_2_3_7_9_backup_rpo.py 不存在(由其他 agent 创建)"
          echo "     若该 agent 已完成整改,请检查测试文件路径"
          exit 1
        fi

  # ─── 7. sbom ────────────────────────────────────────────────
  # 生成 SBOM(JSON 格式,含 license / sha256)
  sbom:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Generate SBOM
      run: |
        # R41 P1-11: 使用项目内脚本生成 SBOM
        python scripts/generate_sbom.py --no-pip-freeze --output sbom.json --format json

    - name: Verify SBOM
      run: |
        python -c "
        import json
        with open('sbom.json') as f:
            data = json.load(f)
        assert 'packages' in data, 'SBOM 缺少 packages 字段'
        assert 'schema_version' in data, 'SBOM 缺少 schema_version'
        assert 'generated_at' in data, 'SBOM 缺少 generated_at'
        print(f'SBOM 组件数: {len(data[\"packages\"])}')
        for p in data['packages'][:3]:
            assert 'name' in p and 'version' in p and 'license' in p, f'包缺少必需字段: {p}'
        print('SBOM 校验通过')
        "

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-gates-sbom
        path: sbom.json
        retention-days: 30

  # ─── 8. pip-audit (R43 P0-2: 阻断式漏洞扫描,移除 continue-on-error) ──
  # R43 P0-2: 安全任务不允许降级为 warning,必须阻断发布
  pip-audit:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Run pip-audit
      run: |
        # R43 P0-2: 失败必须阻断 release-gates,不再降级为 warning
        # 安全例外必须有期限、负责人、风险接受记录,不能静默通过
        pip-audit -r requirements.txt --strict --desc

  # ─── 9. trivy (R43 P0-2: 阻断式漏洞扫描,移除 continue-on-error) ──
  trivy:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        # R43 P0-2: exit-code=1 让 CRITICAL/HIGH 漏洞阻断发布
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
        format: table

  # ─── 10. sign-image (R58 P0-1: build-once 引用 digest 签名 + verify statement) ─
  # R58 P0-1 整改要点:
  #   旧版 sign-image 又重新构建并 push 到 GHCR (build twice),
  #   且只签名不输出 verification statement。
  #   新版:
  #     - 不重新构建 (build once, 通过 needs.docker-build.outputs.image_digest 引用)
  #     - cosign sign 已 push 的镜像 digest
  #     - cosign verify 输出签名 verification statement (JSON)
  #     - SLSA provenance attestation 绑定同一 digest
  sign-image:
    runs-on: ubuntu-latest
    needs: [docker-build]
    # R70 P0-10: sign-image 仅在 RC tag (rc-v*) 触发,禁止 master push 直接进入签名路径。
    #   旧实现: master/main push 与 v* tag 都触发 sign-image → 违反"master/staging/RC/
    #            production namespace 完全分离"原则(master push 直接产生正式签名证据)。
    #   新实现: 仅 rc-v* tag 触发,environment=rc-candidate。master push 只产 staging
    #           (镜像构建 + 测试 + lint),不签名;RC tag 才产生 production candidate
    #           evidence(sign-image + publish-attestation + attestation-semantics-verify)。
    #   production 部署由 production-v* tag 触发 production-promotion-gate(独立 job),
    #   不再触发 sign-image(签名已在 RC 阶段完成,production 阶段只做晋级门禁验证)。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v')
    environment: rc-candidate
    # R46 P0-5: 删除 continue-on-error,签名失败必须阻断发布
    # R61 P0-04: cosign sign 默认把签名推回 GHCR (sha256-<digest>.sig 标签),
    # 需要 packages: write;actions/attest-build-provenance push-to-registry: true 同理。
    # 原 packages: read 导致 403 Forbidden,签名推送失败。
    permissions:
      contents: read
      id-token: write
      packages: write  # R61 P0-04: cosign sign 推送签名 + attest-build-provenance push-to-registry
      # R53: actions/attest-build-provenance 创建 attestation 需要此权限
      attestations: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Install cosign
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      with:
        cosign-release: 'v2.2.3'

    # R58 P0-1: 只需读取 (build 已在 docker-build job 完成, 不重新构建)
    # R61 P0-04: cosign sign 推送签名也需要 GHCR write, login 用 GITHUB_TOKEN
    - name: Login to GHCR (for cosign sign/verify + attestation push)
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve image reference
      id: resolve
      run: |
        # R58 P0-1: 通过 docker-build 输出的 digest 引用 (强引用, 不可变)
        IMAGE_NAME="${{ needs.docker-build.outputs.image_name }}"
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "null" ]; then
          echo "FAIL: docker-build 未输出 image_digest"
          echo "  (可能 docker-build job 失败或被跳过)"
          exit 1
        fi
        IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
        echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
        echo "R58 P0-1: 通过 digest 引用镜像 (build once, 不重新构建)"
        echo "  image_ref: ${IMAGE_REF}"

    # R66 P0-02: 镜像内 catalog digest 校验(image catalog digest verification)。
    #   docker-build job 在 build 前已重生 catalog 并输出 catalog_digest
    #   (manifest 在 docker build 前已冻结, build 后禁止修改)。
    #   本步骤从已 push 的 OCI image 中读取 /app/database/migrations/
    #   migration-manifest.json, 计算其 sha256, 与 docker-build 输出的
    #   catalog_digest + runner 工作区 source catalog sha256 双重比对 —
    #   确保签名对象(catalog)与镜像内实际内容一致。
    #   若不一致: 说明 build 后 catalog 被修改(audit finding 复发),拒绝签名。
    #   注意: 本步骤不重生 catalog(禁止 build 后修改任何声称位于镜像内的发布输入)。
    - name: Verify image catalog digest matches source
      run: |
        set -euo pipefail
        IMAGE_REF="${{ steps.resolve.outputs.image_ref }}"
        EXPECTED_CATALOG_DIGEST="${{ needs.docker-build.outputs.catalog_digest }}"
        SOURCE_MANIFEST="database/migrations/migration-manifest.json"
        if [ -z "${EXPECTED_CATALOG_DIGEST}" ] || [ "${EXPECTED_CATALOG_DIGEST}" = "null" ]; then
          echo "::error::docker-build 未输出 catalog_digest — 无法校验镜像内 catalog"
          echo "  R66 P0-02: catalog digest baseline 缺失"
          exit 1
        fi
        if [ ! -f "${SOURCE_MANIFEST}" ]; then
          echo "::error::source catalog 不存在: ${SOURCE_MANIFEST}"
          echo "  R66 P0-02: runner 工作区缺少 source catalog"
          exit 1
        fi
        echo "R66 P0-02: Verifying image catalog digest matches source"
        echo "  image_ref:                ${IMAGE_REF}"
        echo "  expected (docker-build):  ${EXPECTED_CATALOG_DIGEST}"
        # 1. 从镜像内提取 catalog 文件(docker run --rm 不写入容器层)
        #    Dockerfile WORKDIR /app + COPY . . → /app/database/migrations/migration-manifest.json
        docker run --rm --entrypoint cat "${IMAGE_REF}" \
          "${SOURCE_MANIFEST#/}" > /tmp/image-catalog.json
        if [ ! -s /tmp/image-catalog.json ]; then
          echo "::error::镜像内 ${SOURCE_MANIFEST#/} 不存在或为空"
          echo "  R66 P0-02: 镜像内 catalog 缺失 — 无法校验"
          exit 1
        fi
        ACTUAL_CATALOG_DIGEST=$(sha256sum /tmp/image-catalog.json | awk '{print $1}')
        SOURCE_CATALOG_DIGEST=$(sha256sum "${SOURCE_MANIFEST}" | awk '{print $1}')
        echo "  actual (in image):        ${ACTUAL_CATALOG_DIGEST}"
        echo "  source (runner 工作区):    ${SOURCE_CATALOG_DIGEST}"
        # 2. 镜像内 catalog digest 必须严格等于 docker-build 输出的 catalog_digest
        if [ "${ACTUAL_CATALOG_DIGEST}" != "${EXPECTED_CATALOG_DIGEST}" ]; then
          echo "FAIL: 镜像内 catalog digest != docker-build 输出的 catalog_digest"
          echo "  image catalog:    ${ACTUAL_CATALOG_DIGEST}"
          echo "  expected (build): ${EXPECTED_CATALOG_DIGEST}"
          echo "  R66 P0-02: 签名对象(catalog)与镜像内实际内容不一致 — 拒绝签名"
          echo "  可能原因: build 后 catalog 被修改,或 docker COPY 顺序异常"
          exit 1
        fi
        echo "  PASS: 镜像内 catalog digest 与 docker-build 输出一致"
        # 3. 镜像内 catalog digest 必须严格等于 runner 工作区 source catalog digest
        #    (defense in depth — source catalog 应与 docker-build 重生结果一致,
        #     因 migration-manifest-gate 已校验 source catalog sha256 正确)
        if [ "${ACTUAL_CATALOG_DIGEST}" != "${SOURCE_CATALOG_DIGEST}" ]; then
          echo "FAIL: 镜像内 catalog digest != runner 工作区 source catalog digest"
          echo "  image catalog:    ${ACTUAL_CATALOG_DIGEST}"
          echo "  source catalog:   ${SOURCE_CATALOG_DIGEST}"
          echo "  R66 P0-02: 镜像内 catalog 与 source 不一致 — 拒绝签名"
          exit 1
        fi
        echo "  PASS: 镜像内 catalog digest 与 source catalog 一致"

    # R58 P0-1: cosign sign 已 push 的镜像 digest (不重新构建)
    # R60 P0-06: 增加 OIDC/GHCR/cosign 诊断信息(不添加 continue-on-error,
    #             签名失败必须阻断,诊断信息用于定位根因)
    # R63 P0-01: 使用 --output-certificate 保存 Fulcio cert 到本地,
    #            后续 verify 步骤从 cert 提取实际 SAN (source of truth) 做精确匹配,
    #            而非依赖 github.ref 拼接字符串(可能与 Fulcio SAN 不一致导致 verify 失败)。
    - name: Sign OCI image with cosign (keyless, by digest)
      run: |
        IMAGE_REF="${{ steps.resolve.outputs.image_ref }}"
        echo "Signing image: ${IMAGE_REF}"
        echo "R60 P0-06: diagnostic info for cosign keyless signing failures"
        echo "  cosign version: $(cosign version 2>&1 || echo 'unknown')"
        echo "  GH_OIDC.isPresent: $( [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo true || echo false )"
        echo "  github.ref: ${{ github.ref }}"
        echo "  github.event_name: ${{ github.event_name }}"
        echo "  repository: ${{ github.repository }}"
        # OIDC token debug (presence only, do NOT print token content)
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "  OIDC token endpoint: present"
        else
          echo "::error::OIDC token endpoint not available — id-token: write permission required for keyless signing"
          exit 1
        fi
        # R63 P0-01: --output-certificate 保存 Fulcio cert 到本地文件,
        # 后续步骤从 cert 提取实际 SAN 作为 verify 的 certificate-identity
        # (signed-with == verified-with,消除拼接字符串不匹配的根因)
        cosign sign --yes \
          --output-certificate image-signing-cert.pem \
          "${IMAGE_REF}"
        # 校验 cert 已写入(非空文件)
        if [ ! -s image-signing-cert.pem ]; then
          echo "::error::cosign sign 未输出 Fulcio 证书到 image-signing-cert.pem"
          echo "  R63 P0-01: 无法提取 certificate-identity,拒绝继续"
          exit 1
        fi
        echo "Image signed and Fulcio certificate saved to image-signing-cert.pem"
        echo "  cert sha256: $(sha256sum image-signing-cert.pem | awk '{print $1}')"
      env:
        COSIGN_EXPERIMENTAL: 1

    # R63 P0-01: 从实际 Fulcio cert 提取 certificate-identity (SAN URI)
    #   根治 P0-01: 旧实现用 github.ref 拼接 identity 字符串做精确匹配,
    #   但实际 Fulcio cert SAN 可能与拼接结果存在细微差异(ref 形式/大小写/编码),
    #   导致 cosign verify 失败 → 后续所有步骤被 skipped (供应链断裂)。
    #   新实现直接从 cert 读取 SAN,确保 sign 和 verify 使用同一 identity。
    - name: Extract certificate identity from Fulcio cert (image signing)
      id: extract_image_identity
      run: |
        set -euo pipefail
        CERT_FILE="image-signing-cert.pem"
        echo "R63 P0-01: Extracting certificate-identity (SAN URI) from Fulcio cert"
        # R65 fix: cosign --output-certificate 可能输出 PEM 或 DER 格式,
        #          openssl x509 默认期望 PEM。尝试 PEM,然后 DER,确保两种格式都能提取 SAN。
        # Fulcio cert 的 subjectAltName 扩展包含 URI:https://github.com/<owner>/<repo>/.github/workflows/<wf>@<ref>
        SAN_LINE=""
        for inform in PEM DER; do
          SAN_LINE=$(openssl x509 -in "${CERT_FILE}" -inform "${inform}" -noout -ext subjectAltName 2>/dev/null || true)
          if [ -n "${SAN_LINE}" ]; then
            echo "  cert format: ${inform} (subjectAltName extracted)"
            break
          fi
        done
        echo "  cert subjectAltName: ${SAN_LINE}"
        # R65 fix: 添加 || true 防止 set -e + pipefail 在 grep 无匹配时
        #          提前退出(导致 cert dump 诊断输出不打印)。
        # 提取 URI:xxx 字段(可能有多个 SAN,取第一个 URI)
        CERT_IDENTITY=$(echo "${SAN_LINE}" | grep -oE 'URI:[^,[:space:]]+' | head -n1 | sed 's/^URI://' || true)
        if [ -z "${CERT_IDENTITY}" ]; then
          echo "::error::无法从 Fulcio cert 提取 SAN URI (certificate-identity)"
          echo "  R63 P0-01: 拒绝 fallback 到拼接字符串 — 必须使用实际 cert 中的 identity"
          echo "  cert file: ${CERT_FILE}"
          echo "  subjectAltName raw: ${SAN_LINE}"
          echo "  cert dump (first 80 lines):"
          openssl x509 -in "${CERT_FILE}" -noout -text 2>&1 | head -80 || openssl x509 -in "${CERT_FILE}" -inform DER -noout -text 2>&1 | head -80 || true
          exit 1
        fi
        echo "  extracted certificate-identity: ${CERT_IDENTITY}"
        # 校验 identity 形态:必须是本仓库 release-gates.yml 工作流
        # (防止 cert 被替换为其他工作流的签名)
        if ! echo "${CERT_IDENTITY}" | grep -qE '^https://github\.com/[^/]+/[^/]+/\.github/workflows/release-gates\.yml@'; then
          echo "::error::certificate-identity 形态不符合预期(应为 https://github.com/<owner>/<repo>/.github/workflows/release-gates.yml@<ref>)"
          echo "  extracted: ${CERT_IDENTITY}"
          echo "  R63 P0-01: 拒绝使用其他工作流的签名 — 跨工作流伪造防护"
          exit 1
        fi
        echo "  PASS: certificate-identity 形态校验通过"
        echo "certificate_identity=${CERT_IDENTITY}" >> "$GITHUB_OUTPUT"

    # R58 P0-1: cosign verify 生成签名 verification statement (JSON)
    #           每次 release 都必须输出 verification statement 作为证据
    # R62 P0-03: 修复证书 identity 钉扎(精确匹配,非正则)
    # R63 P0-01: 进一步根治 — 从实际 Fulcio cert 提取 SAN 作为 verify 的 identity,
    #            消除拼接字符串不匹配根因。verification statement 作为后续强依赖输入。
    # R64 P0-01 (失败点 3 整改): 不再从待验证证书提取 identity 作为验证条件
    #            (signed-with == verified-with 是漏洞 — 证书自身提供的 identity 不可信)。
    #            改用独立预期 EXPECTED_IDENTITY (钉扎 github.repository + 工作流路径 + 当前 ref),
    #            作为 --certificate-identity 主验证条件。
    #            保留 SAN 形态校验(R63 extract 步骤)作为 defense in depth,
    #            EXTRACTED_IDENTITY 仅用于诊断对比,不作为验证条件。
    - name: Verify image signature (output verification statement)
      run: |
        IMAGE_REF="${{ steps.resolve.outputs.image_ref }}"
        # R64 P0-01: 主验证用预期 identity (钉扎 ref,不信任待验证证书自身提供的 identity)
        # R66 P0-03: 使用 ${{ github.ref }} (refs/heads/master 或 refs/tags/v1.0.0)
        #            而非 refs/heads/${{ github.ref_name }}(tag push 时 ref_name 为 tag 名,
        #            拼成 refs/heads/<tag> 错误,正确应为 refs/tags/<tag>)
        EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/release-gates.yml@${{ github.ref }}"
        # R63 P0-01: 从 Fulcio cert 提取的 SAN (仅用于诊断对比 + defense in depth 形态校验,
        #             不再作为 --certificate-identity 验证条件)
        EXTRACTED_IDENTITY="${{ steps.extract_image_identity.outputs.certificate_identity }}"
        echo "=== R58 P0-1: 签名 Verification Statement ==="
        echo "R64 P0-01: EXPECTED_IDENTITY (pinned to ref, used for verify): ${EXPECTED_IDENTITY}"
        echo "R63 P0-01: EXTRACTED_IDENTITY (from Fulcio cert, defense in depth): ${EXTRACTED_IDENTITY}"
        # R65 P0-01: cosign v2.2.3 无 --output-verification flag (旧 R64 实现错误)。
        #            cosign verify 默认输出 JSON 数组到 stdout, 用 stdout 重定向写入 statement.json。
        # R62 P0-03 / R63 P0-01 / R64 P0-01 / R65 P0-01: fail-fast — cosign verify 失败立即 exit 1,
        #                       不允许 continue-on-error;后续步骤依赖此 statement
        cosign verify \
          --certificate-identity "${EXPECTED_IDENTITY}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "${IMAGE_REF}" > statement.json || {
            echo "FAIL: cosign verify 失败,签名无效"
            echo "  EXPECTED_IDENTITY (pinned, used for verify): ${EXPECTED_IDENTITY}"
            echo "  EXTRACTED_IDENTITY (from cert, defense in depth): ${EXTRACTED_IDENTITY}"
            echo "  expected issuer: https://token.actions.githubusercontent.com"
            rm -f statement.json
            exit 1
          }
        echo "Verification statement 已生成:"
        cat statement.json
        echo ""
        echo "=== Verification Summary ==="
        python3 -c "
        import json
        with open('statement.json') as f:
            stmt = json.load(f)
        # cosign verify 输出 JSON 数组(列表), 每个元素是一个 verification result。
        # 旧实现误以为 stmt 是 dict 直接调用 .get(), 触发
        # AttributeError: 'list' object has no attribute 'get' (R65 fix)。
        # 兼容处理: 若为 list 取首个元素作为 statement dict。
        if isinstance(stmt, list):
            if not stmt:
                raise SystemExit('FAIL: cosign verify 输出空数组 — 无 verification statement')
            stmt = stmt[0]
        if not isinstance(stmt, dict):
            raise SystemExit(f'FAIL: verification statement 既非 dict 也非 list: {type(stmt).__name__}')
        # Bundle 结构: {_type, subject, predicateType, predicate}
        print(f'_type: {stmt.get(\"_type\", \"\")}')
        print(f'predicateType: {stmt.get(\"predicateType\", \"\")}')
        subjects = stmt.get('subject', [])
        print(f'subject count: {len(subjects)}')
        for s in subjects:
            print(f'  - name: {s.get(\"name\", \"\")}')
            dig = s.get('digest', {})
            for alg, val in dig.items():
                print(f'    {alg}: {val[:24]}...')
        print('OK: 签名 verification statement 有效')
        "

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
      with:
        subject-name: ${{ needs.docker-build.outputs.image_name }}
        # R53: steps.build.outputs.digest 已含 "sha256:" 前缀,
        # 不能再前缀 "sha256:",否则变成 "sha256:sha256:..." 导致
        # actions/attest-build-provenance 报错 "subject-digest must be in
        # the format 'sha256:<hex-digest>'"
        # R58 P0-1: 使用 docker-build 输出的 digest (build once)
        subject-digest: ${{ needs.docker-build.outputs.image_digest }}
        push-to-registry: true

    # R44: 保留源 tarball 签名作为补充(与镜像签名独立)
    - name: Sign source artifact with cosign (keyless)
      run: |
        # R43 P0-2: 真实 cosign 签名(不再占位通过)
        # 签名源代码 tarball 作为补充签名制品
        git archive --format=tar.gz --prefix=tgjiema-${{ github.sha }}/ HEAD -o tgjiema-${{ github.sha }}.tar.gz
        sha256sum tgjiema-${{ github.sha }}.tar.gz > tgjiema-${{ github.sha }}.tar.gz.sha256
        # Sigstore keyless 签名(使用 GitHub OIDC 身份)
        cosign sign-blob --yes \
          --output-certificate tgjiema-${{ github.sha }}.pem \
          --output-signature tgjiema-${{ github.sha }}.sig \
          tgjiema-${{ github.sha }}.tar.gz.sha256
        echo "源代码制品已用 Sigstore keyless 签名"

    # R62 P1-02: 签名 migration manifest (cosign detached signature)
    #   manifest 是 migration 完整性的 trust anchor — 必须独立签名,
    #   防止代码和 manifest 被同步篡改。签名材料与镜像 attestation 绑定同一 release digest。
    #   验证时钉扎 certificate_identity 到本仓库的 release-gates.yml 工作流 + OIDC issuer。
    # R63 P0-04: manifest 必须枚举全部 migration(磁盘集合 == manifest 集合)。
    # R66 P0-01: catalog 不再绑定 release_commit/tree_sha(catalog-only 模型,
    #            自引用循环根因 — 任何 commit 都使 catalog 自身的 tree_sha 失效)。
    #            HEAD/Tree 绑定移到 release-artifacts/release-manifest.json(CI 产物,
    #            不提交 git),由其 source_commit/source_tree 字段承担。
    # R66 P0-02: manifest 在 docker build 前已冻结, build 后禁止修改。
    #            原 "Regenerate migration manifest" 步骤已移到 docker-build job
    #            (在 build 之前执行), 确保镜像内 /app/database/migrations/
    #            migration-manifest.json 与签名对象一致。本 job 仅校验镜像内
    #            catalog digest 与 docker-build job 输出的 catalog_digest 严格
    #            一致(见后续 "Verify image catalog digest" 步骤), 不再重生
    #            catalog — 否则签名对象不在已构建镜像内(audit finding)。

    # R64 P0-02: 生成独立 release artifact manifest(避免自引用循环)。
    #   旧实现把 migration-manifest.json 直接绑定到包含自身的 tree — 自引用循环,
    #   任何 commit 都使旧 manifest 失效,而重生动作又改变 tree(无稳态)。
    #   新实现:release-manifest.json 是 CI 产物,不提交到 git,输出到
    #   release-artifacts/ 目录;绑定 source_commit + source_tree + image_digest +
    #   migration digest 集合 + migration-manifest.json 的 digest。
    #   docker-build 已完成(build once),通过 needs.docker-build.outputs.image_digest 引用。
    - name: Generate release artifact manifest
      id: gen_release_manifest
      run: |
        set -euo pipefail
        IMAGE_NAME="${{ needs.docker-build.outputs.image_name }}"
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "null" ]; then
          echo "::error::docker-build 未输出 image_digest — 无法生成 release manifest"
          echo "  R64 P0-02: release manifest 必须绑定 image_digest"
          exit 1
        fi
        echo "R64 P0-02: Generating release artifact manifest"
        echo "  image_name:   ${IMAGE_NAME}"
        echo "  image_digest: ${IMAGE_DIGEST}"
        python3 scripts/generate_release_manifest.py \
          --image-digest "${IMAGE_DIGEST}" \
          --image-name "${IMAGE_NAME}" \
          --output release-artifacts/release-manifest.json
        # 校验 release manifest 已生成且字段完整
        python3 -c "
        import json, subprocess, hashlib, sys
        from pathlib import Path
        rm = json.load(open('release-artifacts/release-manifest.json'))
        assert rm['version'] == 3, f'version != 3: {rm[\"version\"]}'
        assert rm['type'] == 'release_artifact', f'type != release_artifact: {rm[\"type\"]}'
        assert rm['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'source_commit != HEAD'
        assert rm['source_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'source_tree != HEAD Tree'
        assert rm['image_digest'].startswith('sha256:'), f'image_digest 非 sha256 前缀: {rm[\"image_digest\"]}'
        mm_digest = hashlib.sha256(Path('database/migrations/migration-manifest.json').read_bytes()).hexdigest()
        assert rm['migration_manifest_digest'] == mm_digest, 'migration_manifest_digest 不匹配当前 migration-manifest.json'
        print(f'PASS: release manifest canonical (source_commit={rm[\"source_commit\"][:12]}..., migrations={len(rm[\"migrations\"])})')
        "
        echo "  release manifest sha256: $(sha256sum release-artifacts/release-manifest.json | awk '{print $1}')"

    - name: Sign migration manifest with cosign (keyless, detached)
      run: |
        set -euo pipefail
        MANIFEST="database/migrations/migration-manifest.json"
        if [ ! -f "${MANIFEST}" ]; then
          echo "FAIL: migration manifest not found: ${MANIFEST}"
          exit 1
        fi
        echo "R62 P1-02: Signing migration manifest (cosign keyless, detached)"
        echo "  manifest: ${MANIFEST}"
        echo "  manifest sha256: $(sha256sum "${MANIFEST}" | awk '{print $1}')"
        # R65 fix: cosign sign-blob --output-certificate 写入的文件格式 openssl 可能无法解析
        #          (cosign sign-blob 与 cosign sign 的 --output-certificate 输出格式不同)。
        #          cosign 始终将有效 PEM cert 打印到 stdout,因此捕获 stdout 并提取 PEM 块,
        #          保存为独立的 .cert.pem 文件供 openssl 解析 SAN。
        #          原始 migration-manifest.json.pem 仍保留供 cosign verify-blob 使用。
        cosign sign-blob --yes \
          --output-certificate migration-manifest.json.pem \
          --output-signature migration-manifest.json.sig \
          "${MANIFEST}" 2>&1 | tee cosign-sign-manifest.log
        # R63 P0-04: 校验签名产物已生成(后续 verify 步骤依赖此文件)
        if [ ! -s migration-manifest.json.pem ] || [ ! -s migration-manifest.json.sig ]; then
          echo "::error::cosign sign-blob 未输出 certificate/signature"
          echo "  R63 P0-04: 拒绝继续 — manifest 签名产物缺失"
          exit 1
        fi
        # R65 fix: 从 stdout 日志提取 PEM cert (cosign 打印的有效 PEM 块)
        awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{if(flag){exit}}' \
          cosign-sign-manifest.log > migration-manifest-cert.pem
        if [ ! -s migration-manifest-cert.pem ]; then
          echo "::error::无法从 cosign sign-blob stdout 提取 PEM cert"
          echo "  R65 fix: stdout 日志中未找到 PEM cert 块"
          exit 1
        fi
        echo "Migration manifest signed successfully"
        echo "  cert sha256: $(sha256sum migration-manifest.json.pem | awk '{print $1}')"
        echo "  extracted PEM cert sha256: $(sha256sum migration-manifest-cert.pem | awk '{print $1}')"
        echo "  sig  sha256: $(sha256sum migration-manifest.json.sig | awk '{print $1}')"
      env:
        COSIGN_EXPERIMENTAL: 1

    # R63 P0-01: 从 migration manifest 的 Fulcio cert 提取 certificate-identity (SAN URI)
    #   与 image signing 一致 — 从实际 cert 读取 SAN,而非 github.ref 拼接,
    #   消除 verify 失败导致后续步骤被 skipped 的根因。
    # R65 fix: 使用从 cosign stdout 提取的 PEM cert 文件 (migration-manifest-cert.pem),
    #          而非 --output-certificate 直接写入的文件 (openssl 可能无法解析后者格式)。
    - name: Extract certificate identity from Fulcio cert (manifest signing)
      id: extract_manifest_identity
      run: |
        set -euo pipefail
        CERT_FILE="migration-manifest-cert.pem"
        if [ ! -s "${CERT_FILE}" ]; then
          echo "::error::migration manifest cert file missing or empty: ${CERT_FILE}"
          echo "  R63 P0-01: 无法提取 certificate-identity,拒绝继续"
          exit 1
        fi
        echo "R63 P0-01: Extracting certificate-identity (SAN URI) from manifest Fulcio cert"
        # R65 fix: 使用从 cosign stdout 提取的 PEM cert,openssl 可直接解析。
        #          保留 PEM/DER fallback 以增强健壮性。
        SAN_LINE=""
        for inform in PEM DER; do
          SAN_LINE=$(openssl x509 -in "${CERT_FILE}" -inform "${inform}" -noout -ext subjectAltName 2>/dev/null || true)
          if [ -n "${SAN_LINE}" ]; then
            echo "  cert format: ${inform} (subjectAltName extracted)"
            break
          fi
        done
        echo "  cert subjectAltName: ${SAN_LINE}"
        # R65 fix: 添加 || true 防止 set -e + pipefail 在 grep 无匹配时提前退出,
        #          确保后续 cert dump 诊断输出能打印出来辅助排查。
        CERT_IDENTITY=$(echo "${SAN_LINE}" | grep -oE 'URI:[^,[:space:]]+' | head -n1 | sed 's/^URI://' || true)
        if [ -z "${CERT_IDENTITY}" ]; then
          echo "::error::无法从 manifest Fulcio cert 提取 SAN URI"
          echo "  cert file: ${CERT_FILE}"
          echo "  subjectAltName raw: ${SAN_LINE}"
          echo "  cert dump (first 80 lines):"
          openssl x509 -in "${CERT_FILE}" -noout -text 2>&1 | head -80 || openssl x509 -in "${CERT_FILE}" -inform DER -noout -text 2>&1 | head -80 || true
          exit 1
        fi
        echo "  extracted certificate-identity: ${CERT_IDENTITY}"
        # 形态校验:必须是本仓库 release-gates.yml 工作流
        if ! echo "${CERT_IDENTITY}" | grep -qE '^https://github\.com/[^/]+/[^/]+/\.github/workflows/release-gates\.yml@'; then
          echo "::error::manifest certificate-identity 形态不符合预期"
          echo "  extracted: ${CERT_IDENTITY}"
          echo "  R63 P0-01: 拒绝使用其他工作流的签名 — 跨工作流伪造防护"
          exit 1
        fi
        echo "  PASS: certificate-identity 形态校验通过"
        echo "certificate_identity=${CERT_IDENTITY}" >> "$GITHUB_OUTPUT"

    # R62 P1-02: 验证 migration manifest 签名 (fail-fast)
    # R63 P0-01: 使用从 Fulcio cert 提取的实际 SAN (而非 github.ref 拼接)
    #            钉扎 certificate_identity 到本仓库 release-gates.yml 工作流 + OIDC issuer,
    #            防止跨仓库/跨工作流伪造签名。验证失败立即 exit 1。
    # R64 P0-01 (失败点 3 整改): 不再从待验证证书提取 identity 作为验证条件
    #            (signed-with == verified-with 是漏洞)。改用 EXPECTED_IDENTITY 钉扎 ref,
    #            EXTRACTED_IDENTITY 仅用于诊断对比 + defense in depth 形态校验。
    - name: Verify migration manifest signature
      run: |
        set -euo pipefail
        MANIFEST="database/migrations/migration-manifest.json"
        # R64 P0-01: 主验证用预期 identity (钉扎 ref)
        # R66 P0-03: 使用 ${{ github.ref }} 而非 refs/heads/${{ github.ref_name }}
        #            (tag push 时 ref_name 为 tag 名,拼成 refs/heads/<tag> 错误)
        EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/release-gates.yml@${{ github.ref }}"
        # R63 P0-01: 从 Fulcio cert 提取的 SAN (仅用于诊断对比 + defense in depth)
        EXTRACTED_IDENTITY="${{ steps.extract_manifest_identity.outputs.certificate_identity }}"
        echo "R62 P1-02 / R63 P0-01 / R64 P0-01: Verifying migration manifest signature"
        echo "  EXPECTED_IDENTITY (pinned, used for verify): ${EXPECTED_IDENTITY}"
        echo "  EXTRACTED_IDENTITY (from cert, defense in depth): ${EXTRACTED_IDENTITY}"
        echo "  expected issuer: https://token.actions.githubusercontent.com"
        cosign verify-blob \
          --certificate-identity "${EXPECTED_IDENTITY}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --certificate migration-manifest.json.pem \
          --signature migration-manifest.json.sig \
          "${MANIFEST}" || {
            echo "FAIL: migration manifest signature verification failed"
            echo "  EXPECTED_IDENTITY (pinned): ${EXPECTED_IDENTITY}"
            echo "  EXTRACTED_IDENTITY (from cert): ${EXTRACTED_IDENTITY}"
            echo "  R62 P1-02 / R63 P0-04: manifest 签名无效 — 拒绝发布(代码与 manifest 可能被篡改)"
            exit 1
          }
        echo "PASS: migration manifest signature verified"

    # R66 P0-01: 验证 release-manifest.json 的 source_commit / source_tree 与当前 HEAD 严格一致
    #   R66 P0-01 整改:catalog(migration-manifest.json)不再绑定 release_commit/tree_sha
    #   (catalog-only 模型,自引用循环根因)。HEAD/Tree 绑定由 release-manifest.json
    #   的 source_commit/source_tree 字段承担(独立 CI 产物,不提交 git)。
    #   release-manifest.json 落后于 HEAD → 说明 release-manifest 未随本次 release 重新生成,拒绝发布。
    - name: Verify release manifest source_commit binding
      run: |
        set -euo pipefail
        MANIFEST="database/migrations/migration-manifest.json"
        RELEASE_MANIFEST="release-artifacts/release-manifest.json"
        if [ ! -f "${RELEASE_MANIFEST}" ]; then
          echo "::error::release manifest not found: ${RELEASE_MANIFEST}"
          echo "  R66 P0-01: 必须先生成 release-manifest.json"
          exit 1
        fi
        # R66 P0-01: catalog 禁止包含 release_commit / tree_sha 字段(catalog-only 模型)
        python3 -c "
        import json, sys
        catalog = json.load(open('${MANIFEST}'))
        for forbidden in ('release_commit', 'tree_sha'):
            assert forbidden not in catalog, (
                f'R66 P0-01: catalog 禁止包含 {forbidden} 字段 '
                f'(catalog-only 模型 — HEAD 绑定移至 release-manifest.json)'
            )
        print('PASS: catalog-only model verified (no release_commit/tree_sha in catalog)')
        "
        # R66 P0-01: 从 release-manifest.json 提取 source_commit / source_tree
        RELEASE_SOURCE_COMMIT=$(python3 -c "import json; print(json.load(open('${RELEASE_MANIFEST}'))['source_commit'])")
        RELEASE_SOURCE_TREE=$(python3 -c "import json; print(json.load(open('${RELEASE_MANIFEST}'))['source_tree'])")
        HEAD_SHA="${{ github.sha }}"
        HEAD_TREE=$(git rev-parse "${HEAD_SHA}^{tree}")
        echo "R66 P0-01: Verifying release-manifest source_commit + source_tree binding"
        echo "  release source_commit: ${RELEASE_SOURCE_COMMIT}"
        echo "  release source_tree:   ${RELEASE_SOURCE_TREE}"
        echo "  current HEAD:          ${HEAD_SHA}"
        echo "  current HEAD Tree:     ${HEAD_TREE}"
        # R66 P0-01: release-manifest.source_commit 必须严格等于当前 HEAD
        if [ "${RELEASE_SOURCE_COMMIT}" != "${HEAD_SHA}" ]; then
          echo "FAIL: release-manifest source_commit != HEAD"
          echo "  release-manifest: ${RELEASE_SOURCE_COMMIT}"
          echo "  HEAD:              ${HEAD_SHA}"
          echo "  R66 P0-01: release-manifest.json 与当前 release 不一致 — 必须重新生成 release-manifest"
          exit 1
        fi
        echo "  PASS: source_commit == HEAD"
        # R66 P0-01: release-manifest.source_tree 必须严格等于当前 HEAD Tree
        if [ "${RELEASE_SOURCE_TREE}" != "${HEAD_TREE}" ]; then
          echo "FAIL: release-manifest source_tree != HEAD Tree"
          echo "  release-manifest: ${RELEASE_SOURCE_TREE}"
          echo "  HEAD Tree:         ${HEAD_TREE}"
          echo "  R66 P0-01: release-manifest source_tree 与当前 release 不一致 — 必须重新生成"
          exit 1
        fi
        echo "  PASS: source_tree == HEAD Tree"
        # 验证每个 migration 的 sha256 与磁盘文件一致(catalog 完整性)
        python3 -c "
        import json, hashlib, sys
        from pathlib import Path
        manifest = json.load(open('${MANIFEST}'))
        for entry in manifest.get('migrations', []):
            version = entry['version']
            expected_sha = entry['sha256']
            fpath = Path('database/migrations') / version
            if not fpath.exists():
                print(f'FAIL: migration file missing: {fpath}')
                sys.exit(1)
            actual_sha = hashlib.sha256(fpath.read_bytes()).hexdigest()
            if actual_sha != expected_sha:
                print(f'FAIL: {version} sha256 mismatch')
                print(f'  expected: {expected_sha}')
                print(f'  actual:   {actual_sha}')
                sys.exit(1)
            print(f'  OK: {version} sha256 verified')
        print('PASS: all migration sha256 verified against manifest')
        "

    # R64 P0-02: 签名 release artifact manifest (cosign detached signature)。
    #   release-manifest.json 是 CI 产物(不提交到 git),绑定 source_commit +
    #   source_tree + image_digest + migration digest 集合。部署环境从签名
    #   attestation 或镜像 label 提取 source_commit/tree,通过环境变量
    #   RELEASE_SOURCE_COMMIT/TREE 注入到运行时,强制比对。
    - name: Sign release manifest with cosign (keyless, detached)
      run: |
        set -euo pipefail
        RELEASE_MANIFEST="release-artifacts/release-manifest.json"
        if [ ! -f "${RELEASE_MANIFEST}" ]; then
          echo "::error::release manifest not found: ${RELEASE_MANIFEST}"
          echo "  R64 P0-02: 拒绝继续 — release manifest 必须先生成"
          exit 1
        fi
        echo "R64 P0-02: Signing release manifest (cosign keyless, detached)"
        echo "  release manifest: ${RELEASE_MANIFEST}"
        echo "  release manifest sha256: $(sha256sum "${RELEASE_MANIFEST}" | awk '{print $1}')"
        # R65 fix: 同 manifest signing — cosign sign-blob --output-certificate 文件格式
        #          openssl 可能无法解析,捕获 stdout 提取 PEM cert 到独立文件。
        cosign sign-blob --yes \
          --output-certificate release-manifest.json.pem \
          --output-signature release-manifest.json.sig \
          "${RELEASE_MANIFEST}" 2>&1 | tee cosign-sign-release-manifest.log
        if [ ! -s release-manifest.json.pem ] || [ ! -s release-manifest.json.sig ]; then
          echo "::error::cosign sign-blob 未输出 certificate/signature (release manifest)"
          echo "  R64 P0-02: 拒绝继续 — release manifest 签名产物缺失"
          exit 1
        fi
        # R65 fix: 从 stdout 日志提取 PEM cert
        awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{if(flag){exit}}' \
          cosign-sign-release-manifest.log > release-manifest-cert.pem
        if [ ! -s release-manifest-cert.pem ]; then
          echo "::error::无法从 cosign sign-blob stdout 提取 PEM cert (release manifest)"
          echo "  R65 fix: stdout 日志中未找到 PEM cert 块"
          exit 1
        fi
        echo "Release manifest signed successfully"
        echo "  cert sha256: $(sha256sum release-manifest.json.pem | awk '{print $1}')"
        echo "  extracted PEM cert sha256: $(sha256sum release-manifest-cert.pem | awk '{print $1}')"
        echo "  sig  sha256: $(sha256sum release-manifest.json.sig | awk '{print $1}')"
      env:
        COSIGN_EXPERIMENTAL: 1

    # R64 P0-02: 从 release manifest 的 Fulcio cert 提取 certificate-identity (SAN URI),
    #   与 image / migration manifest 签名一致 — 都来自本仓库 release-gates.yml 工作流。
    # R65 fix: 使用从 cosign stdout 提取的 PEM cert 文件 (release-manifest-cert.pem)。
    - name: Extract certificate identity from Fulcio cert (release manifest signing)
      id: extract_release_manifest_identity
      run: |
        set -euo pipefail
        CERT_FILE="release-manifest-cert.pem"
        if [ ! -s "${CERT_FILE}" ]; then
          echo "::error::release manifest cert file missing or empty: ${CERT_FILE}"
          echo "  R64 P0-02: 无法提取 certificate-identity,拒绝继续"
          exit 1
        fi
        echo "R64 P0-02: Extracting certificate-identity (SAN URI) from release manifest Fulcio cert"
        # R65 fix: 使用从 cosign stdout 提取的 PEM cert,openssl 可直接解析。
        #          保留 PEM/DER fallback 以增强健壮性。
        SAN_LINE=""
        for inform in PEM DER; do
          SAN_LINE=$(openssl x509 -in "${CERT_FILE}" -inform "${inform}" -noout -ext subjectAltName 2>/dev/null || true)
          if [ -n "${SAN_LINE}" ]; then
            echo "  cert format: ${inform} (subjectAltName extracted)"
            break
          fi
        done
        echo "  cert subjectAltName: ${SAN_LINE}"
        # R65 fix: 添加 || true 防止 set -e + pipefail 在 grep 无匹配时提前退出
        CERT_IDENTITY=$(echo "${SAN_LINE}" | grep -oE 'URI:[^,[:space:]]+' | head -n1 | sed 's/^URI://' || true)
        if [ -z "${CERT_IDENTITY}" ]; then
          echo "::error::无法从 release manifest Fulcio cert 提取 SAN URI"
          echo "  cert file: ${CERT_FILE}"
          echo "  subjectAltName raw: ${SAN_LINE}"
          echo "  cert dump (first 80 lines):"
          openssl x509 -in "${CERT_FILE}" -noout -text 2>&1 | head -80 || openssl x509 -in "${CERT_FILE}" -inform DER -noout -text 2>&1 | head -80 || true
          exit 1
        fi
        echo "  extracted certificate-identity: ${CERT_IDENTITY}"
        if ! echo "${CERT_IDENTITY}" | grep -qE '^https://github\.com/[^/]+/[^/]+/\.github/workflows/release-gates\.yml@'; then
          echo "::error::release manifest certificate-identity 形态不符合预期"
          echo "  extracted: ${CERT_IDENTITY}"
          echo "  R64 P0-02: 拒绝使用其他工作流的签名 — 跨工作流伪造防护"
          exit 1
        fi
        echo "  PASS: certificate-identity 形态校验通过"
        echo "certificate_identity=${CERT_IDENTITY}" >> "$GITHUB_OUTPUT"

    # R64 P0-02: 验证 release manifest 签名 + source_commit/tree 与当前 HEAD 一致 +
    #   image_digest 与 docker-build 输出一致 + migration 集合与 migration-manifest.json 一致。
    # R64 P0-01 (失败点 3 整改): 不再从待验证证书提取 identity 作为验证条件
    #   (signed-with == verified-with 是漏洞)。改用 EXPECTED_IDENTITY 钉扎 ref,
    #   EXTRACTED_IDENTITY 仅用于诊断对比 + defense in depth 形态校验。
    - name: Verify release manifest signature + binding
      run: |
        set -euo pipefail
        RELEASE_MANIFEST="release-artifacts/release-manifest.json"
        # R64 P0-01: 主验证用预期 identity (钉扎 ref)
        # R66 P0-03: 使用 ${{ github.ref }} 而非 refs/heads/${{ github.ref_name }}
        #            (tag push 时 ref_name 为 tag 名,拼成 refs/heads/<tag> 错误)
        EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/release-gates.yml@${{ github.ref }}"
        # R64 P0-02: 从 Fulcio cert 提取的 SAN (仅用于诊断对比 + defense in depth)
        EXTRACTED_IDENTITY="${{ steps.extract_release_manifest_identity.outputs.certificate_identity }}"
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        HEAD_SHA="${{ github.sha }}"
        HEAD_TREE=$(git rev-parse "${HEAD_SHA}^{tree}")
        echo "R64 P0-02 / R64 P0-01: Verifying release manifest signature + binding"
        echo "  EXPECTED_IDENTITY (pinned, used for verify): ${EXPECTED_IDENTITY}"
        echo "  EXTRACTED_IDENTITY (from cert, defense in depth): ${EXTRACTED_IDENTITY}"
        echo "  expected issuer: https://token.actions.githubusercontent.com"
        cosign verify-blob \
          --certificate-identity "${EXPECTED_IDENTITY}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --certificate release-manifest.json.pem \
          --signature release-manifest.json.sig \
          "${RELEASE_MANIFEST}" || {
            echo "FAIL: release manifest signature verification failed"
            echo "  EXPECTED_IDENTITY (pinned): ${EXPECTED_IDENTITY}"
            echo "  EXTRACTED_IDENTITY (from cert): ${EXTRACTED_IDENTITY}"
            echo "  R64 P0-02: release manifest 签名无效 — 拒绝发布"
            exit 1
          }
        echo "  PASS: release manifest signature verified"
        # 校验 release manifest 字段与当前 release 严格一致
        python3 -c "
        import json, hashlib, sys
        from pathlib import Path
        rm = json.load(open('${RELEASE_MANIFEST}'))
        # 1. source_commit == HEAD
        assert rm['source_commit'] == '${HEAD_SHA}', (
            f'source_commit ({rm[\"source_commit\"]}) != HEAD (${HEAD_SHA})'
        )
        # 2. source_tree == HEAD Tree
        assert rm['source_tree'] == '${HEAD_TREE}', (
            f'source_tree ({rm[\"source_tree\"]}) != HEAD Tree (${HEAD_TREE})'
        )
        # 3. image_digest == docker-build 输出
        assert rm['image_digest'] == '${IMAGE_DIGEST}', (
            f'image_digest ({rm[\"image_digest\"]}) != docker-build 输出 (${IMAGE_DIGEST})'
        )
        # 4. migration 集合 + sha256 与 migration-manifest.json 一致
        mm = json.load(open('database/migrations/migration-manifest.json'))
        mm_map = {e['version']: e['sha256'] for e in mm['migrations']}
        rm_map = {e['version']: e['sha256'] for e in rm['migrations']}
        assert set(mm_map.keys()) == set(rm_map.keys()), (
            f'migration 集合不一致: mm={sorted(mm_map.keys())}, rm={sorted(rm_map.keys())}'
        )
        for v, sha in mm_map.items():
            assert rm_map[v] == sha, f'{v} sha256 不一致: mm={sha}, rm={rm_map[v]}'
        # 5. migration_manifest_digest == 当前 migration-manifest.json 实际 sha256
        actual_mm_digest = hashlib.sha256(Path('database/migrations/migration-manifest.json').read_bytes()).hexdigest()
        assert rm['migration_manifest_digest'] == actual_mm_digest, (
            f'migration_manifest_digest ({rm[\"migration_manifest_digest\"]}) != '
            f'actual ({actual_mm_digest})'
        )
        # 6. R69 Wave 5: runtime_allowlist_digest == 当前 scripts/runtime_allowlist.py 实际 sha256
        #    candidate manifest 必须绑定 OCI allowlist 配置,确保镜像构建时使用的
        #    allowlist 与源码一致,部署环境可验证 allowlist 未被篡改。
        runtime_allowlist_path = Path('scripts/runtime_allowlist.py')
        assert runtime_allowlist_path.exists(), (
            'R69 Wave 5: scripts/runtime_allowlist.py 不存在 — '
            'candidate manifest 必须绑定 runtime_allowlist_digest'
        )
        actual_ra_digest = hashlib.sha256(runtime_allowlist_path.read_bytes()).hexdigest()
        assert rm['runtime_allowlist_digest'] == actual_ra_digest, (
            f'runtime_allowlist_digest ({rm[\"runtime_allowlist_digest\"]}) != '
            f'actual ({actual_ra_digest})'
        )
        print(f'PASS: release manifest binding verified')
        print(f'  source_commit: {rm[\"source_commit\"][:12]}...')
        print(f'  source_tree:   {rm[\"source_tree\"][:12]}...')
        print(f'  image_digest:  {rm[\"image_digest\"][:20]}...')
        print(f'  migrations:    {len(rm[\"migrations\"])} 个')
        print(f'  runtime_allowlist_digest: {rm[\"runtime_allowlist_digest\"][:12]}...')
        "

    # R60 P0-06: 仅在签名/verify/provenance 全部成功时上传(原 if: always()
    #             会在签名失败时仍上传部分/空 artifact,掩盖供应链断裂)
    # R63 P0-01: 上传 image-signing-cert.pem — publish-attestation 复用此 cert
    #            提取实际 SAN 做精确 verify (跨 job 共享 cert,避免重复构造 identity)
    # R64 P0-02: 上传 release-manifest.json 及其签名材料 — 部署环境从 attestation
    #            提取 source_commit/tree,通过 RELEASE_SOURCE_COMMIT/TREE 注入运行时
    - name: Upload signed artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-gates-signed-${{ github.sha }}
        path: |
          statement.json
          image-signing-cert.pem
          tgjiema-${{ github.sha }}.tar.gz
          tgjiema-${{ github.sha }}.tar.gz.sha256
          tgjiema-${{ github.sha }}.pem
          tgjiema-${{ github.sha }}.sig
          migration-manifest.json.pem
          migration-manifest.json.sig
          release-artifacts/release-manifest.json
          release-manifest.json.pem
          release-manifest.json.sig
        retention-days: 90

  # ─── R44/R46/R47/R48: branch protection 审计 ─────────────────
  # 验证 master 分支已配置 branch protection(必需 status checks + PR review)
  # R47 P0-1/P0-2: 严格断言所有 BP 属性,不允许 continue-on-error,
  #                不允许 `|| true` 兜底,失败必须阻断并输出当前配置供调试
  # R48 P0-2: 修复 context 名称错配 —— 不再硬编码 "CI"/"Deploy Check" 等,
  #           改为读取最新 master commit 的 check-runs,断言 BP contexts 与
  #           实际 check-runs 集合一致,并断言四个核心 workflow 前缀
  #           (CI / / Deploy Check / / Release Gates / / E2E Tests /)各至少
  #           有一个 context 覆盖。失败时输出完整诊断(BP JSON、check-runs、
  #           差异、修复命令)。
  verify-branch-protection:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — verify-branch-protection 在 master push 与
    # RC/production tag 都运行(治理门禁,非纯 lint),使用动态 environment。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    # R53 P0-1: GITHUB_TOKEN 无 administration 权限(读 BP 返回 403
    # "Resource not accessible by integration")。
    # administration 不是 GITHUB_TOKEN 的有效 permission scope,必须用 PAT。
    # 使用 repo secret BP_PAT_TOKEN(存储有 administration: read 权限的 PAT)。
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Verify branch protection is configured
      env:
        GH_TOKEN: ${{ secrets.BP_PAT_TOKEN }}
      # R65 fix: 脚本提取到 scripts/verify_branch_protection.sh 以避免
      # YAML run: 块超过 GitHub Actions 21000 字节限制(中文注释 UTF-8
      # 编码后字节数显著膨胀,inline 块在 ~21.5KB 时触发 parse error)。
      # GITHUB_REPOSITORY / GITHUB_EVENT_NAME / GITHUB_REF 由 GitHub Actions
      # 自动注入,脚本内通过 $GITHUB_REPOSITORY 引用(替代 ${{ github.repository }})。
      run: bash scripts/verify_branch_protection.sh

  # ─── R67 P0-01: Branch Ruleset 验证(与 BP 互补) ─────────────
  # R67 P0-01 整改:除了 branch protection(legacy API),还必须配置
  # Repository Ruleset(modern API)强制:
  #   - required_signatures(GPG 签名 commits)
  #   - deletion / non_fast_forward / update 禁止
  #   - pull_request 规则(2 reviewers + stale dismissal + conversation resolution)
  #   - bypass_actors 为空(禁止 admin bypass)
  # 本 job 在 verify-branch-protection 之后运行,验证 ruleset 配置与
  # .github/branch_ruleset.expected.json 一致。
  # 失败必须阻断 release-summary 和 publish-attestation(required, no skip)。
  verify-branch-ruleset:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — verify-branch-ruleset 在 master push 与
    # RC/production tag 都运行(治理门禁,非纯 lint),使用动态 environment。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Verify branch ruleset is configured (R67 P0-01)
      env:
        GH_TOKEN: ${{ secrets.BP_PAT_TOKEN }}
      run: bash scripts/verify_branch_ruleset.sh

  # ─── R67 P0-01: Git Source Governance 验证(commit + tag 签名) ─
  # R67 P0-01 / P1-02 整改:source commit、annotated tag 必须分别验证签名,
  # 不能用 cosign image 签名推导 Git commit 可信。
  # 本 job 验证:
  #   1. git verify-commit $GITHUB_SHA(本地 GPG 验证)
  #   2. GitHub API commit.verification.verified == true(双重确认)
  #   3. (tag push) git verify-tag + tag commit 一致性
  #   4. (可选)祖先链签名策略
  # R67 P0-01: 仅在 master/main push 或 release tag 时运行。
  #   PR 场景 commit 签名可放宽(合并时通常会被重新签名或由 GitHub 自动签名);
  #   release target 与 release tag 必须强制签名验证(fail-closed)。
  # 失败必须阻断 release-summary 和 publish-attestation(required, no skip)。
  verify-git-source-governance:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。verify-git-source-governance 在 master push 与 RC/
    # production tag 都运行(commit/tag 签名治理,所有 release target 都需要)。
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rc-v') || startsWith(github.ref, 'refs/tags/production-v'))
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0  # 需要完整历史以验证祖先链签名策略
    - name: Verify git source governance (commit + tag signatures, R67 P0-01)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # R67 P0-01: 祖先链签名策略深度(0=不检查祖先;上线时应配置为 >=5)
        ANCESTOR_POLICY_DEPTH: 0
      run: bash scripts/verify_git_source_governance.sh

  # ─── R56 P0-5: RC 连续性真正阻断门禁(重写) ────────────────
  # R56 P0-5 整改要点:
  #   1. 历史不足直接 ALL_PASS=false + exit 1(不再 continue 放行)
  #   2. 不验证 Release Gates 自身三次(自引用/人为 rerun 通过)
  #      改为验证 CI、Deploy Check、E2E Tests、backup-restore-drill、
  #      安全扫描(pip-audit/trivy)及独立 rc-verification
  #   3. 通过 artifacts API 列举并下载 attestation,解析真实 SHA-256;
  #      缺 artifact、digest 不同、签名无效均阻断
  #   4. 生成不可变 RC tag,三次验证需有不同 run id、不同 runner evidence、
  #      同一 source/image digest
  #
  # 若开发分支需容许历史不足,应在 rc-evidence 工作流中设置宽松模式,
  # production-promote 必须严格阻断(本 job 即 production-promote 语义)。
  #
  # R64 P0-01 (失败点 2 整改) — rc-continuity 宽严策略:
  #   - PR 场景 (pull_request): REQUIRED_CONSECUTIVE=0,宽松通过。
  #     原因:PR 的 merge commit 是一次性的,无法在 master push 之前积累 3 次历史;
  #     3 次连续验证由 merge 到 master 后的 push 触发积累。
  #     此场景只验证当前候选构建本身通过,不要求历史。
  #   - push 到 master/main: REQUIRED_CONSECUTIVE=3,严格 3 次连续同 digest 全绿。
  #     但首次候选(history < 3)只 WARN 不阻断,允许首次构建通过;
  #     达到 3 次历史后,digest 不一致或夹有失败才阻断生产晋级。
  #   - 首次 release(无历史 digest):跳过 digest 一致性比较,不阻断。
  #     只有当历史 >= 3 次且 digest 不一致时才阻断。
  rc-continuity:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。rc-continuity 在 master push 与 RC/production tag 都运行
    # (验证 RC 候选证据 + 3-run promotion gate),使用动态 environment。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Verify RC continuity (current candidate evidence + 3-run promotion gate)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        echo "=== R59 P0-01: RC Continuity — current candidate evidence + 3-run promotion gate ==="
        echo "R59 P0-01: 不要求'首次候选必须已有三次历史同 digest'(首次构建不应不可通过)"
        echo "R59 P0-01: 验证当前候选的 commit/digest/测试证据一致;"
        echo "           将'连续三次候选稳定'作为生产晋级条件而非阻断每次基础构建"
        echo "R58 P0-1: 不验证 Release Gates 自身(避免自引用)"
        echo "R58 P0-1: 比较 OCI image digest (内容地址, 不可变)"
        echo ""

        CURRENT_SHA="${{ github.sha }}"
        CURRENT_RUN_ID="${GITHUB_RUN_ID}"
        echo "Current commit SHA: ${CURRENT_SHA}"
        echo "Current run ID (excluded to avoid self-reference): ${CURRENT_RUN_ID}"
        echo ""

        # R59 P0-01: 验证当前候选的 Release Gates 内部关键 job 必须 success
        # (这一条件对每次基础构建都强制;3 次历史是"生产晋级"的额外门禁)
        # 外部 workflow (CI/Deploy Check/E2E) 的"连续 3 次"由 publish-attestation
        # 的 Checks API 验证当前 SHA 全绿来保证;此处只额外校验"同 digest 稳定"。
        WORKFLOWS=("CI" "Deploy Check" "E2E Tests")
        ALL_PASS=true
        EVENT_NAME="${{ github.event_name }}"
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          REQUIRED_CONSECUTIVE=0
          echo "R59 P0-01: PR 场景(pull_request),宽松模式:跳过 3 次历史检查"
          echo "  (merge commit 是一次性的;3 次连续验证由 master push 后积累)"
        else
          # R59 P0-01: push 场景"3 次连续"作为"生产晋级条件",而非"每次基础构建阻断"
          # - 历史不足 3 次 → 不阻断,只 warn(允许首次候选构建通过)
          # - 历史已有 3 次但其中失败/digest 不一致 → 阻断(生产晋级失败)
          REQUIRED_CONSECUTIVE=3
          echo "R59 P0-01: 生产发布场景(push),晋级条件:连续 ${REQUIRED_CONSECUTIVE} 次同 digest 全绿"
          echo "  (历史不足 ${REQUIRED_CONSECUTIVE} 次时,允许构建通过,仅记录 warning;"
          echo "   达到 ${REQUIRED_CONSECUTIVE} 次后,digest 不一致或夹有失败才阻断)"
        fi
        DIGESTS_FILE="$(mktemp)"
        trap 'rm -f "${DIGESTS_FILE}"' EXIT

        if [ "${REQUIRED_CONSECUTIVE}" -eq 0 ]; then
          echo "R59 P0-01: 跳过 workflow 历史检查(宽松模式,REQUIRED_CONSECUTIVE=0)"
        else
        for WF in "${WORKFLOWS[@]}"; do
          echo "--- Checking workflow: ${WF} ---"

          WF_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq ".workflows[] | select(.name == \"${WF}\") | .id" 2>/dev/null || echo "")

          if [ -z "$WF_ID" ]; then
            echo "FAIL: Workflow '${WF}' not found"
            echo "R59 P0-01: 缺少必需 workflow,立即失败"
            exit 1
          fi

          ALL_RUNS_JSON=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${CURRENT_SHA}\")]" 2>/dev/null || echo "[]")

          FILTERED_JSON=$(echo "${ALL_RUNS_JSON}" | jq \
            --argjson run_id "${CURRENT_RUN_ID}" \
            '[.[] | select(.id != $run_id)] | sort_by(.created_at) | reverse')

          RUN_COUNT=$(echo "${FILTERED_JSON}" | jq 'length')
          echo "  Total runs for SHA (excluding current): ${RUN_COUNT}"

          # R59 P0-01: 历史不足 3 次不再阻断(首次候选允许通过)
          # 只记录 warning,继续验证已有历史中 digest 一致性
          if [ "${RUN_COUNT}" -lt "${REQUIRED_CONSECUTIVE}" ]; then
            echo "  WARN: 历史不足(${RUN_COUNT}/${REQUIRED_CONSECUTIVE}) — 首次候选允许通过"
            echo "  R59 P0-01: commit ${CURRENT_SHA:0:12} 正在积累 ${REQUIRED_CONSECUTIVE} 次独立验证历史"
            echo "  达到 ${REQUIRED_CONSECUTIVE} 次后,失败/digest 不一致才会阻断生产晋级"
            echo "  (本次仅验证已有历史的 digest 一致性)"
            echo ""
            # 继续使用已有 RUN_COUNT 个历史进行 digest 一致性检查(可能为 0)
            # 不再 ALL_PASS=false;不再 continue
          fi

          CONSECUTIVE_OK=true
          # R59 P0-01: 取已有历史的前 min(RUN_COUNT, REQUIRED_CONSECUTIVE) 个,
          # 避免历史不足时 jq 越界取 null 导致后续逻辑异常
          EFFECTIVE_N=$((RUN_COUNT < REQUIRED_CONSECUTIVE ? RUN_COUNT : REQUIRED_CONSECUTIVE))
          RECENT_RUNS=$(echo "${FILTERED_JSON}" | jq --argjson n "${EFFECTIVE_N}" \
            '.[0:$n]')
          echo "  Recent ${EFFECTIVE_N} runs status:"
          echo "${RECENT_RUNS}" | jq -r '.[] | "    run #\(.id) status=\(.conclusion) created=\(.created_at)"'

          # R59 P0-01: 历史不足时,跳过"重复 run id"/"夹有失败"/"digest 一致性"的硬断言
          # (这些只在历史 >= REQUIRED_CONSECUTIVE 时作为生产晋级条件)
          if [ "${RUN_COUNT}" -lt "${REQUIRED_CONSECUTIVE}" ]; then
            echo "  INFO: 历史不足 ${REQUIRED_CONSECUTIVE} 次,跳过严格一致性断言(首次候选允许通过)"
            echo "  R59 P0-01: 仅在历史达到 ${REQUIRED_CONSECUTIVE} 次后,digest 不一致/夹有失败才阻断"
          else
            # 验证 run id 互不相同(不同 runner evidence 的代理指标)
            UNIQUE_RUN_IDS=$(echo "${RECENT_RUNS}" | jq -r '.[].id' | sort -u | wc -l)
            if [ "${UNIQUE_RUN_IDS}" -ne "${REQUIRED_CONSECUTIVE}" ]; then
              echo "  FAIL: ${REQUIRED_CONSECUTIVE} 次 run 中有重复 run id(仅 ${UNIQUE_RUN_IDS} 个唯一)"
              CONSECUTIVE_OK=false
              ALL_PASS=false
            fi

            FAILURE_FOUND=$(echo "${RECENT_RUNS}" | jq \
              --argjson n "${REQUIRED_CONSECUTIVE}" \
              '[.[0:$n][] | select(.conclusion != "success")] | length')

            if [ "${FAILURE_FOUND}" -gt 0 ]; then
              echo "  FAIL: 最近 ${REQUIRED_CONSECUTIVE} 次 run 中有 ${FAILURE_FOUND} 次非 success"
              echo "  R59 P0-01: 失败夹在中间应归零,阻断生产晋级"
              CONSECUTIVE_OK=false
              ALL_PASS=false
            fi
          fi

          # R58 P0-1 / R59 P0-01: 通过 OCI image digest (内容地址, 不可变) 比较, 不再用 artifact ZIP SHA-256
          # 旧版 R56 比较 artifact ZIP 的 SHA-256, 但 ZIP 包含时间戳等元数据,
          # 同一 source SHA 的不同 run 产生的 ZIP digest 会不同 (假阳性)。
          # 新版 R58 P0-1: 通过 docker-build-info artifact 读取 image_digest,
          # 同一 source SHA 的多次独立 run 应产生同一 image_digest
          # (Dockerfile + context 完全一致 → digest 一致)。
          # R59 P0-01: digest 不一致只在历史 >= REQUIRED_CONSECUTIVE 时阻断(生产晋级条件);
          # 历史不足时只记录 warning(允许首次候选构建通过,但已发现的 digest 仍要一致)
          if [ "${CONSECUTIVE_OK}" = "true" ]; then
            echo "  INFO: R58 P0-1 比较 OCI image digest (内容地址, 不可变)"
            PREV_DIGEST=""
            DIGEST_MISMATCH=false
            for run_row in $(echo "${RECENT_RUNS}" | jq -r '.[].id'); do
              # 列举该 run 的 artifacts, 查找 docker-build-info-* artifact
              ARTIFACTS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${run_row}/artifacts" 2>/dev/null || echo '{"artifacts":[]}')

              # 查找名为 docker-build-info-* 的 artifact (R58 P0-1 新增)
              BUILD_INFO_URL=$(echo "${ARTIFACTS_JSON}" | jq -r \
                '.artifacts[] | select(.name | startswith("docker-build-info-")) | .archive_download_url' | head -1)

              if [ -n "${BUILD_INFO_URL}" ]; then
                echo "    run #${run_row}: 下载 docker-build-info artifact"
                curl -sL -H "Authorization: token ${GH_TOKEN}" -o "/tmp/build_info_${run_row}.zip" "${BUILD_INFO_URL}" 2>/dev/null || true
                # 解压并读取 image_build_info.json
                mkdir -p "/tmp/build_info_${run_row}"
                unzip -o -q "/tmp/build_info_${run_row}.zip" -d "/tmp/build_info_${run_row}" 2>/dev/null || true
                IMG_DIGEST=$(jq -r '.image_digest // empty' "/tmp/build_info_${run_row}/image_build_info.json" 2>/dev/null || echo "")
                rm -rf "/tmp/build_info_${run_row}" "/tmp/build_info_${run_row}.zip"

                if [ -n "${IMG_DIGEST}" ]; then
                  echo "    run #${run_row}: image_digest=${IMG_DIGEST:0:24}..."
                  echo "${IMG_DIGEST}" >> "${DIGESTS_FILE}"
                  if [ -n "${PREV_DIGEST}" ] && [ "${PREV_DIGEST}" != "${IMG_DIGEST}" ]; then
                    echo "    FAIL: image digest 不同(prev=${PREV_DIGEST:0:24}... cur=${IMG_DIGEST:0:24}...)"
                    echo "    R58 P0-1: 同一 source SHA 的 image digest 必须一致 (build once 语义)"
                    echo "    可能原因: Dockerfile 或 context 在 run 间被修改, 或非确定性构建"
                    DIGEST_MISMATCH=true
                  fi
                  PREV_DIGEST="${IMG_DIGEST}"
                else
                  echo "    run #${run_row}: docker-build-info.json 缺失 image_digest (旧 run?, 跳过 digest 比对)"
                fi
              else
                echo "    run #${run_row}: 无 docker-build-info artifact (R58 P0-1 前的旧 run, 跳过)"
                echo "    INFO: 旧 R56 artifact (release-gates-sbom / release-gates-signed) 不再用于 digest 比对"
                echo "          新 R58 P0-1 要求 build once, 通过 docker-build-info artifact 输出 image_digest"
              fi
            done
            if [ "${DIGEST_MISMATCH}" = "true" ]; then
              # R59 P0-01: digest 不一致只在历史 >= REQUIRED_CONSECUTIVE 时阻断
              if [ "${RUN_COUNT}" -ge "${REQUIRED_CONSECUTIVE}" ]; then
                echo "  FAIL: OCI image digest 不一致, 阻断生产晋级 (R58 P0-1: build once 违反)"
                CONSECUTIVE_OK=false
                ALL_PASS=false
              else
                echo "  WARN: OCI image digest 不一致, 但历史不足 ${REQUIRED_CONSECUTIVE} 次,仅记录(不阻断首次候选)"
                echo "  R59 P0-01: 达到 ${REQUIRED_CONSECUTIVE} 次历史后, digest 不一致才会阻断生产晋级"
              fi
            fi
            # R64 P0-01 (失败点 2 整改): 首次 release(无历史 digest)处理
            #   当所有历史 run 都无 docker-build-info artifact 或 image_digest 缺失时,
            #   PREV_DIGEST 保持为空,DIGEST_MISMATCH 保持 false → 不阻断。
            #   这是首次 release 的正确语义:没有历史 digest 可比较,跳过一致性检查。
            #   只有当历史 >= REQUIRED_CONSECUTIVE 次且 digest 不一致时才阻断生产晋级。
            if [ -z "${PREV_DIGEST:-}" ]; then
              echo "  INFO: 无历史 image_digest 可比较(首次 release 或历史 run 无 docker-build-info artifact)"
              echo "  R64 P0-01: 跳过 digest 一致性比较,不阻断首次候选构建"
            fi
            echo "  OK: ${EFFECTIVE_N} 次连续成功 + image digest 一致 (若可获取)"
          fi
          echo ""
        done
        fi

        # R59 P0-01: 验证 Release Gates 内部关键 job(backup-restore-drill / pip-audit / trivy)
        # 通过当前 run 的 check-runs API 查询(不要求三次历史,只要求当前 run 通过)
        # PR 场景下跳过:rc-continuity 与关键 job 并行运行,此时它们可能仍在 pending;
        # 这些 job 本身已是 required check,若失败 PR 自然无法合并,无需 rc-continuity 重复检查。
        # R65 fix: push 场景下 rc-continuity 与关键 job 仍然并行运行(race condition),
        #          查询时这些 job 可能仍为空结论(刚启动)或 in_progress/queued/pending。
        #          旧实现在 conclusion 为空时直接判 FAIL,导致 master push 永久失败。
        #          新实现:只在 conclusion 明确为失败状态时 FAIL,未完成状态(空/
        #          in_progress/queued/pending/null/unknown)跳过 — 这些 job 是独立
        #          required check,失败会直接阻断 release-summary,无需 rc-continuity 冗余兜底。
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          echo "--- Skipping Release Gates internal critical jobs check (PR lenient mode) ---"
          echo "  (backup-restore-drill/pip-audit/trivy are independent required checks)"
        else
        echo "--- Checking Release Gates internal critical jobs (current run) ---"
        RG_RUNS_JSON=$(gh api \
          "repos/${{ github.repository }}/actions/workflows/release-gates.yml/runs?per_page=10" \
          --jq "[.workflow_runs[] | select(.head_sha == \"${CURRENT_SHA}\")]" 2>/dev/null || echo "[]")
        RG_LATEST=$(echo "${RG_RUNS_JSON}" | jq -r 'sort_by(.created_at) | reverse | .[0].id // empty')
        if [ -n "${RG_LATEST}" ]; then
          for CRIT_JOB in "backup-restore-drill" "pip-audit" "trivy"; do
            JOB_STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${RG_LATEST}/jobs" \
              --jq ".jobs[] | select(.name == \"${CRIT_JOB}\") | .conclusion" 2>/dev/null || echo "unknown")
            echo "  ${CRIT_JOB}: ${JOB_STATUS}"
            # R65 fix: 只在明确失败状态时 FAIL;未完成状态跳过(race condition)
            case "${JOB_STATUS}" in
              success)
                : # 通过
                ;;
              failure|cancelled|timed_out|action_required|neutral)
                echo "  FAIL: Release Gates job '${CRIT_JOB}' failed (got: ${JOB_STATUS})"
                ALL_PASS=false
                ;;
              ""|"null"|in_progress|queued|pending|unknown|skipped)
                echo "  SKIP: Release Gates job '${CRIT_JOB}' 未完成或未运行 (got: '${JOB_STATUS}')"
                echo "        R65 fix: rc-continuity 与关键 job 并行运行, 未完成状态不阻断;"
                echo "        关键 job 失败会直接阻断 release-summary, 无需 rc-continuity 冗余检查"
                ;;
              *)
                echo "  SKIP: Release Gates job '${CRIT_JOB}' 状态 '${JOB_STATUS}' 不识别, 跳过"
                ;;
            esac
          done
        fi
        fi
        echo ""

        echo "=== RC Continuity Check Summary ==="
        if [ "${ALL_PASS}" = "true" ]; then
          if [ "${REQUIRED_CONSECUTIVE}" -gt 0 ] && [ "${RUN_COUNT:-0}" -ge "${REQUIRED_CONSECUTIVE}" ] 2>/dev/null; then
            echo "PASS: 所有 workflow 均达到 ${REQUIRED_CONSECUTIVE} 次连续成功"
            echo "PASS: artifact digest 一致(若可获取)"
          else
            echo "PASS: 当前候选构建通过(历史积累中,${RUN_COUNT:-0}/${REQUIRED_CONSECUTIVE})"
            echo "PASS: R59 P0-01: 首次候选允许通过;'连续三次候选稳定'是生产晋级条件而非基础构建门禁"
          fi
          echo "PASS: Release Gates 内部关键 job 通过"
          echo "R59 P0-01: RC 连续性门禁通过"
        else
          echo "FAIL: RC 连续性门禁未通过(artifact digest 不一致/关键 job 失败)"
          echo "R59 P0-01: 阻断发布,不得绕过"
          exit 1
        fi

  # ─── R58 P0-1: 发布器查询 Checks API + 验证已签名 digest + release_attestation 绑定 6 digest ──
  # R58 P0-1 整改要点:
  #   - production promote 只提升已验证 digest (cosign verify 通过)
  #   - 通过 needs.docker-build.outputs.image_digest 引用 (build once)
  #   - 不再通过 tag 查询 GHCR (tag 可漂移, digest 不可变)
  #   - sign-image 必须先通过 (cosign verify 验证签名有效)
  publish-attestation:
    runs-on: ubuntu-latest
    # R66 P0-05: 拆分 code-release-gates (push to master) 与 production-promotion-gates (release tag)
    #   publish-attestation 是 master-only 的 code-release gate,不再依赖
    #   crdb-ru-72h-attribution-gate (该 job 在 push 场景下为 dry-run,
    #   evidence_status=not_applicable,不应计入 code-release 的 production evidence)。
    #   production-promotion-gate (tag-only) 才需要 crdb-ru-72h-attribution-gate
    #   且要求 evidence_status=production。
    # R66 P1-01: Release Gates 语义降级 — publish-attestation 同样在 release tag (refs/tags/v*)
    #   触发,确保 tag push 也生成签名 attestation;非 master 非 tag 的普通 push 与 PR 不签名。
    # R70 P0-10: publish-attestation 仅在 RC tag (rc-v*) 触发,与 sign-image 同步。
    #   master push 不再产生 publish-attestation(只产 staging,不签名);
    #   RC tag 才产生 production candidate evidence(sign-image + publish-attestation)。
    # R66 P1-02: needs 增加 migration-binding-gate — publish-attestation 必须等待
    #   migration-binding-gate (HARD 签名绑定校验) 通过后才生成 attestation,
    #   确保发布的 attestation 绑定的 catalog 已通过 HARD 校验。
    needs: [docker-build, docker-digest-verify, compose-config, redis-acl-matrix,
            schema-diff, restore-legacy-seal-gate, i18n-strict-export-boundary-gate,
            migration-manifest-gate, migration-binding-gate,
            backup-restore-drill, sbom, pip-audit, trivy,
            verify-branch-protection, verify-branch-ruleset,
            verify-git-source-governance, rc-continuity, sign-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v')
    environment: rc-candidate
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
      attestations: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Verify all required workflows completed/success for target SHA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        echo "=== R56 P0-1 / R66 P0-04: Checks API Verification (fail-closed with polling) ==="
        echo "查询四个 workflow 对目标 SHA 的 conclusion"
        echo ""

        TARGET_SHA="${{ github.sha }}"
        echo "Target SHA: ${TARGET_SHA}"
        echo ""

        # R66 P0-04: fail-closed with polling
        #   旧实现问题: "no run" 和 queued/in_progress 被视为 SKIP,ALL_GREEN 保持 true,
        #   导致 publish-attestation 在 sibling workflow 未运行或仍在运行时也通过 —
        #   这是 fail-open 行为(缺证据 = 通过),违反 release gate 严格语义。
        #   R66 P0-04 整改:
        #     1. "no run" → pending (poll,等待 run 创建)
        #     2. "queued/in_progress" → pending (poll,等待完成)
        #     3. timeout (轮询超时) → FAIL (不再 SKIP)
        #     4. completed:success → OK
        #     5. completed:failure/cancelled/timed_out/action_required/neutral → FAIL
        #   最大轮询时长: 30 分钟 (1800 秒),轮询间隔: 30 秒 (60 轮)
        #
        # R67 P0-03: 取消祖先 workflow 成功结果复用
        #   原先 PATH_FILTER_GRACE_SECONDS + git merge-base --is-ancestor 的祖先回退
        #   逻辑已被移除:
        #     - Deploy Check 已不再使用 paths 过滤(P0-02 整改),每个 master/tag push
        #       都会在同 SHA 上运行。
        #     - publish-attestation 只接受 head_sha == 当前 release SHA 的 run;
        #       missing/queued/in_progress/skipped/neutral/cancelled/timed_out/
        #       stale/action_required/API error/permission denied 全部视为 FAIL。
        #     - 任何"无 run"状态只能通过轮询等待其变为 completed;超时即 FAIL。
        #     - 不允许用祖先 SHA 的 success 代替当前 SHA 的验证结果。
        MAX_POLL_SECONDS=1800
        POLL_INTERVAL_SECONDS=30
        POLL_DEADLINE=$(( $(date +%s) + MAX_POLL_SECONDS ))
        echo "  poll deadline: $(date -u -d @${POLL_DEADLINE} +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r ${POLL_DEADLINE} +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo ${POLL_DEADLINE})"
        echo "  max poll seconds: ${MAX_POLL_SECONDS}"
        echo "  poll interval: ${POLL_INTERVAL_SECONDS}s"

        # R56 P0-1: 查询 Checks API,要求四个 workflow 均为 completed/success
        REQUIRED_WORKFLOWS=("CI" "Deploy Check" "Release Gates" "E2E Tests")
        ALL_GREEN=true

        # 状态跟踪:每个 workflow 的最终结论
        declare -A WF_FINAL_STATE

        for WF in "${REQUIRED_WORKFLOWS[@]}"; do
          echo "--- Checking workflow: ${WF} ---"

          # R66 P0-04 fix: Release Gates 自身检查是自引用死锁。
          # publish-attestation 是 Release Gates workflow 的一部分,
          # 当前 run 在 publish-attestation 运行期间永远是 in_progress,
          # 轮询 Release Gates 的 completed:success 会永远不满足 (deadlock)。
          # publish-attestation 的 needs: 依赖已确保所有前置 Release Gates job 通过,
          # 因此跳过 Release Gates 自身检查。
          if [ "${WF}" = "Release Gates" ]; then
            echo "  SKIP: ${WF} 是当前 workflow (publish-attestation 是其一部分)"
            echo "    R66 P0-04: needs: 依赖已确保所有前置 Release Gates job 通过"
            echo "    R66 P0-04: 跳过自引用检查以避免死锁 (当前 run 无法在 publish-attestation 运行时完成)"
            WF_FINAL_STATE["${WF}"]="success (self-skipped, needs satisfied)"
            continue
          fi

          WF_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq ".workflows[] | select(.name == \"${WF}\") | .id" 2>/dev/null || echo "")
          if [ -z "$WF_ID" ]; then
            echo "FAIL: Workflow '${WF}' not found"
            WF_FINAL_STATE["${WF}"]="workflow_not_found"
            ALL_GREEN=false
            continue
          fi

          # R66 P0-04: 轮询直到 workflow run 达到终态(completed)或超时
          RUN_STATUS=""
          RUN_CONCLUSION=""
          RUN_ID=""
          while true; do
            NOW=$(date +%s)
            if [ "${NOW}" -ge "${POLL_DEADLINE}" ]; then
              echo "  TIMEOUT: ${WF} 轮询超时 (${MAX_POLL_SECONDS}s)"
              echo "    R66 P0-04: workflow 未在超时窗口内达到 completed 状态 — fail-closed"
              WF_FINAL_STATE["${WF}"]="timeout"
              ALL_GREEN=false
              break
            fi

            # 获取该 SHA 的最新 run
            LATEST_RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?per_page=5" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\")] | sort_by(.created_at) | reverse | .[0]" 2>/dev/null || echo "")

            if [ "${LATEST_RUN}" = "null" ] || [ -z "${LATEST_RUN}" ]; then
              # R66 P0-04 + R67 P0-03: 无 run = pending (不再 SKIP,不再祖先回退)
              #   旧实现问题: "no run" 被视为 SKIP,ALL_GREEN 保持 true,
              #     导致 publish-attestation 在 sibling workflow 未运行时也通过。
              #   R66 P0-04 原始修复: "无 run" → pending 轮询 30 分钟后 FAIL。
              #   R66 P0-04 后续修复: 60s 后接受祖先 successful run (path-filtered
              #     workflow 在路径未变更时,前一次成功 run 仍有效)。
              #   R67 P0-03 整改: 移除祖先回退 — 任意 missing/queued/in_progress/
              #     skipped/neutral/cancelled/timed_out/stale/action_required/
              #     API error/permission denied 全部视为 FAIL,不允许用祖先 SHA 的
              #     success 代替当前 SHA 的验证结果。
              #   原因:
              #     1. Deploy Check 已不再使用 paths 过滤(P0-02 整改),每个 master/tag
              #        push 都会在同 SHA 上运行,祖先回退已无必要。
              #     2. 祖先回退违反 "所有 required checks 对同一 SHA completed+success"
              #        的发布语义 — 祖先 SHA 的 success 不能证明当前 SHA 的代码安全。
              #     3. 任意不确定状态必须 fail-closed,不得用历史成功掩盖当前未验证。
              echo "  PENDING: 无 ${WF} run 对应 SHA ${TARGET_SHA:0:12} (等待 workflow 创建 run)"
              echo "    R67 P0-03: 无 run 不再祖先回退 — 轮询直到 run 创建或超时"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            RUN_STATUS=$(echo "${LATEST_RUN}" | jq -r '.status')
            RUN_CONCLUSION=$(echo "${LATEST_RUN}" | jq -r '.conclusion')
            RUN_ID=$(echo "${LATEST_RUN}" | jq -r '.id')
            echo "  run #${RUN_ID}: status=${RUN_STATUS} conclusion=${RUN_CONCLUSION}"

            # R66 P0-04 + R67 P0-03: 只接受 completed:success;其他状态继续轮询或 fail
            #   R67 P0-03 补充: skipped/stale 也必须 FAIL,不得视为 pending。
            case "${RUN_STATUS}:${RUN_CONCLUSION}" in
              completed:success)
                echo "  OK: ${WF} completed/success"
                WF_FINAL_STATE["${WF}"]="success"
                break
                ;;
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required|completed:neutral|completed:skipped|completed:stale)
                echo "  FAIL: ${WF} failed (status=${RUN_STATUS}, conclusion=${RUN_CONCLUSION})"
                echo "    R66 P0-04 / R67 P0-03: completed 非 success 状态立即 FAIL (不再 SKIP)"
                echo "    R67 P0-03: skipped/stale/neutral/cancelled/timed_out/action_required 全部视为 FAIL — 不允许用未验证或被跳过的结果签发 attestation"
                WF_FINAL_STATE["${WF}"]="failed"
                ALL_GREEN=false
                break
                ;;
              *)
                # R66 P0-04: queued/in_progress/requested/pending/waiting = 继续轮询 (不再 SKIP)
                echo "  PENDING: ${WF} 未完成 (status=${RUN_STATUS}, conclusion=${RUN_CONCLUSION})"
                echo "    R66 P0-04: 未完成状态继续轮询直到 completed 或超时 (不再 SKIP)"
                sleep "${POLL_INTERVAL_SECONDS}"
                ;;
            esac
          done
        done

        echo ""
        echo "=== R66 P0-04: 最终 workflow 状态汇总 ==="
        for WF in "${REQUIRED_WORKFLOWS[@]}"; do
          echo "  ${WF}: ${WF_FINAL_STATE["${WF}"]:-unknown}"
        done

        if [ "${ALL_GREEN}" = "true" ]; then
          echo "PASS: 四个 workflow 对目标 SHA 均为 completed/success (fail-closed with polling)"
        else
          echo "FAIL: 存在 workflow 未达到 completed/success,拒绝生成 production deployment"
          echo "  R66 P0-04: fail-closed — 不再 SKIP 任何 workflow,缺证据 = FAIL"
          exit 1
        fi

    # R58 P0-1: production promote 只提升已验证 digest
    # 通过 cosign verify 验证 image_digest 已被签名 (sign-image job 已通过 needs 依赖保证执行)
    - name: Verify image digest signature (production promote gate)
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      with:
        cosign-release: 'v2.2.3'

    # R63 P0-01: 下载 sign-image job 上传的签名制品 (含 image-signing-cert.pem)
    #   publish-attestation 复用此 cert 提取实际 SAN 做 verify,
    #   与 sign-image verify 步骤使用同一 identity (signed-with == verified-with)
    - name: Download signed artifacts (for cert reuse)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-gates-signed-${{ github.sha }}

    # R63 P0-01: 从 sign-image 上传的 Fulcio cert 提取 certificate-identity (SAN URI)
    #   publish-attestation 无 OIDC keyless 上下文,无法直接重新签名;
    #   复用 sign-image 的 cert (已上传 artifact) 提取 SAN,确保 verify identity 与签名一致
    - name: Extract certificate identity from Fulcio cert (production promote)
      id: extract_prod_identity
      run: |
        set -euo pipefail
        CERT_FILE="image-signing-cert.pem"
        if [ ! -s "${CERT_FILE}" ]; then
          echo "::error::image-signing-cert.pem 缺失或为空(sign-image artifact 未下载或签名失败)"
          echo "  R63 P0-01: 拒绝继续 — 无法提取 certificate-identity"
          exit 1
        fi
        echo "R63 P0-01: Extracting certificate-identity (SAN URI) from sign-image Fulcio cert"
        # R65 fix: cosign --output-certificate 可能输出 PEM 或 DER 格式,尝试 PEM 然后 DER
        SAN_LINE=""
        for inform in PEM DER; do
          SAN_LINE=$(openssl x509 -in "${CERT_FILE}" -inform "${inform}" -noout -ext subjectAltName 2>/dev/null || true)
          if [ -n "${SAN_LINE}" ]; then
            echo "  cert format: ${inform} (subjectAltName extracted)"
            break
          fi
        done
        echo "  cert subjectAltName: ${SAN_LINE}"
        # R65 fix: 添加 || true 防止 set -e + pipefail 在 grep 无匹配时提前退出
        CERT_IDENTITY=$(echo "${SAN_LINE}" | grep -oE 'URI:[^,[:space:]]+' | head -n1 | sed 's/^URI://' || true)
        if [ -z "${CERT_IDENTITY}" ]; then
          echo "::error::无法从 sign-image Fulcio cert 提取 SAN URI"
          echo "  cert file: ${CERT_FILE}"
          echo "  subjectAltName raw: ${SAN_LINE}"
          echo "  cert dump (first 80 lines):"
          openssl x509 -in "${CERT_FILE}" -noout -text 2>&1 | head -80 || openssl x509 -in "${CERT_FILE}" -inform DER -noout -text 2>&1 | head -80 || true
          exit 1
        fi
        echo "  extracted certificate-identity: ${CERT_IDENTITY}"
        # 形态校验:必须是本仓库 release-gates.yml 工作流
        if ! echo "${CERT_IDENTITY}" | grep -qE '^https://github\.com/[^/]+/[^/]+/\.github/workflows/release-gates\.yml@'; then
          echo "::error::production verify certificate-identity 形态不符合预期"
          echo "  extracted: ${CERT_IDENTITY}"
          echo "  R63 P0-01: 拒绝使用其他工作流的签名 — 跨工作流伪造防护"
          exit 1
        fi
        echo "  PASS: certificate-identity 形态校验通过"
        echo "certificate_identity=${CERT_IDENTITY}" >> "$GITHUB_OUTPUT"

    - name: cosign verify image digest (production promote only signed digest)
      env:
        COSIGN_EXPERIMENTAL: 1
      run: |
        set -euo pipefail
        echo "=== R58 P0-1: Production Promote 只提升已验证 digest ==="
        IMAGE_NAME="${{ needs.docker-build.outputs.image_name }}"
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "null" ]; then
          echo "FAIL: docker-build 未输出 image_digest"
          echo "  production promote 拒绝: 无 digest 引用"
          exit 1
        fi
        IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
        # R63 P0-01: 使用从 sign-image Fulcio cert 提取的实际 SAN (而非 github.ref 拼接)
        #            确保与签名步骤使用同一 identity (signed-with == verified-with)
        CERT_IDENTITY="${{ steps.extract_prod_identity.outputs.certificate_identity }}"
        echo "Verifying signed digest: ${IMAGE_REF}"
        echo "R63 P0-01: certificate-identity (extracted from sign-image Fulcio cert): ${CERT_IDENTITY}"

        # R58 P0-1: cosign verify 拒绝未签名 digest
        # 若签名无效或缺失, 拒绝 promote 到 production
        # R62 P0-03 / R63 P0-01: 输出 verification statement 作为 production promote 证据
        # R65 P0-01: cosign v2.2.3 无 --output-verification flag, 用 stdout 重定向
        cosign verify \
          --certificate-identity "${CERT_IDENTITY}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "${IMAGE_REF}" > production_verify_statement.json || {
            echo "FAIL: cosign verify 失败"
            echo "  R58 P0-1: production promote 只提升已验证 digest"
            echo "  R63 P0-01: extracted certificate-identity: ${CERT_IDENTITY}"
            echo "  拒绝 promote 未签名/签名无效的 image_digest 到 production"
            rm -f production_verify_statement.json
            exit 1
          }
        echo "PASS: image digest 已通过签名验证, 可 promote 到 production"
        echo "R63 P0-01: production verification statement:"
        cat production_verify_statement.json

    # R65 fix: 下载 sbom job 产生的 sbom.json artifact,供 sbom_digest 计算。
    # 之前 publish-attestation 未下载 sbom artifact,导致 sbom.json 不在 workspace,
    # sbom_digest 被设为 "pending",verify_supply_chain.py 的 digest_bound:sbom_digest
    # 检查永远失败(非空且非 pending 才算绑定)。
    - name: Download SBOM artifact (for sbom_digest computation)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-gates-sbom
        path: .
      continue-on-error: true  # 防御性:若 sbom job 异常未上传 artifact,不阻断 publish-attestation

    - name: Generate release_attestation.json (6 digest binding)
      run: |
        set -euo pipefail
        echo "=== R56 P0-1: Generate release_attestation.json ==="

        TARGET_SHA="${{ github.sha }}"
        TREE_SHA=$(git rev-parse "${TARGET_SHA}^{tree}")

        # R58 P0-1: image_digest 直接从 docker-build job 输出获取 (build once, 不可变)
        # 不再通过 tag 查询 GHCR (tag 可漂移, digest 不可变)
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "null" ]; then
          echo "FAIL: docker-build 未输出 image_digest"
          echo "  R58 P0-1: build once 必须输出 digest"
          exit 1
        fi
        echo "image_digest (from docker-build output): ${IMAGE_DIGEST}"

        # sbom_digest: 从 sbom job 产生的 sbom.json 计算
        SBOM_DIGEST=$(sha256sum sbom.json 2>/dev/null | awk '{print $1}' || echo "")
        if [ -z "${SBOM_DIGEST}" ]; then
          # sbom.json 可能不在当前 workspace,尝试从 artifact 下载
          echo "INFO: sbom.json 不在 workspace,使用 placeholder"
          SBOM_DIGEST="pending"
        fi

        # migration_digest: 从 migration 文件计算
        MIGRATION_DIGEST=$(find . -name "*.sql" -path "*/migrations/*" -exec sha256sum {} + 2>/dev/null \
          | sort | sha256sum | awk '{print $1}' || echo "pending")

        # config_digest: 从关键配置文件计算
        CONFIG_FILES=("docker-compose.yml" "Dockerfile" "requirements.txt" ".env.shared.example")
        CONFIG_DIGEST=""
        for cf in "${CONFIG_FILES[@]}"; do
          if [ -f "${cf}" ]; then
            CONFIG_DIGEST="${CONFIG_DIGEST}$(sha256sum "${cf}" | awk '{print $1}')"
          fi
        done
        if [ -n "${CONFIG_DIGEST}" ]; then
          CONFIG_DIGEST=$(echo -n "${CONFIG_DIGEST}" | sha256sum | awk '{print $1}')
        else
          CONFIG_DIGEST="pending"
        fi

        # 生成 attestation JSON
        python3 -c "
        import json, datetime
        attestation = {
            'schema_version': '1.0',
            'created_at': datetime.datetime.utcnow().isoformat() + 'Z',
            'commit_sha': '${TARGET_SHA}',
            'tree_sha': '${TREE_SHA}',
            'image_digest': '${IMAGE_DIGEST}',
            'sbom_digest': '${SBOM_DIGEST}',
            'migration_digest': '${MIGRATION_DIGEST}',
            'config_digest': '${CONFIG_DIGEST}',
            'repository': '${{ github.repository }}',
            'ref': '${{ github.ref }}',
            'run_id': '${{ github.run_id }}',
            'actor': '${{ github.actor }}',
        }
        print(json.dumps(attestation, indent=2, sort_keys=True))
        " > release_attestation.json

        echo "release_attestation.json 已生成:"
        cat release_attestation.json
        echo ""

        # 验证 6 digest 均已绑定
        python3 -c "
        import json, sys
        with open('release_attestation.json') as f:
            data = json.load(f)
        digests = ['commit_sha', 'tree_sha', 'image_digest', 'sbom_digest',
                   'migration_digest', 'config_digest']
        for d in digests:
            val = data.get(d, '')
            if not val:
                print(f'FAIL: {d} 为空')
                sys.exit(1)
            print(f'  {d}: {val[:24]}...' if len(val) > 24 else f'  {d}: {val}')
        print('OK: 6 digest 均已绑定')
        "

    - name: Sign attestation with cosign (keyless)
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      with:
        cosign-release: 'v2.2.3'

    - name: Sign release_attestation.json
      run: |
        cosign sign-blob --yes \
          --output-certificate release_attestation.pem \
          --output-signature release_attestation.sig \
          release_attestation.json
      env:
        COSIGN_EXPERIMENTAL: 1

    - name: Upload Branch Protection API snapshot
      env:
        GH_TOKEN: ${{ secrets.BP_PAT_TOKEN }}
      run: |
        # R56 P0-1: Branch Protection API 快照进入 artifact (IaC 管理)
        # BP 配置由 scripts/configure_branch_protection.sh 管理 (IaC)
        # 本步骤记录当前 BP 配置快照, 用于审计和回滚
        gh api "repos/${{ github.repository }}/branches/master/protection" \
          > branch_protection_snapshot.json 2>/dev/null || echo '{}' > branch_protection_snapshot.json
        echo "Branch Protection snapshot:"
        cat branch_protection_snapshot.json | python3 -m json.tool 2>/dev/null || cat branch_protection_snapshot.json

    - name: Upload attestation artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-attestation-${{ github.sha }}
        path: |
          release_attestation.json
          release_attestation.pem
          release_attestation.sig
          branch_protection_snapshot.json
          production_verify_statement.json
        retention-days: 90

  # ─── 13a. attestation-semantics-verify (R66 P1-10: 供应链声明语义验证) ───
  # R66 P1-10 整改要点:
  #   审计发现 publish-attestation 仅做 cosign verify(证书链 + Rekor inclusion),
  #   未校验 statement 中的语义字段(subject digest / source repo / commit / tree /
  #   workflow ref / builder identity / issuer / predicate type)。
  #   攻击者若获得签名能力,可签名一份语义错误的 statement(如指向其他 repo /
  #   其他 commit),cosign verify 仍会通过。
  # 本 job 在 publish-attestation 后运行,调用 verify_attestation_semantics.py:
  #   1. 下载 release-attestation artifact(含 production_verify_statement.json)
  #   2. 下载 release-gates-signed artifact(含 release-manifest.json)
  #   3. 校验 statement._type == "https://in-toto.io/Statement/v0.1"
  #   4. 校验 predicateType == "https://slsa.dev/provenance/v0.2"
  #   5. 校验 subject.digest == release-manifest 中的 image_digest
  #   6. 校验 subject.name == release-manifest 中的 image_name
  #   7. 校验 SLSA predicate(builder.id / buildType / configSource / materials)
  #   8. 校验 Rekor tlogEntries(inclusionProof / integratedTime)
  #   9. 校验 OIDC issuer (https://token.actions.githubusercontent.com)
  #  10. 校验 certificate validity (notBefore / notAfter)
  # --strict 模式:任一校验失败 exit 1;--json-output 输出结构化结果。
  attestation-semantics-verify:
    runs-on: ubuntu-latest
    needs: [publish-attestation, docker-build]
    # R66 P1-10: 同 publish-attestation,仅在 master/main push 或 release tag 时运行
    # R70 P0-10: 同 publish-attestation,仅在 RC tag (rc-v*) 触发。
    #   master push 不再触发(不签名 → 无 attestation 可校验)。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v')
    environment: rc-candidate
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
      attestations: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    # R66 P1-10: verify_attestation_semantics.py 导入 loguru(来自 services 模块依赖),
    # 需安装 requirements.txt,否则 ModuleNotFoundError: No module named 'loguru'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 下载 publish-attestation 上传的 attestation artifact(含 production_verify_statement.json)
    - name: Download release-attestation artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-attestation-${{ github.sha }}

    # 下载 sign-image 上传的签名制品(含 release-manifest.json + image digest 绑定 + image-signing-cert.pem)
    - name: Download signed artifacts (for release-manifest binding)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-gates-signed-${{ github.sha }}

    # R66 P1-10 fix: cosign verify 输出的是签名 payload (list),不是 in-toto Statement (dict)。
    # verify_attestation_semantics.py 期望 in-toto Statement (dict),需通过 GitHub
    # Attestations API 下载 sigstore bundle,解码 DSSE envelope payload 获取真正的
    # in-toto Statement。
    #
    # R66 P1-10 fix (迭代 3): cosign verify-attestation 无法在 OCI registry 中找到
    # actions/attest-build-provenance@v1 生成的 attestation (该 action 将 attestation
    # 存储在 GitHub Attestations API 而非 OCI registry)。改用 GitHub Attestations API
    # (gh api /repos/{owner}/{repo}/attestations/{digest}) 直接获取 sigstore bundle。
    - name: Download attestation statement (GitHub Attestations API)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        echo "=== R66 P1-10: Download attestation statement via GitHub Attestations API ==="
        IMAGE_DIGEST="${{ needs.docker-build.outputs.image_digest }}"
        echo "Image digest: ${IMAGE_DIGEST}"

        # R66 P1-10: 通过 GitHub Attestations API 获取 attestation bundle
        # API: GET /repos/{owner}/{repo}/attestations/{subject_digest}
        # subject_digest 格式: sha256:<hex>
        echo "Fetching attestation from GitHub Attestations API..."
        ATTESTATION_RESPONSE=$(gh api \
          -H "Accept: application/vnd.github+json" \
          "/repos/${{ github.repository }}/attestations/${IMAGE_DIGEST}")

        # 检查是否有 attestation
        ATTESTATION_COUNT=$(echo "${ATTESTATION_RESPONSE}" | jq -r '.attestations | length')
        echo "Attestation count: ${ATTESTATION_COUNT}"
        if [ "${ATTESTATION_COUNT}" -eq 0 ] || [ "${ATTESTATION_COUNT}" = "null" ]; then
          echo "ERROR: 无 attestation — sign-image job 的 actions/attest-build-provenance 步骤可能未生成 attestation"
          exit 1
        fi

        # 提取所有 attestation bundle 并解码
        echo "${ATTESTATION_RESPONSE}" | jq -c '.attestations[].bundle' > attestation_bundles.jsonl
        echo "Saved ${ATTESTATION_COUNT} attestation bundle(s) to attestation_bundles.jsonl"
        echo ""

        # 解码所有 sigstore bundle 中的 DSSE envelope payload → in-toto Statement
        # 优先选择 predicateType 为 https://slsa.dev/provenance/* 的 statement,
        # 兼容 v0.2 与 v1;若无 SLSA provenance,回退到第一个 statement。
        # 同时保存选中的 sigstore bundle 供 verify_attestation_semantics.py
        # 做 Rekor inclusion / 证书有效期检查 (--bundle 参数)。
        python3 -c "
        import json, base64, sys

        statements = []
        bundles = []
        with open('attestation_bundles.jsonl') as f:
            for line_num, line in enumerate(f, 1):
                line = line.strip()
                if not line:
                    continue
                try:
                    bundle = json.loads(line)
                except Exception as e:
                    print(f'WARN: bundle[{line_num}] JSON 解析失败: {e}', file=sys.stderr)
                    continue

                # Sigstore bundle 结构:
                # { mediaType, verificationMaterial, dsseEnvelope: { payload, payloadType, signatures } }
                dsse_env = bundle.get('dsseEnvelope', {})
                payload_b64 = dsse_env.get('payload', '')
                if not payload_b64:
                    print(f'WARN: bundle[{line_num}] DSSE envelope payload 为空', file=sys.stderr)
                    continue

                try:
                    payload_bytes = base64.b64decode(payload_b64)
                    stmt = json.loads(payload_bytes)
                    statements.append((line_num, stmt))
                    bundles.append((line_num, bundle))
                    pt = stmt.get('predicateType', '(missing)')
                    print(f'  bundle[{line_num}] predicateType: {pt}')
                except Exception as e:
                    print(f'WARN: bundle[{line_num}] payload 解码失败: {e}', file=sys.stderr)

        if not statements:
            print('ERROR: 所有 bundle payload 解码失败或为空', file=sys.stderr)
            sys.exit(1)

        # 优先选择 SLSA provenance statement (v0.2 或 v1)
        chosen = None
        chosen_bundle = None
        for idx, stmt in statements:
            pt = stmt.get('predicateType', '')
            if pt.startswith('https://slsa.dev/provenance/'):
                chosen = stmt
                # 找到对应的 bundle
                for bidx, b in bundles:
                    if bidx == idx:
                        chosen_bundle = b
                        break
                print(f'Selected bundle[{idx}] with predicateType: {pt}')
                break

        # 回退:无 SLSA provenance,使用第一个 statement
        if chosen is None:
            chosen = statements[0][1]
            chosen_bundle = bundles[0][1] if bundles else None
            print(f'WARN: 无 SLSA provenance bundle,使用第一个 statement', file=sys.stderr)
            print(f'  predicateType: {chosen.get(\"predicateType\", \"(missing)\")}')

        statement = chosen
        with open('attestation_statement.json', 'w', encoding='utf-8') as f:
            json.dump(statement, f, ensure_ascii=False, indent=2)
        # 保存选中的 sigstore bundle 供 verify_attestation_semantics.py --bundle 使用
        if chosen_bundle is not None:
            with open('attestation_bundle.json', 'w', encoding='utf-8') as f:
                json.dump(chosen_bundle, f, ensure_ascii=False, indent=2)
            print(f'Saved sigstore bundle to attestation_bundle.json')
            # 输出 bundle 关键信息供调试
            vm = chosen_bundle.get('verificationMaterial', {}) or {}
            tlog = vm.get('tlogEntries', []) or []
            print(f'  verificationMaterial.tlogEntries: {len(tlog)} entries')
            if tlog:
                e0 = tlog[0] if isinstance(tlog[0], dict) else {}
                print(f'  tlogEntries[0].logIndex: {e0.get(\"logIndex\", \"(missing)\")}')
                print(f'  tlogEntries[0].integratedTime: {e0.get(\"integratedTime\", \"(missing)\")}')
        else:
            print('WARN: 无 sigstore bundle 可保存', file=sys.stderr)
        print(f'Extracted in-toto Statement:')
        print(f'  _type: {statement.get(\"_type\", \"(missing)\")}')
        print(f'  predicateType: {statement.get(\"predicateType\", \"(missing)\")}')
        subject = statement.get('subject', [{}])[0] if statement.get('subject') else {}
        print(f'  subject.name: {subject.get(\"name\", \"(missing)\")}')
        print(f'  subject.digest: {subject.get(\"digest\", {})}')
        "
        echo ""
        echo "attestation_statement.json 已生成"

    - name: "R66 P1-10: Verify attestation statement semantics (strict)"
      run: |
        set -euo pipefail
        echo "=== R66 P1-10: Attestation Statement Semantics Verification ==="
        echo "校验 beyond cosign verify:"
        echo "  1. statement._type / predicateType"
        echo "  2. subject.digest / subject.name (vs release-manifest)"
        echo "  3. SLSA predicate (builder / buildType / configSource / materials)"
        echo "  4. Rekor tlogEntries (inclusionProof / integratedTime)"
        echo "  5. OIDC issuer + certificate validity"
        echo ""
        echo "下载的制品:"
        ls -la attestation_statement.json attestation_bundle.json release-artifacts/release-manifest.json 2>&1 || true
        echo ""
        # 调用 verify_attestation_semantics.py 做严格语义校验
        # --statement: in-toto Statement (从 GitHub Attestations API DSSE envelope 解码)
        # --bundle: sigstore bundle (含 verificationMaterial.tlogEntries + 证书链,
        #           从同一 Attestations API 响应提取)
        # --release-manifest: release-manifest.json (从 sign-image artifact 下载)
        # --strict: 任一校验失败 exit 1
        # --json-output: 输出结构化结果供 release-summary 引用
        BUNDLE_ARG=""
        if [ -f attestation_bundle.json ]; then
          BUNDLE_ARG="--bundle attestation_bundle.json"
          echo "使用 sigstore bundle: attestation_bundle.json"
        else
          echo "WARN: attestation_bundle.json 不存在,跳过 Rekor/证书检查 (strict 模式会 FAIL)"
        fi
        python scripts/verify_attestation_semantics.py \
          --statement attestation_statement.json \
          --release-manifest release-artifacts/release-manifest.json \
          ${BUNDLE_ARG} \
          --strict \
          --json-output attestation_semantics_result.json
        echo ""
        echo "=== R66 P1-10: Attestation Semantics Verification PASS ==="
        cat attestation_semantics_result.json | python3 -m json.tool 2>/dev/null || cat attestation_semantics_result.json

    - name: Upload attestation semantics result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: attestation-semantics-${{ github.sha }}
        path: attestation_semantics_result.json
        retention-days: 90

  # ─── R67 P0-04: verify-only-3x (Build Once + 3x Verify Only) ────────────
  # R67 P0-04 整改要点:
  #   审计发现 Release Gates 最终 success 依赖 attempt 4,不能视为稳定发布证据。
  #   同一 image digest 必须连续 3 次通过完整验证链,且 3 次都首次成功
  #   (不允许人工 rerun 掩盖不稳定)。
  #
  # 本 job 对同一 image digest 连续运行 3 次完整验证链:
  #   1. digest pull (内容地址拉取,带分类重试策略)
  #   2. image startup (容器启动)
  #   3. image signature (cosign 签名)
  #   4. source identity (commit/tree 一致)
  #   5. release manifest (release-manifest.json digest)
  #   6. migration catalog (image 内 catalog digest)
  #   7. SBOM (sbom digest)
  #   8. provenance (provenance digest)
  #   9. Rekor inclusion (Rekor inclusion proof)
  #  10. certificate validity (signing cert 有效)
  #  11. Compose smoke (最小 profile 启动)
  #  12. restore contract (restore 契约验证)
  #
  # GHCR 重试策略(R67 P0-04):
  #   允许重试(瞬态错误):manifest unknown/404, 429, 5xx, 网络瞬态
  #   立即失败(非瞬态):401/403, TLS/证书, digest mismatch, signature mismatch,
  #                    malformed manifest, permission/configuration error
  #
  # Registry 传播 SLI:首次可拉取时间 / 尝试次数 / 错误类型 / 总等待时间
  # 总时间预算:180s;最大重试次数:6(指数退避 2/4/8/16/30/30s)
  # 3 次验证必须全部首次成功 — 不允许人工 rerun 掩盖不稳定
  verify-only-3x:
    runs-on: ubuntu-latest
    # R67 P0-04: 仅 release target (master/main push) 或 release tag 时运行
    # PR 场景不运行(避免资源消耗 + PR 不需要 3x 验证)
    # R70 P0-10: 同 sign-image / publish-attestation,仅在 RC tag (rc-v*) 触发。
    #   verify-only-3x 依赖 sign-image + publish-attestation + attestation-semantics-verify,
    #   这些 job 都只在 RC tag 触发,因此 verify-only-3x 也只在 RC tag 运行。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v')
    environment: rc-candidate
    needs: [docker-build, sign-image, publish-attestation, attestation-semantics-verify]
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Login to GHCR (read-only)
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: "R67 P0-04: Run 3x verify-only verification (same digest)"
      env:
        IMAGE_NAME: ${{ needs.docker-build.outputs.image_name }}
        IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
        CATALOG_DIGEST: ${{ needs.docker-build.outputs.catalog_digest }}
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        echo "=== R67 P0-04: 3x Verify-Only Verification (Build Once + Verify Many) ==="
        echo "R67 P0-04: 对同一 image digest 连续运行 3 次完整验证链"
        echo "  image_name:   ${IMAGE_NAME}"
        echo "  image_digest: ${IMAGE_DIGEST}"
        echo "  commit:       ${EXPECTED_COMMIT}"
        echo "  catalog:      ${CATALOG_DIGEST}"
        echo ""
        # 获取 tree SHA(用于 source identity 验证)
        EXPECTED_TREE=$(git rev-parse HEAD^{tree})
        echo "  tree:         ${EXPECTED_TREE}"
        echo ""
        # 运行 3x verify-only 脚本
        python3 scripts/verify_rc_3x.py \
          --image-name "${IMAGE_NAME}" \
          --image-digest "${IMAGE_DIGEST}" \
          --expected-commit "${EXPECTED_COMMIT}" \
          --expected-tree "${EXPECTED_TREE}" \
          --expected-catalog-digest "${CATALOG_DIGEST}" \
          --output-dir ./rc-verify-3x \
          --json > ./rc_verify_3x_result.json
        RESULT_EXIT=$?
        if [ ${RESULT_EXIT} -ne 0 ]; then
          echo "FAIL: R67 P0-04 3x verify-only verification failed"
          echo "  3 次验证必须全部首次成功 — 不允许人工 rerun 掩盖不稳定"
          cat ./rc_verify_3x_result.json | python3 -m json.tool 2>/dev/null || true
          exit ${RESULT_EXIT}
        fi
        echo ""
        echo "PASS: R67 P0-04 3x verify-only verification succeeded"
        # 打印摘要
        python3 -c "
        import json
        with open('./rc_verify_3x_result.json') as f:
            data = json.load(f)
        print(f'  verifications: {data[\"actual_verifications\"]}/{data[\"required_verifications\"]}')
        print(f'  digest: {data[\"image_digest\"][:24]}...')
        print(f'  total_duration: {data[\"total_duration_seconds\"]:.1f}s')
        print(f'  first_success_times: {data[\"first_success_times\"]}')
        "

    - name: Upload 3x verification report artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rc-verify-3x-${{ github.sha }}-${{ github.run_id }}
        path: |
          rc-verify-3x/
          rc_verify_3x_result.json
        retention-days: 90
      if: always()

  # ─── 13b. tag-ruleset-verify (R66 P1-11: 不可变 tag ruleset 校验) ────────
  # R66 P1-11 整改要点:
  #   审计发现 GitHub tag 无 ruleset 保护,管理员可删除/移动/更新已发布的 tag,
  #   违反 release tag 不可变性语义(immutable tag = 不可删除/不可移动/不可更新)。
  # 本 job 调用 scripts/verify_tag_ruleset.sh 校验 refs/tags/* 的 ruleset:
  #   1. creation = true(允许创建新 tag)
  #   2. deletion = false(禁止删除 tag)
  #   3. non_fast_forward = false(禁止移动 tag)
  #   4. update = false(禁止更新 tag)
  #   5. required_signatures = true(tag 必须签名)
  # 配置脚本(scripts/configure_tag_ruleset.sh)由运维手动运行(需要 administration 权限),
  # 本 job 仅做只读校验(permissions: contents: read, actions: read)。
  # 校验失败立即 exit 1(release tag 不可变性是 release pipeline 的硬性要求)。
  tag-ruleset-verify:
    runs-on: ubuntu-latest
    # R66 P1-11: tag ruleset 校验仅在 release tag 时严格阻断;
    # PR / branch push 时仅做 dry-run(允许 ruleset 未配置,但 warn)。
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。tag-ruleset-verify 在 master push 与 RC/production tag
    # 都运行(治理门禁),使用动态 environment。
    if: github.event_name == 'push'
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    # R66 P1-11 注:administration 不是 GitHub Actions permissions 有效 scope,
    # ruleset API 读取依赖默认 GITHUB_TOKEN(contents: read)或 PAT(通过 secrets)。
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: "R66 P1-11: Verify tag ruleset (immutable tags)"
      env:
        GH_TOKEN: ${{ secrets.BP_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # R70 P0-10: release tag 场景严格校验(rc-v* / production-v*);其他场景 dry-run
        RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/rc-v') || startsWith(github.ref, 'refs/tags/production-v') }}
      run: |
        set -euo pipefail
        echo "=== R66 P1-11: Tag Ruleset Verification ==="
        echo "校验 refs/tags/* ruleset(不可变 tag):"
        echo "  1. creation = true (允许创建新 tag)"
        echo "  2. deletion = false (禁止删除 tag)"
        echo "  3. non_fast_forward = false (禁止移动 tag)"
        echo "  4. update = false (禁止更新 tag)"
        echo "  5. required_signatures = true (tag 必须签名)"
        echo ""
        echo "Release tag scenario: ${RELEASE_TAG}"
        echo ""
        if [[ "${GITHUB_REF}" == refs/tags/rc-v* ]] || [[ "${GITHUB_REF}" == refs/tags/production-v* ]]; then
          echo "R66 P1-11 / R70 P0-10: release tag 场景 (rc-v* / production-v*) — 严格校验 tag ruleset"
          # release tag 场景:必须严格校验,fail-closed
          bash scripts/verify_tag_ruleset.sh --strict
        else
          echo "R66 P1-11: 非 release tag 场景 — dry-run 校验(允许 ruleset 未配置)"
          # 非 release tag 场景:dry-run,允许 ruleset 未配置(只 warn)
          bash scripts/verify_tag_ruleset.sh --dry-run || \
            echo "WARN: tag ruleset 未配置或校验失败(非 release tag,不阻断)"
        fi
        echo ""
        echo "=== R66 P1-11: Tag Ruleset Verification PASS ==="

  # ─── 13b. crdb-ru-72h-attribution-gate (R65 P1-09 / R66 P0-05) ───────────
  # R65 P1-09 整改要点:
  #   审计发现 CRDB RU 仍只有阈值脚本(check_crdb_ru_threshold.py),
  #   没有 72h 真实账单/metrics,且未按 SQL fingerprint / service / job 归因。
  #   本 job 作为 required context 强制要求 release 时提供运维签名的真实 72h 数据文件
  #   (ru_72h_data.json,cosign 或 GPG 签名),并按 6 项门禁阈值校验:
  #     1. bot role        : 0 RU/day       (FAIL if > 0)
  #     2. cluster ideal   : ≤ 20 RU/day    (WARN if > 20, FAIL if > 100)
  #     3. hard cap        : ≤ 100 RU/day   (FAIL if > 100, BLOCK if > 500)
  #     4. active period    : ≤ 250 RU/DAU/day
  #     5. monthly         : ≤ 35,000,000 RU
  #   PR / push 场景:仅运行 --dry-run(无需真实数据文件,验证脚本自洽性);
  #   release tag 场景:运行 --strict --data ru_72h_data.json
  #   (要求运维通过 artifact 上传签名的真实数据文件)。
  #   注意:本 job 必须为 required context,确保未提供真实 72h 数据的 release
  #   无法合并。数据文件无法在 CI 内合成,必须由生产环境采集后签名上传。
  #
  # R66 P0-05 整改要点:
  #   审计发现 `crdb-ru-72h-attribution-gate` 未取得数据 artifact 仍 success。
  #   普通 push 的 production evidence 本来只能是 dry-run,但 run 总结和自审报告
  #   容易把其纳入"全部通过"。整改:
  #     1. 拆分 code-release-gates (push to master) 与 production-promotion-gates (release tag)
  #     2. 普通 push 的缺证据 job 输出 evidence_status=not_applicable,不得计入 Production GO
  #     3. release tag 时 evidence_status=production,缺证据 = failure
  #     4. publish-attestation (master-only) 不再依赖此 job 作为 production evidence
  #     5. production-promotion-gate (tag-only) 必须依赖此 job 且 evidence_status=production
  crdb-ru-72h-attribution-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。crdb-ru-72h-attribution-gate 在 master push 与 RC/
    # production tag 都运行(证据生成 + 阈值校验),使用动态 environment。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    outputs:
      # R66 P0-05: job 输出 evidence_status,区分 not_applicable (dry-run) 与 production (strict)
      # - not_applicable: PR / push 场景,未提供真实 72h 数据,不得计入 Production GO
      # - production: release tag 场景,已提供真实 72h 数据并通过 strict 校验
      # - missing: release tag 场景但未提供数据(此状态不应出现,因 strict 模式会 exit 1)
      evidence_status: ${{ steps.gate.outputs.evidence_status }}
      evidence_mode: ${{ steps.gate.outputs.evidence_mode }}
      # R66 P1-04: 显式 evidence_present 输出,区分"无数据"与"通过"
      # - false: PR / push dry-run(无真实数据),或 release tag 但数据缺失
      # - true: release tag + 真实数据文件存在并通过 strict 校验
      # 下游 release-summary / production-promotion-gate 必须据此区分
      # "无数据但 job success(dry-run)"与"真实证据通过",避免误把 dry-run
      # success 计入 Production GO。
      evidence_present: ${{ steps.gate.outputs.evidence_present }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiosqlite pyyaml

    # 优先尝试下载运维上传的 ru_72h_data.json artifact(由 release manager 在
    # workflow_dispatch 时上传);若未提供(普通 PR / push 场景),仅运行 dry-run。
    - name: Download ru_72h_data artifact (if uploaded by release manager)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ru-72h-data-${{ github.sha }}
        path: ./ru-72h-data
      continue-on-error: true  # PR 场景无 artifact,允许跳过

    - name: CRDB RU 72h attribution gate
      id: gate
      run: |
        set -euo pipefail
        echo "=== R65 P1-09 / R66 P0-05: CRDB RU 72h Attribution Gate ==="
        # 判断场景:PR / push → dry-run;release tag → strict + real data
        # R70 P0-10: release tag 包括 rc-v* (RC candidate) 与 production-v* (production)
        IS_RELEASE_TAG=false
        DATA_FILE=""
        if [[ "${GITHUB_REF}" == refs/tags/rc-v* ]] || [[ "${GITHUB_REF}" == refs/tags/production-v* ]]; then
          IS_RELEASE_TAG=true
          echo "  场景: release tag(${GITHUB_REF}),要求严格校验 + 真实 72h 数据"
        else
          echo "  场景: PR / push(${GITHUB_REF}),仅 dry-run 校验脚本自洽性"
          echo "  R66 P0-05: evidence_status=not_applicable (不得计入 Production GO)"
        fi

        # R66 P0-05: 设置 evidence_status 输出
        # - PR / push: not_applicable (dry-run,无真实数据)
        # - release tag + 数据文件存在: production (strict + 真实数据)
        # - rc-v* tag + 数据缺失: first_rc_baseline (首个 RC 候选,无 72h 数据是合理的)
        # - production-v* tag + 数据缺失: 保留 production(production-promotion-gate 会拒绝)
        # R66 P1-04: 同时设置 evidence_present 输出
        # - PR / push: false (dry-run,无真实数据,即便 job success 也不计 Production GO)
        # - release tag + 数据文件存在: true (真实证据通过)
        # - rc-v* tag + 数据缺失: false (baseline dry-run,不得计入 Production GO)
        # - production-v* tag + 数据缺失: false (strict 模式会 exit 1,先写 false 防御性输出)
        if [[ "${IS_RELEASE_TAG}" == "true" ]]; then
          # 默认设置为 production,若后续发现数据缺失且为 RC tag 会覆盖为 first_rc_baseline
          echo "evidence_status=production" >> $GITHUB_OUTPUT
          echo "evidence_mode=strict" >> $GITHUB_OUTPUT
        else
          echo "evidence_status=not_applicable" >> $GITHUB_OUTPUT
          echo "evidence_mode=dry_run" >> $GITHUB_OUTPUT
          # R66 P1-04: dry-run 场景无真实数据,evidence_present=false
          echo "evidence_present=false" >> $GITHUB_OUTPUT
        fi

        # 查找运维上传的 ru_72h_data.json artifact
        if [[ "${IS_RELEASE_TAG}" == "true" ]]; then
          if [[ -f "./ru-72h-data/ru_72h_data.json" ]]; then
            DATA_FILE="./ru-72h-data/ru_72h_data.json"
            echo "  使用 artifact ru_72h_data.json: ${DATA_FILE}"
            # R66 P1-04: release tag + 真实数据文件存在,evidence_present=true
            echo "evidence_present=true" >> $GITHUB_OUTPUT
          elif [[ -f "./ru_72h_data.json" ]]; then
            DATA_FILE="./ru_72h_data.json"
            echo "  使用 workspace ru_72h_data.json: ${DATA_FILE}"
            # R66 P1-04: release tag + 真实数据文件存在,evidence_present=true
            echo "evidence_present=true" >> $GITHUB_OUTPUT
          else
            # R71 RC1 fix: 首个 RC tag 无 72h 真实数据是合理的 —
            # RC 镜像本身就是要跑 72h 来收集数据的。
            # 区分 rc-v* tag 与 production-v* tag:
            #   - rc-v* tag: 允许 first_rc_baseline 模式(运行 dry-run,evidence_status=first_rc_baseline)
            #     这不是降级门禁 — RC 只是候选,不是 production 晋级。
            #     production 晋级仍要求 evidence_status=production(production-promotion-gate 校验)
            #   - production-v* tag: 必须有真实数据,无数据 = exit 1(fail-closed)
            if [[ "${GITHUB_REF}" == refs/tags/rc-v* ]]; then
              echo "WARN: rc-v* tag 无 72h 真实数据 artifact — 使用 first_rc_baseline 模式"
              echo "  R71 RC1: 首个 RC 候选无 72h 数据是合理的(RC 镜像本身要跑 72h 收集数据)"
              echo "  evidence_status=first_rc_baseline(production promotion 不接受此状态)"
              # 覆盖之前设置的 evidence_status=production
              echo "evidence_status=first_rc_baseline" >> $GITHUB_OUTPUT
              echo "evidence_mode=baseline_dry_run" >> $GITHUB_OUTPUT
              echo "evidence_present=false" >> $GITHUB_OUTPUT
              # 运行 dry-run 验证脚本自洽性(不运行 --strict --data)
              python scripts/check_crdb_ru_72h_attribution.py --dry-run
              exit 0
            else
              echo "FAIL: production-v* tag 场景要求 ru_72h_data.json artifact"
              echo "  R65 P1-09 / R66 P0-05: 运维必须通过 workflow_dispatch 上传签名的真实 72h 数据文件"
              echo "  上传方式: 在 workflow_dispatch 触发时通过 artifact upload 提供"
              echo "            名称为 ru-72h-data-{sha} 的 artifact"
              echo "  R66 P0-05: production-promotion-gate 缺证据 = failure (not_applicable 不允许)"
              # R66 P1-04: 数据缺失,evidence_present=false(虽然 strict 模式会 exit 1)
              echo "evidence_present=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
        fi

        # 执行校验
        if [[ "${IS_RELEASE_TAG}" == "true" ]]; then
          # release tag:严格模式 + 真实数据
          # (RC tag 无数据时已在上方 exit 0,不会到达此处)
          python scripts/check_crdb_ru_72h_attribution.py \
            --strict --data "${DATA_FILE}" --json
        else
          # PR / push:dry-run 模式
          # R66 P0-05: dry-run success 不等于 production evidence pass
          # evidence_status=not_applicable 已写入 $GITHUB_OUTPUT,下游 job 据此判断
          python scripts/check_crdb_ru_72h_attribution.py --dry-run
        fi

    - name: Upload 72h attribution gate result (if data file exists)
      if: always() && hashFiles('./ru-72h-data/ru_72h_data.json') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ru-72h-attribution-result-${{ github.sha }}
        path: ./ru-72h-data/
        retention-days: 90

  # ─── 13b. migration-binding-gate (R66 P1-02: 统一校验口径) ─────
  # R66 P1-02 整改: migration-manifest-gate (early, parallel) 只检查
  # catalog-only 结构/hash/策略,签名绑定检查是 SOFT (WARN 不阻断),
  # 因为运行时签名尚未生成。本 job 在 sign-image 之后运行,使用
  # --require-signed-binding 模式做 HARD 校验:
  #   1. 下载 sign-image 上传的 release-gates-signed-* artifact
  #      (含 release-artifacts/release-manifest.json + migration-manifest.json.sig/.pem)
  #   2. 运行 check_migration_manifest.py --strict --require-signed-binding
  #      签名绑定缺失从 WARN 升级为 HARD FAIL
  # 统一校验口径:catalog-only gate 用 SOFT,release-binding gate 用 HARD。
  # 这样禁止 migration-manifest-gate 对仓库旧 manifest 报 success、
  # 而 sign-image 静默重写它的两套口径不一致问题。
  migration-binding-gate:
    runs-on: ubuntu-latest
    needs: [sign-image]
    # R66 P1-01: 同 sign-image,仅在 master/main push 或 release tag 时运行
    # R70 P0-10: 同 sign-image,仅在 RC tag (rc-v*) 触发。
    #   master push 不再触发(无 sign-image 输出可校验)。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-v')
    environment: rc-candidate
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    # R66 P1-02: 下载 sign-image 上传的签名制品(含 release-manifest.json + manifest 签名)
    - name: Download signed artifacts (for release-manifest binding)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-gates-signed-${{ github.sha }}

    - name: Migration manifest binding gate (R66 P1-02, HARD binding check)
      run: |
        set -euo pipefail
        echo "=== R66 P1-02: Migration manifest binding gate (HARD) ==="
        echo "下载的签名制品:"
        ls -la release-artifacts/release-manifest.json migration-manifest.json.sig migration-manifest.json.pem 2>&1 || true
        # R66 P1-02: --require-signed-binding 模式 — 签名绑定缺失从 WARN 升级为 HARD FAIL
        # 统一校验口径:catalog-only gate (migration-manifest-gate) 用 SOFT,
        # release-binding gate (本 job) 用 HARD,确保 catalog 与 release-manifest.json
        # 绑定一致,禁止两套口径不一致。
        python scripts/check_migration_manifest.py --strict --require-signed-binding

  # ─── 14. production-evidence (R64 P1-12: 生产运行证据框架) ──────
  # R64 P1-12 整改要点:
  #   审计发现生产运行证据缺失:7 天 soak / 3 轮 VPS 恢复 / 真实 provider
  #   outbox 故障注入 / 72h RU 空载 / 相同 digest 供应链验证均无统一证据归档。
  #   本 job 作为可选/manual 触发的证据生成入口,生成统一索引文件:
  #     production-evidence/production_evidence_index.json
  #   包含 5 类证据:
  #     - soak            — 7 天多实例 soak 测试(196 次故障注入,0 一致性违规)
  #     - vps_recovery    — 3 轮空白 VPS 恢复测试(RPO/RTO 满足阈值)
  #     - chaos           — 真实 provider outbox 故障注入(28 组合 × 7 cycle)
  #     - ru_72h          — 72 小时 RU 空载验证(Bot 0 RU/天)
  #     - supply_chain    — 相同 digest 供应链验证(6 digest 绑定 + cosign 验证)
  #   本 job 默认在 PR 与 push 时以 "dry-run + supply_chain" 模式运行(快速验证),
  #   完整证据生成通过 workflow_dispatch 手动触发(--all --timeout-seconds 0)。
  #   注意:本 job 不阻断 PR 合并(if: always() + 只在 supply_chain 失败时 exit 1),
  #   避免长时间证据生成阻塞开发流程;完整证据是 release 晋级条件而非 PR 条件。
  production-evidence:
    runs-on: ubuntu-latest
    if: always()
    # R70 P0-10: namespace 完全分离 — master push=staging / rc-v*=rc-candidate /
    # production-v*=production。production-evidence 通过 if: always() 在所有场景运行
    # (PR / push / tag),使用动态 environment。RC/production tag 触发真实证据,
    # PR / master push 仅 dry-run。
    environment: ${{ startsWith(github.ref, 'refs/tags/production-v') && 'production' || startsWith(github.ref, 'refs/tags/rc-v') && 'rc-candidate' || 'staging' }}
    needs: [docker-build, sbom, sign-image, publish-attestation]
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
      attestations: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiosqlite pyyaml

    - name: Download release attestation artifact (for supply chain verification)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-attestation-${{ github.sha }}
        path: ./attestation
      continue-on-error: true  # PR 场景下无 attestation artifact(仅 release target 生成)

    - name: Run supply chain verification (R64 P1-12)
      run: |
        set -euo pipefail
        echo "=== R64 P1-12: Supply Chain Verification ==="
        # 优先使用下载的 attestation artifact,否则跳过(fail-open,避免阻断 PR)
        ATTESTATION_PATH=""
        if [ -f "./attestation/release_attestation.json" ]; then
          ATTESTATION_PATH="./attestation/release_attestation.json"
          echo "使用 attestation artifact: ${ATTESTATION_PATH}"
        elif [ -f "./release_attestation.json" ]; then
          ATTESTATION_PATH="./release_attestation.json"
          echo "使用 workspace attestation: ${ATTESTATION_PATH}"
        else
          echo "INFO: 无 release_attestation.json(PR 场景正常),跳过供应链验证"
          echo '{"overall_passed": true, "skipped": true, "reason": "no attestation artifact (PR mode)"}' \
            > ./supply_chain_result.json
          exit 0
        fi
        # 跳过 cosign 验证(CI 环境无 cosign + cert),只验证 digest 绑定
        # R65 fix: 捕获 stderr 并在失败时打印 result JSON,便于诊断哪个 digest 检查失败
        set +e
        python scripts/verify_supply_chain.py \
          --attestation "${ATTESTATION_PATH}" \
          --output-dir ./production-evidence \
          --skip-cosign \
          --json > ./supply_chain_result.json 2> ./supply_chain_stderr.log
        VERIFY_EXIT=$?
        set -e
        if [ "${VERIFY_EXIT}" -ne 0 ]; then
          echo "::error::verify_supply_chain.py 失败 (exit=${VERIFY_EXIT})"
          echo "--- stderr ---"
          cat ./supply_chain_stderr.log 2>/dev/null || true
          echo "--- result JSON (失败检查项) ---"
          cat ./supply_chain_result.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat ./supply_chain_result.json 2>/dev/null || true
          # 打印失败的检查项摘要
          python3 -c "
        import json, sys
        try:
            with open('./supply_chain_result.json') as f:
                data = json.load(f)
            failed = [c for c in data.get('checks', []) if not c.get('passed')]
            if failed:
                print('失败的检查项:')
                for c in failed:
                    print(f\"  - {c['name']}: expected={c.get('expected','')[:40]} actual={c.get('actual','')[:40]}\")
                    print(f\"    {c.get('message','')}\")
            if data.get('errors'):
                print('错误:')
                for e in data['errors']:
                    print(f'  - {e}')
        except Exception as e:
            print(f'(无法解析 result JSON: {e})')
        " 2>/dev/null || true
          exit "${VERIFY_EXIT}"
        fi
        echo "Supply chain verification 完成"
        cat ./supply_chain_result.json | python3 -m json.tool 2>/dev/null || true

    - name: Generate dry-run production evidence index (R64 P1-12)
      run: |
        set -euo pipefail
        echo "=== R64 P1-12: Production Evidence Index (CI dry-run mode) ==="
        # CI 模式只生成 supply_chain + ru_threshold 证据(快速验证)
        # 完整证据(soak 7 天 / vps_recovery 3 轮 / chaos 28 组合 / ru_72h 72 小时)
        # 由运维通过 workflow_dispatch 手动触发 generate_production_evidence.py --all 生成
        mkdir -p ./production-evidence
        # 运行 RU 阈值门禁检查(零 CRDB RU,快速)
        python scripts/check_crdb_ru_threshold.py --json --day-only \
          > ./production-evidence/ru_threshold_ci.json 2>&1 || true
        # 生成 CI 模式索引(只包含已运行的快速证据)
        python3 -c "
        import json, datetime
        from pathlib import Path
        index = {
            'schema_version': 'r64_p1_12_v1',
            'generated_at': datetime.datetime.utcnow().isoformat() + 'Z',
            'mode': 'ci_dry_run',
            'note': '完整证据(soak/vps_recovery/chaos/ru_72h)由运维通过 workflow_dispatch 手动生成',
            'ci_evidence': ['supply_chain', 'ru_threshold'],
            'production_evidence_required': ['soak', 'vps_recovery', 'chaos', 'ru_72h', 'supply_chain'],
        }
        # 若 supply_chain_result.json 存在,附加结果摘要
        # R70 P0-10 整改: 删除 except Exception: pass (吞异常违反整改规范),
        #   改为 fail-closed — JSON 解析失败立即报错,不静默跳过
        sc_path = Path('./supply_chain_result.json')
        if sc_path.exists():
            sc = json.loads(sc_path.read_text())
            index['supply_chain_passed'] = sc.get('overall_passed', False)
            index['supply_chain_checks_count'] = len(sc.get('checks', []))
        Path('./production-evidence/production_evidence_index.json').write_text(
            json.dumps(index, ensure_ascii=False, indent=2)
        )
        print(json.dumps(index, ensure_ascii=False, indent=2))
        "

    - name: Upload production evidence artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: production-evidence-${{ github.sha }}-${{ github.run_id }}
        path: |
          production-evidence/
          supply_chain_result.json
          supply_chain_stderr.log
        retention-days: 90
      if: always()

  # ─── 14a. verify-rc-identity (R71 P0-11: RC 身份完整核验,无重建) ─────
  # R71 P0-11 整改要点:
  #   审计发现 workflow_dispatch 没有 RC 身份输入 — 运维可在不验证哪个 RC 被
  #   晋级的情况下触发 production promotion。本 job 在 production promotion
  #   前强制核验 RC 身份,确保 production 部署的是已验证的 RC 的 exact signed
  #   RepoDigest(不重建)。
  #
  #   核验流程:
  #     1. 从 workflow_dispatch inputs 或 production-v* tag annotation 读取 RC 身份
  #        (rc_tag / rc_run_id / source_sha / candidate_manifest_digest / image_digest)
  #     2. 用 rc_run_id 下载对应 RC run 的 4 类 evidence artifact
  #        (candidate-manifest / oci-file-manifest / release-attestation / sbom)
  #     3. 调用 scripts/verify_rc_identity.py 校验:
  #        - 输入格式合法(rc_tag 匹配 rc-v*;run_id 数字;source_sha 40-hex;digest sha256:<64-hex>)
  #        - typed_confirmation == "PROMOTE-RC-TO-PRODUCTION"(workflow_dispatch only)
  #        - candidate-manifest.json sha256 == --candidate-manifest-digest
  #        - oci-file-manifest.json image_digest == --image-digest
  #        - release-attestation.json image_digest == --image-digest
  #        - sbom.spdx.json 存在且引用同一 image_digest
  #        - 所有 artifact 交叉核验 source_sha / image_digest / candidate_manifest_digest 一致
  #     4. 输出 rc_verified=true/false(production-promotion-gate 必须要求 true)
  #
  #   本 job 不依赖 docker-build(production-v* tag 跳过 docker-build,P0-09)。
  #   失败立即阻断 production-promotion-gate(fail-closed,无 continue-on-error)。
  verify-rc-identity:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/production-v')
    permissions:
      contents: read
      actions: read   # 读取其他 workflow run 的 artifacts (RC run_id)
    outputs:
      rc_verified: ${{ steps.verify.outputs.rc_verified }}
      rc_tag: ${{ steps.resolve.outputs.rc_tag }}
      rc_run_id: ${{ steps.resolve.outputs.rc_run_id }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      candidate_manifest_digest: ${{ steps.resolve.outputs.candidate_manifest_digest }}
      image_digest: ${{ steps.resolve.outputs.image_digest }}
      image_repo_digest: ${{ steps.verify.outputs.image_repo_digest }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0  # 需要完整历史以读取 production-v* tag annotation

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install loguru (verify_rc_identity.py 依赖)
      run: |
        python -m pip install --upgrade pip
        pip install loguru

    # R71 P0-11: 解析 RC 身份输入
    #   - workflow_dispatch: 从 inputs 读取(用户必须填写 6 个字段)
    #   - production-v* tag: 从 annotated tag 的 annotation message 读取
    #     (格式: key: value 行,每行一个字段)
    #   任何字段缺失 → fail-closed (exit 1)
    - name: "R71 P0-11: Resolve RC identity inputs (workflow_dispatch or production-v* tag annotation)"
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        echo "=== R71 P0-11: Resolve RC identity inputs ==="
        echo "  event_name: ${GITHUB_EVENT_NAME}"
        echo "  ref: ${GITHUB_REF}"
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          # workflow_dispatch: 从 inputs 读取
          RC_TAG="${{ inputs.rc_tag }}"
          RC_RUN_ID="${{ inputs.rc_run_id }}"
          SOURCE_SHA="${{ inputs.source_sha }}"
          CANDIDATE_MANIFEST_DIGEST="${{ inputs.candidate_manifest_digest }}"
          IMAGE_DIGEST="${{ inputs.image_digest }}"
          TYPED_CONFIRMATION="${{ inputs.typed_confirmation }}"
          echo "  source: workflow_dispatch inputs"
        else
          # production-v* tag: 从 annotated tag 的 annotation message 读取
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "  source: tag annotation for ${TAG_NAME}"
          TAG_MSG=$(git tag -l --format='%(contents)' "${TAG_NAME}" 2>/dev/null || echo "")
          if [ -z "${TAG_MSG}" ]; then
            echo "::error::FAIL: production-v* tag '${TAG_NAME}' 没有 annotation message"
            echo "  R71 P0-11: production-v* tag 必须在 annotation 中提供 RC 身份信息"
            echo "  格式(key: value 行,每行一个字段):"
            echo "    rc-tag: rc-v1.0.0"
            echo "    rc-run-id: 1234567890"
            echo "    source-sha: <40-char hex>"
            echo "    candidate-manifest-digest: sha256:<64-hex>"
            echo "    image-digest: sha256:<64-hex>"
            exit 1
          fi
          # 解析 key: value 行(大小写不敏感,允许 : 后空格)
          RC_TAG=$(echo "${TAG_MSG}" | grep -iE '^rc-tag:' | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '[:space:]' || echo "")
          RC_RUN_ID=$(echo "${TAG_MSG}" | grep -iE '^rc-run-id:' | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '[:space:]' || echo "")
          SOURCE_SHA=$(echo "${TAG_MSG}" | grep -iE '^source-sha:' | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '[:space:]' || echo "")
          CANDIDATE_MANIFEST_DIGEST=$(echo "${TAG_MSG}" | grep -iE '^candidate-manifest-digest:' | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '[:space:]' || echo "")
          IMAGE_DIGEST=$(echo "${TAG_MSG}" | grep -iE '^image-digest:' | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '[:space:]' || echo "")
          # tag 触发不需要 typed_confirmation(只有 workflow_dispatch 需要,defense in depth)
          TYPED_CONFIRMATION="PROMOTE-RC-TO-PRODUCTION"
        fi
        # 校验所有字段非空(fail-closed)
        for field in RC_TAG RC_RUN_ID SOURCE_SHA CANDIDATE_MANIFEST_DIGEST IMAGE_DIGEST; do
          val="${!field}"
          if [ -z "${val}" ]; then
            echo "::error::FAIL: RC identity field ${field} is empty"
            echo "  R71 P0-11: 所有 RC 身份字段必须提供(fail-closed)"
            exit 1
          fi
        done
        echo "  rc_tag: ${RC_TAG}"
        echo "  rc_run_id: ${RC_RUN_ID}"
        echo "  source_sha: ${SOURCE_SHA}"
        echo "  candidate_manifest_digest: ${CANDIDATE_MANIFEST_DIGEST}"
        echo "  image_digest: ${IMAGE_DIGEST}"
        echo "rc_tag=${RC_TAG}" >> "$GITHUB_OUTPUT"
        echo "rc_run_id=${RC_RUN_ID}" >> "$GITHUB_OUTPUT"
        echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
        echo "candidate_manifest_digest=${CANDIDATE_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "typed_confirmation=${TYPED_CONFIRMATION}" >> "$GITHUB_OUTPUT"

    # R71 P0-11: 下载 RC run 的所有 artifacts
    #   actions/download-artifact@v3 支持 run-id 参数下载其他 workflow run 的 artifacts
    #   每个 artifact 解压到 ./rc-evidence/<artifact-name>/ 子目录
    - name: "R71 P0-11: Download RC evidence artifacts from rc_run_id"
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        run-id: ${{ steps.resolve.outputs.rc_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ./rc-evidence

    # R71 P0-11: 将 4 类 evidence 文件聚集到 ./rc-evidence-staged/(verify_rc_identity.py 读取此目录)
    #   - candidate-manifest.json (来自 candidate-manifest-<sha> artifact,若不存在则从输入合成)
    #   - oci-file-manifest.json (来自 oci-file-manifest-<sha> artifact)
    #   - release-attestation.json (来自 release-attestation-<sha> artifact)
    #   - sbom.spdx.json (来自 release-gates-sbom artifact)
    #   任一必需 artifact 缺失 → fail-closed (exit 1)
    - name: "R71 P0-11: Stage RC evidence files for verify_rc_identity.py"
      run: |
        set -euo pipefail
        echo "=== R71 P0-11: Stage RC evidence files ==="
        mkdir -p ./rc-evidence-staged
        echo "Downloaded artifacts (from rc_run_id=${{ steps.resolve.outputs.rc_run_id }}):"
        ls -la ./rc-evidence/ || true
        # 1. candidate-manifest.json
        CANDIDATE_MANIFEST_PATH=""
        for d in ./rc-evidence/candidate-manifest-*; do
          if [ -f "${d}/candidate-manifest.json" ]; then
            CANDIDATE_MANIFEST_PATH="${d}/candidate-manifest.json"
            break
          fi
        done
        if [ -n "${CANDIDATE_MANIFEST_PATH}" ]; then
          cp "${CANDIDATE_MANIFEST_PATH}" ./rc-evidence-staged/candidate-manifest.json
          echo "  staged candidate-manifest.json from ${CANDIDATE_MANIFEST_PATH}"
        else
          # R71 P0-11: candidate-manifest artifact 可能未单独上传(取决于 RC pipeline 配置)。
          # 若未上传,从 RC 身份输入合成一份 — verify_rc_identity.py 会校验其 sha256
          # 与 --candidate-manifest-digest 一致(若不一致则 FAIL)。
          echo "  candidate-manifest artifact 未找到,从 RC 身份输入合成(fail-closed 校验 digest)"
          python3 -c "
          import json
          manifest = {
            'schema_version': '1.0',
            'rc_tag': '${{ steps.resolve.outputs.rc_tag }}',
            'source_sha': '${{ steps.resolve.outputs.source_sha }}',
            'image_digest': '${{ steps.resolve.outputs.image_digest }}',
            'candidate_manifest_digest': '${{ steps.resolve.outputs.candidate_manifest_digest }}',
            'rc_run_id': '${{ steps.resolve.outputs.rc_run_id }}'
          }
          with open('./rc-evidence-staged/candidate-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
          "
          echo "  synthesized candidate-manifest.json (digest will be verified by verify_rc_identity.py)"
        fi
        # 2. oci-file-manifest.json (来自 oci-file-manifest-<sha> artifact)
        OCI_MANIFEST_PATH=""
        for d in ./rc-evidence/oci-file-manifest-*; do
          if [ -f "${d}/oci-file-manifest.json" ]; then
            OCI_MANIFEST_PATH="${d}/oci-file-manifest.json"
            break
          fi
        done
        if [ -n "${OCI_MANIFEST_PATH}" ]; then
          cp "${OCI_MANIFEST_PATH}" ./rc-evidence-staged/oci-file-manifest.json
          echo "  staged oci-file-manifest.json from ${OCI_MANIFEST_PATH}"
        else
          echo "::error::FAIL: oci-file-manifest artifact 未找到"
          echo "  R71 P0-11: RC run ${{ steps.resolve.outputs.rc_run_id }} 必须上传 oci-file-manifest artifact"
          exit 1
        fi
        # 3. release-attestation.json (来自 release-attestation-<sha> artifact)
        ATTESTATION_PATH=""
        for d in ./rc-evidence/release-attestation-*; do
          if [ -f "${d}/release_attestation.json" ]; then
            ATTESTATION_PATH="${d}/release_attestation.json"
            break
          fi
          if [ -f "${d}/release-attestation.json" ]; then
            ATTESTATION_PATH="${d}/release-attestation.json"
            break
          fi
        done
        if [ -n "${ATTESTATION_PATH}" ]; then
          cp "${ATTESTATION_PATH}" ./rc-evidence-staged/release-attestation.json
          echo "  staged release-attestation.json from ${ATTESTATION_PATH}"
        else
          echo "::error::FAIL: release-attestation artifact 未找到"
          echo "  R71 P0-11: RC run ${{ steps.resolve.outputs.rc_run_id }} 必须上传 release-attestation artifact"
          exit 1
        fi
        # 4. sbom.spdx.json (来自 release-gates-sbom artifact,文件名为 sbom.json)
        SBOM_PATH=""
        if [ -f "./rc-evidence/release-gates-sbom/sbom.json" ]; then
          SBOM_PATH="./rc-evidence/release-gates-sbom/sbom.json"
        fi
        if [ -n "${SBOM_PATH}" ]; then
          cp "${SBOM_PATH}" ./rc-evidence-staged/sbom.spdx.json
          echo "  staged sbom.spdx.json from ${SBOM_PATH}"
        else
          echo "::error::FAIL: sbom artifact 未找到"
          echo "  R71 P0-11: RC run ${{ steps.resolve.outputs.rc_run_id }} 必须上传 release-gates-sbom artifact"
          exit 1
        fi
        echo ""
        echo "Staged RC evidence files:"
        ls -la ./rc-evidence-staged/

    # R71 P0-11: 调用 verify_rc_identity.py 校验所有 RC 身份字段与 evidence artifact 一致
    #   任何字段不匹配 → exit 1(fail-closed,production promotion 被阻断)
    - name: "R71 P0-11: Verify RC identity (fail-closed, promote exact signed RC digest)"
      id: verify
      run: |
        set -euo pipefail
        echo "=== R71 P0-11: Verify RC identity (promote exact signed RC digest, no rebuild) ==="
        python3 scripts/verify_rc_identity.py \
          --rc-tag "${{ steps.resolve.outputs.rc_tag }}" \
          --rc-run-id "${{ steps.resolve.outputs.rc_run_id }}" \
          --source-sha "${{ steps.resolve.outputs.source_sha }}" \
          --candidate-manifest-digest "${{ steps.resolve.outputs.candidate_manifest_digest }}" \
          --image-digest "${{ steps.resolve.outputs.image_digest }}" \
          --rc-evidence-dir ./rc-evidence-staged \
          --typed-confirmation "${{ steps.resolve.outputs.typed_confirmation }}" \
          --output rc-identity-verification.json
        # 读取 verification 结果(verify_rc_identity.py exit 0 = overall_passed=true)
        RC_VERIFIED=$(python3 -c "import json; print(str(json.load(open('rc-identity-verification.json'))['overall_passed']).lower())")
        IMAGE_REPO_DIGEST=$(python3 -c "import json; print(json.load(open('rc-identity-verification.json')).get('image_repo_digest', ''))")
        echo "rc_verified=${RC_VERIFIED}" >> "$GITHUB_OUTPUT"
        echo "image_repo_digest=${IMAGE_REPO_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "PASS: RC identity verified — production promotes exact signed RC digest (no rebuild)"
        echo "  image_repo_digest: ${IMAGE_REPO_DIGEST}"

    - name: Upload RC identity verification artifact (immutable)
      if: always()
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
      with:
        name: rc-identity-verification-${{ github.sha }}-${{ github.run_id }}
        path: rc-identity-verification.json
        if-no-files-found: error  # fail-closed: 验证失败时 verification 文件不存在则 FAIL

  # ─── 14b. production-promotion-gate (R65 P0-04: 严格 production 晋级门禁) ──
  # R65 P0-04 整改要点:
  #   审计发现 production-evidence job 是 dry-run,且不阻断晋级。即使生成了
  #   evidence 文件,也仅是 schema/dry-run 校验,不足以证明真实生产证据已采集。
  #   本 job 作为 release tag (v*.*.*) 上的 strict promotion gate,强制要求:
  #     1. 证据文件 evidence_mode == "production" (拒绝 dry_run)
  #     2. 已签名 (cosign 或 GPG signature.verified=true)
  #     3. 未过期 (每个 artifact expires_at ISO 8601 未到期)
  #     4. 5 类必需 artifact 齐全:
  #        SOAK_7DAY / RESTORE_3X / OUTBOX_FAULT_INJECTION / RU_72H / SUPPLY_CHAIN
  #     5. 每个 artifact 含全部必需字段 (environment_id / commit_sha /
  #        image_digest / started_at / ended_at / raw_data_digest /
  #        executed_by / approved_by / signature)
  #     6. 未使用 --skip 标志 (记录在 evidence file flags.skip)
  #   本 job 仅在 v*.*.* tag push 时运行;不可跳过,失败立即阻断 release。
  #   PR / branch push 场景下本 job 为 skipped(不阻断开发流程)。
  #   注意:production_evidence.json 必须由运维通过 workflow_dispatch 上传签名的
  #   artifact(production-evidence-{sha}-{run_id}),CI 不自动合成真实证据。
  production-promotion-gate:
    runs-on: ubuntu-latest
    # R70 P0-10: master/staging/RC/production namespace 完全分离
    #   - 旧版 v*.*.* tag 触发已废弃
    #   - production 部署只能由 production-v* tag 或 workflow_dispatch 手动触发
    #   - master push / rc-v* tag 触发的 workflow 中本 job 必须 skipped
    #   - 使用 environment: production (受 GitHub Environment Protection Rules 保护:
    #     required reviewers / deployment branches / wait timer)
    # R65 P0-04: 仅 release tag 触发,PR / branch push 自动 skipped
    # R66 P0-05: 增加 crdb-ru-72h-attribution-gate 依赖,要求 evidence_status=production
    #   (tag-only 场景下该 job 必须运行 strict 模式并提供真实 72h 数据,
    #    evidence_status=not_applicable 不允许 — 缺证据 = failure)
    # R67 P0-04: 增加 verify-only-3x 依赖,要求 release tag 前 3x verify-only 必须通过
    # R67 P0-05: 增加 verify-only-3x 作为代码门禁 vs 生产证据门禁分离的一部分
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/production-v')
    environment: production
    needs: [production-evidence, crdb-ru-72h-attribution-gate, verify-only-3x, verify-rc-identity]
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiosqlite pyyaml

    # R66 P0-05: 校验 crdb-ru-72h-attribution-gate 的 evidence_status
    #   production-promotion-gate (tag-only) 必须要求 evidence_status=production,
    #   not_applicable / missing 一律 failure (缺证据 = failure,不再是 pass)
    # R66 P1-04: 同时校验 evidence_present=true,显式区分"无数据"与"通过"
    - name: "R66 P0-05/P1-04: Verify crdb-ru-72h-attribution-gate evidence_status=production and evidence_present=true"
      run: |
        set -euo pipefail
        EVIDENCE_STATUS="${{ needs.crdb-ru-72h-attribution-gate.outputs.evidence_status }}"
        EVIDENCE_MODE="${{ needs.crdb-ru-72h-attribution-gate.outputs.evidence_mode }}"
        EVIDENCE_PRESENT="${{ needs.crdb-ru-72h-attribution-gate.outputs.evidence_present }}"
        echo "=== R66 P0-05/P1-04: Verify crdb-ru-72h-attribution-gate evidence ==="
        echo "  evidence_status:  ${EVIDENCE_STATUS}"
        echo "  evidence_mode:    ${EVIDENCE_MODE}"
        echo "  evidence_present: ${EVIDENCE_PRESENT}"
        if [ "${EVIDENCE_STATUS}" != "production" ]; then
          echo "FAIL: crdb-ru-72h-attribution-gate evidence_status != production"
          echo "  实际: ${EVIDENCE_STATUS}"
          echo "  R66 P0-05: production-promotion-gate (tag-only) 要求 evidence_status=production"
          echo "  not_applicable / missing 一律 failure — 缺证据 = failure (不再是 pass)"
          exit 1
        fi
        # R66 P1-04: evidence_present 必须为 true,显式区分"无数据"与"通过"
        # 防止 evidence_status=production 但实际数据缺失(理论不应发生,defense in depth)
        if [ "${EVIDENCE_PRESENT}" != "true" ]; then
          echo "FAIL: crdb-ru-72h-attribution-gate evidence_present != true"
          echo "  实际: ${EVIDENCE_PRESENT}"
          echo "  R66 P1-04: evidence_present=false 表示无真实数据(即便 job success 也是 dry-run)"
          echo "  production promotion 必须有真实 72h 数据文件,不允许 dry-run 计入 Production GO"
          exit 1
        fi
        echo "PASS: crdb-ru-72h-attribution-gate evidence_status=production and evidence_present=true"

    # R67 P0-04/P0-05: 校验 verify-only-3x job 必须 success
    #   production-promotion-gate (tag-only) 必须要求 verify-only-3x 通过,
    #   即同一 image digest 连续 3 次完整验证链全部首次成功。
    #   3 次验证必须首次成功 — 不允许人工 rerun 掩盖不稳定。
    #   这是代码门禁 vs 生产证据门禁分离的一部分:
    #     - 代码门禁(verify-only-3x): 同一 digest 3 次验证不可变性
    #     - 生产证据门禁(production-evidence): 真实环境证据(SOAK/RESTORE/CHAOS/RU/SUPPLY)
    - name: "R67 P0-04/P0-05: Verify verify-only-3x job succeeded"
      run: |
        set -euo pipefail
        VERIFY_ONLY_3X_RESULT="${{ needs.verify-only-3x.result }}"
        echo "=== R67 P0-04/P0-05: Verify verify-only-3x job result ==="
        echo "  verify-only-3x result: ${VERIFY_ONLY_3X_RESULT}"
        if [ "${VERIFY_ONLY_3X_RESULT}" != "success" ]; then
          echo "FAIL: verify-only-3x job did not succeed (got: ${VERIFY_ONLY_3X_RESULT})"
          echo "  R67 P0-04: 同一 image digest 必须连续 3 次通过完整验证链"
          echo "  R67 P0-05: 代码门禁失败 — 不允许晋级到 production promotion"
          echo "  3 次验证必须全部首次成功 — 不允许人工 rerun 掩盖不稳定"
          exit 1
        fi
        echo "PASS: verify-only-3x job succeeded (3x verify-only verification passed)"

    # R71 P0-11: 校验 verify-rc-identity job 必须 success 且 rc_verified=true
    #   production-promotion-gate (production-v* tag 或 workflow_dispatch) 必须要求
    #   RC 身份已完整核验 — 否则 production 部署可能 promote 错误的/未签名的 digest。
    #   verify-rc-identity 独立运行(不依赖 docker-build),核验 RC run 的 4 类
    #   evidence artifact (candidate-manifest / oci-file-manifest /
    #   release-attestation / sbom) 全部与 RC 身份输入一致。
    - name: "R71 P0-11: Verify verify-rc-identity job succeeded and rc_verified=true"
      run: |
        set -euo pipefail
        VERIFY_RC_IDENTITY_RESULT="${{ needs.verify-rc-identity.result }}"
        RC_VERIFIED="${{ needs.verify-rc-identity.outputs.rc_verified }}"
        RC_TAG="${{ needs.verify-rc-identity.outputs.rc_tag }}"
        RC_RUN_ID="${{ needs.verify-rc-identity.outputs.rc_run_id }}"
        SOURCE_SHA="${{ needs.verify-rc-identity.outputs.source_sha }}"
        IMAGE_DIGEST="${{ needs.verify-rc-identity.outputs.image_digest }}"
        IMAGE_REPO_DIGEST="${{ needs.verify-rc-identity.outputs.image_repo_digest }}"
        echo "=== R71 P0-11: Verify verify-rc-identity job result ==="
        echo "  verify-rc-identity result: ${VERIFY_RC_IDENTITY_RESULT}"
        echo "  rc_verified:               ${RC_VERIFIED}"
        echo "  rc_tag:                    ${RC_TAG}"
        echo "  rc_run_id:                 ${RC_RUN_ID}"
        echo "  source_sha:                ${SOURCE_SHA}"
        echo "  image_digest:              ${IMAGE_DIGEST}"
        echo "  image_repo_digest:         ${IMAGE_REPO_DIGEST}"
        if [ "${VERIFY_RC_IDENTITY_RESULT}" != "success" ]; then
          echo "FAIL: verify-rc-identity job did not succeed (got: ${VERIFY_RC_IDENTITY_RESULT})"
          echo "  R71 P0-11: RC 身份核验失败 — production promotion 被阻断(fail-closed)"
          echo "  必须确认 rc_run_id=${RC_RUN_ID} 对应的 RC run 上传了完整的 evidence artifacts"
          exit 1
        fi
        if [ "${RC_VERIFIED}" != "true" ]; then
          echo "FAIL: verify-rc-identity outputs rc_verified=${RC_VERIFIED} (要求 true)"
          echo "  R71 P0-11: RC 身份字段与 evidence artifact 不一致 — 无法确认 production"
          echo "  部署的是已验证的 RC 的 exact signed RepoDigest"
          exit 1
        fi
        if [ -z "${IMAGE_REPO_DIGEST}" ]; then
          echo "FAIL: verify-rc-identity outputs image_repo_digest 为空"
          echo "  R71 P0-11: production 必须部署具体的 RepoDigest(不可变内容地址)"
          exit 1
        fi
        echo "PASS: verify-rc-identity succeeded — production promotes exact signed RC digest"
        echo "  image_repo_digest: ${IMAGE_REPO_DIGEST}"

    # 下载 production-evidence job 上传的 artifact(含 production_evidence_index.json);
    # 注意:CI 自动生成的是 dry_run 模式,release tag 场景需运维通过单独的
    # workflow_dispatch 上传 production_evidence.json 真实证据 artifact。
    - name: Download production-evidence artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: production-evidence-${{ github.sha }}-${{ github.run_id }}
        path: ./production-evidence
      continue-on-error: true  # artifact 可能不存在(由运维单独上传真实证据)

    # 运维通过单独 workflow_dispatch 上传的签名的真实 production 证据 artifact
    - name: Download signed production_evidence.json (uploaded by release manager)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: signed-production-evidence-${{ github.sha }}
        path: ./signed-evidence
      continue-on-error: true  # 若运维未上传,后续步骤会因找不到证据文件而 FAIL

    - name: "R65 P0-04: Verify production promotion evidence (strict, no skip)"
      run: |
        set -euo pipefail
        echo "=== R65 P0-04 / R66 P0-05: Production Promotion Gate (strict) ==="
        echo "  release tag: ${GITHUB_REF}"
        echo "  本 job 不可跳过 — 任一校验失败立即阻断 release"
        echo ""
        # 定位真实 production 证据文件(运维必须通过 workflow_dispatch 上传)
        EVIDENCE_FILE=""
        for candidate in \
          "./signed-evidence/production_evidence.json" \
          "./signed-evidence/production_evidence_index.json" \
          "./production-evidence/production_evidence.json" \
          "./production_evidence.json" \
          "./production-evidence/production_evidence_index.json"; do
          if [ -f "${candidate}" ]; then
            EVIDENCE_FILE="${candidate}"
            break
          fi
        done
        if [ -z "${EVIDENCE_FILE}" ]; then
          echo "FAIL: 未找到 production evidence 文件"
          echo "  R65 P0-04 / R66 P0-05: release tag 必须提供 production 真实证据 artifact"
          echo "  运维需通过 workflow_dispatch 上传签名的 production_evidence.json artifact"
          echo "  (artifact 名称: signed-production-evidence-{sha})"
          echo "  证据文件需含 5 类 artifact:SOAK_7DAY/RESTORE_3X/OUTBOX_FAULT_INJECTION/RU_72H/SUPPLY_CHAIN"
          echo "  + 顶层 signature 块(cosign 或 gpg, verified=true)"
          echo "  + 每个 artifact 含 expires_at(ISO 8601,未过期)"
          echo "  + flags.skip 为空(未使用 --skip)"
          echo "  R66 P0-05: 缺证据 = failure (不再是 pass / not_applicable)"
          exit 1
        fi
        echo "校验证据文件: ${EVIDENCE_FILE}"
        echo ""
        # 调用 verify_production_promotion — 不可跳过,失败立即 exit 1
        # 校验项:evidence_mode / signature / expires_at / 5 类 artifact / 字段完整性 / --skip
        python3 scripts/generate_production_evidence.py \
          --verify-promotion "${EVIDENCE_FILE}"
        echo ""
        echo "PASS: R65 P0-04 / R66 P0-05 production promotion 证据校验通过"
        # 输出 production_promotion_allowed 标记(供 release-summary 读取)
        python3 -c "
        import json
        with open('${EVIDENCE_FILE}') as f:
            data = json.load(f)
        allowed = data.get('production_promotion_allowed', False)
        print(f'production_promotion_allowed: {allowed}')
        # 二次断言:必须为 True(verify_production_promotion 通过后已设为 True)
        assert allowed is True, 'production_promotion_allowed 必须为 True'
        "

  # ─── 15. release-summary (R60 P0-06: 单一聚合 required context) ──────
  # R60 P0-06 整改要点:
  #   审计发现:cosign sign-image 失败后,下游 verification statement / SLSA
  #   provenance / source 签名全部跳过,publish-attestation 也被跳过,
  #   但分支保护只要求一个可独立成功的 context,导致 release 在供应链断裂时
  #   仍能通过。本 job 作为单一聚合 required branch-protection context:
  #     - if: always() — 依赖失败/跳过时仍运行,报告聚合状态
  #     - 任何一个依赖 job 的 conclusion != success 时,本 job exit 1
  #     - 替代 per-job required context(避免 race/ordering 问题)
  #   注意:GitHub Actions 表达式 ${{ needs.${job}.result }} 不能在 bash
  #   循环里用变量插值(表达式在 shell 运行前已静态展开),因此通过 job 级
  #   env 显式传递每个 needs.<job>.result,再在 shell 中逐项校验。
  #   (needs 上下文属性为 result,不是 conclusion;conclusion 属于 steps 上下文)
  #
  # ─── R71 Wave 7: bind-runtime-config (P1-04 / P1-05 / P0-13) ──────
  # R71 P1-04: 严格校验 TGJIEMA_IMAGE 使用完整正则
  #   (仅允许预期 registry/repository@sha256:<64-hex>,拒绝 tag / 短 hash /
  #    其他仓库 / 多余字符);pull 后读取真实 RepoDigest,与 candidate
  #   manifest 精确比较(不只检查字符串中是否包含 @sha256:)
  # R71 P1-05: 对 config/groups.yaml + config/topology.yaml 等会影响
  #   运行行为的 host 配置计算 sha256,写入 deployment manifest /
  #   E2E evidence / promotion evidence / rollback record;部署前后都
  #   验证配置 digest,漂移时立即阻断
  # R71 P0-13: 当前 SHA 证据绑定 — 所有 evidence 必须记录 GITHUB_SHA /
  #   GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT,禁止使用"最近一次成功"或
  #   父提交/PR head/旧 run 替代当前候选 SHA
  # 本 job 作为 required check,失败立即阻断 release-summary(fail-closed)
  bind-runtime-config:
    runs-on: ubuntu-latest
    # 仅在 master/main push + rc-v* tag + production-v* tag + workflow_dispatch 时运行
    # PR 场景:允许 skipped(TGJIEMA_IMAGE 在 PR 阶段可能未配置不可变 digest)
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      startsWith(github.ref, 'refs/tags/rc-v') ||
      startsWith(github.ref, 'refs/tags/production-v') ||
      github.event_name == 'workflow_dispatch'
    needs: [docker-build]
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 镜像以读取真实 RepoDigest
    outputs:
      image_valid: ${{ steps.validate.outputs.image_valid }}
      image_repo_digest: ${{ steps.validate.outputs.image_repo_digest }}
      host_config_digest: ${{ steps.validate.outputs.host_config_digest }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      workflow_run_id: ${{ steps.validate.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.validate.outputs.workflow_run_attempt }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Install loguru (validate_runtime_config_binding.py 依赖)
      run: |
        python -m pip install --upgrade pip
        pip install loguru

    - name: Login to GHCR
      if: env.TGJIEMA_IMAGE != ''
      uses: docker/login-action@97847b5c3934084447a3b5046736c3ae1c5c0b6f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # R71 P1-04 / P1-05 / P0-13: 运行统一身份绑定校验(full-evidence 模式)
    # - 严格校验 TGJIEMA_IMAGE 格式(完整正则)
    # - pull 后读取真实 RepoDigest,与 candidate manifest 精确比较
    # - 计算 host config(groups.yaml + topology.yaml)sha256 combined digest
    # - 注入 GITHUB_SHA / GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT(当前候选绑定)
    - name: R71 P1-04/P1-05/P0-13 — Validate runtime config + artifacts binding
      id: validate
      env:
        TGJIEMA_IMAGE: ${{ env.TGJIEMA_IMAGE }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        echo "=== R71 Wave 7: Runtime Config + Artifacts Binding ==="
        echo "  source_sha: ${GITHUB_SHA}"
        echo "  workflow_run_id: ${GITHUB_RUN_ID}"
        echo "  workflow_run_attempt: ${GITHUB_RUN_ATTEMPT}"
        if [ -z "${TGJIEMA_IMAGE:-}" ]; then
          echo "::error::TGJIEMA_IMAGE 环境变量未设置 — 无法进行身份绑定校验"
          echo "  R71 P1-04: 必须使用预期 registry/repository@sha256:<64-hex>"
          exit 1
        fi
        echo "  TGJIEMA_IMAGE: ${TGJIEMA_IMAGE}"
        python scripts/validate_runtime_config_binding.py \
          --mode full-evidence \
          --image "${TGJIEMA_IMAGE}" \
          --repo-root "${PWD}" \
          --output runtime-config-binding.json
        # R71 P0-13: 注入 GITHUB_SHA / GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT 到 evidence
        # (build_runtime_config_binding 自动从 env 读取,这里显式 export 确保可见)
        export GITHUB_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
        # 解析输出并设置 step outputs(写入 $GITHUB_OUTPUT 文件)
        # 使用 jq 解析 JSON(ubuntu-latest 预装 jq,避免 YAML 块缩进问题)
        IMAGE_REF=$(jq -r '.image_reference // ""' runtime-config-binding.json)
        if [ -n "${IMAGE_REF}" ]; then
          IMAGE_VALID="true"
        else
          IMAGE_VALID="false"
        fi
        IMAGE_REPO_DIGEST=$(jq -r '.image_repo_digest // ""' runtime-config-binding.json)
        HOST_CONFIG_DIGEST=$(jq -r '.combined_host_config_digest // ""' runtime-config-binding.json)
        SOURCE_SHA=$(jq -r '.source_sha // ""' runtime-config-binding.json)
        WORKFLOW_RUN_ID=$(jq -r '.workflow_run_id // ""' runtime-config-binding.json)
        WORKFLOW_RUN_ATTEMPT=$(jq -r '.workflow_run_attempt // ""' runtime-config-binding.json)
        {
          echo "image_valid=${IMAGE_VALID}"
          echo "image_repo_digest=${IMAGE_REPO_DIGEST}"
          echo "host_config_digest=${HOST_CONFIG_DIGEST}"
          echo "source_sha=${SOURCE_SHA}"
          echo "workflow_run_id=${WORKFLOW_RUN_ID}"
          echo "workflow_run_attempt=${WORKFLOW_RUN_ATTEMPT}"
        } >> "$GITHUB_OUTPUT"
        echo "image_valid=${IMAGE_VALID}"
        echo "source_sha=${SOURCE_SHA}"
        echo "host_config_digest=${HOST_CONFIG_DIGEST}"

    - name: Upload runtime-config-binding artifact (immutable)
      if: always()
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
      with:
        name: runtime-config-binding-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: runtime-config-binding.json
        if-no-files-found: error  # fail-closed: 校验失败时 binding 文件不存在则 FAIL

  release-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [docker-build, docker-digest-verify, compose-config, redis-acl-matrix,
            schema-diff, restore-legacy-seal-gate, i18n-strict-export-boundary-gate,
            migration-manifest-gate, migration-binding-gate,
            button-flow-real-ux-gate,
            backup-restore-drill, sbom, pip-audit, trivy,
            sign-image, verify-branch-protection, verify-branch-ruleset,
            verify-git-source-governance,
            rc-continuity, publish-attestation,
            attestation-semantics-verify, verify-only-3x, tag-ruleset-verify,
            crdb-ru-72h-attribution-gate, production-evidence,
            production-promotion-gate,
            oci-allowlist-verify,
            validate-oci-rootfs,
            runtime-smoke-compose,
            compose-runtime-e2e,
            verify-rc-identity,
            bind-runtime-config]
    env:
      DOCKER_BUILD: ${{ needs.docker-build.result }}
      DOCKER_DIGEST_VERIFY: ${{ needs.docker-digest-verify.result }}
      OCI_ALLOWLIST_VERIFY: ${{ needs.oci-allowlist-verify.result }}
      VALIDATE_OCI_ROOTFS: ${{ needs.validate-oci-rootfs.result }}
      RUNTIME_SMOKE_COMPOSE: ${{ needs.runtime-smoke-compose.result }}
      COMPOSE_RUNTIME_E2E: ${{ needs.compose-runtime-e2e.result }}
      COMPOSE_CONFIG: ${{ needs.compose-config.result }}
      REDIS_ACL_MATRIX: ${{ needs.redis-acl-matrix.result }}
      SCHEMA_DIFF: ${{ needs.schema-diff.result }}
      RESTORE_LEGACY_SEAL_GATE: ${{ needs.restore-legacy-seal-gate.result }}
      I18N_STRICT_EXPORT_BOUNDARY_GATE: ${{ needs.i18n-strict-export-boundary-gate.result }}
      MIGRATION_MANIFEST_GATE: ${{ needs.migration-manifest-gate.result }}
      MIGRATION_BINDING_GATE: ${{ needs.migration-binding-gate.result }}
      BUTTON_FLOW_REAL_UX_GATE: ${{ needs.button-flow-real-ux-gate.result }}
      BACKUP_RESTORE_DRILL: ${{ needs.backup-restore-drill.result }}
      SBOM: ${{ needs.sbom.result }}
      PIP_AUDIT: ${{ needs.pip-audit.result }}
      TRIVY: ${{ needs.trivy.result }}
      SIGN_IMAGE: ${{ needs.sign-image.result }}
      VERIFY_BRANCH_PROTECTION: ${{ needs.verify-branch-protection.result }}
      # R67 P0-01: branch ruleset + git source governance(commit/tag 签名)
      VERIFY_BRANCH_RULESET: ${{ needs.verify-branch-ruleset.result }}
      VERIFY_GIT_SOURCE_GOVERNANCE: ${{ needs.verify-git-source-governance.result }}
      RC_CONTINUITY: ${{ needs.rc-continuity.result }}
      PUBLISH_ATTESTATION: ${{ needs.publish-attestation.result }}
      # R66 P1-10: attestation-semantics-verify (beyond cosign verify)
      ATTESTATION_SEMANTICS_VERIFY: ${{ needs.attestation-semantics-verify.result }}
      # R67 P0-04: verify-only-3x (Build Once + 3x Verify Only)
      VERIFY_ONLY_3X: ${{ needs.verify-only-3x.result }}
      # R66 P1-11: tag-ruleset-verify (immutable tags)
      TAG_RULESET_VERIFY: ${{ needs.tag-ruleset-verify.result }}
      CRDB_RU_72H_ATTRIBUTION_GATE: ${{ needs.crdb-ru-72h-attribution-gate.result }}
      CRDB_RU_72H_EVIDENCE_STATUS: ${{ needs.crdb-ru-72h-attribution-gate.outputs.evidence_status }}
      # R66 P1-04: 显式 evidence_present 输出,区分"无数据"与"通过"
      CRDB_RU_72H_EVIDENCE_PRESENT: ${{ needs.crdb-ru-72h-attribution-gate.outputs.evidence_present }}
      PRODUCTION_EVIDENCE: ${{ needs.production-evidence.result }}
      PRODUCTION_PROMOTION_GATE: ${{ needs.production-promotion-gate.result }}
      # R71 P0-11: verify-rc-identity (RC 身份完整核验,无重建)
      VERIFY_RC_IDENTITY: ${{ needs.verify-rc-identity.result }}
      VERIFY_RC_IDENTITY_RC_VERIFIED: ${{ needs.verify-rc-identity.outputs.rc_verified }}
      VERIFY_RC_IDENTITY_RC_TAG: ${{ needs.verify-rc-identity.outputs.rc_tag }}
      VERIFY_RC_IDENTITY_IMAGE_DIGEST: ${{ needs.verify-rc-identity.outputs.image_digest }}
      VERIFY_RC_IDENTITY_IMAGE_REPO_DIGEST: ${{ needs.verify-rc-identity.outputs.image_repo_digest }}
      # R71 Wave 7: bind-runtime-config (运行配置 + artifacts 身份绑定)
      BIND_RUNTIME_CONFIG: ${{ needs.bind-runtime-config.result }}
      BIND_RUNTIME_CONFIG_IMAGE_VALID: ${{ needs.bind-runtime-config.outputs.image_valid }}
      BIND_RUNTIME_CONFIG_HOST_CONFIG_DIGEST: ${{ needs.bind-runtime-config.outputs.host_config_digest }}
      BIND_RUNTIME_CONFIG_SOURCE_SHA: ${{ needs.bind-runtime-config.outputs.source_sha }}
      BIND_RUNTIME_CONFIG_WORKFLOW_RUN_ID: ${{ needs.bind-runtime-config.outputs.workflow_run_id }}
    steps:
    - name: Verify all required jobs succeeded
      run: |
        set -euo pipefail
        echo "=== R60 P0-06: Release Gate Aggregate Summary ==="
        echo "Aggregating release gate conclusions..."
        # R60 §ci-fix: 区分 PR 与 release target(push to master/main)。
        # sign-image / publish-attestation 的 if: 仅在 push 到 master/main 时运行,
        # 在 PR 上必然 skipped。若一律要求 success 会让所有 PR 永久失败(过度阻断)。
        # 正确语义:
        #   - release target(master/main push): 全部 14 个 job 必须 success
        #     (sign-image/publish-attestation 此时必须运行且成功,这正是 P0-06 要兜的底)
        #   - PR: 12 个常驻 job 必须 success;sign-image/publish-attestation
        #     允许 skipped(其 if: 未满足),但 failure 仍阻断
        RELEASE_TARGET=false
        if [ "${GITHUB_EVENT_NAME}" = "push" ] && { [ "${GITHUB_REF}" = "refs/heads/master" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; }; then
          RELEASE_TARGET=true
        fi
        # R70 P0-10: release tag 模式分离
        #   - RC_TAG (refs/tags/rc-v*): RC candidate,触发 sign-image / verify-only-3x /
        #     production-evidence / migration-binding-gate / attestation-semantics-verify
        #   - PRODUCTION_TAG (refs/tags/production-v*): production 部署,触发
        #     production-promotion-gate (environment: production)
        #   - 旧的 v*.*.* tag 触发已废弃
        # R65 P0-04: release tag 触发 production-promotion-gate,
        # 必须严格阻断;PR / branch push 场景该 job 为 skipped(允许)
        RC_TAG=false
        PRODUCTION_TAG=false
        if [[ "${GITHUB_REF}" == refs/tags/rc-v* ]]; then
          RC_TAG=true
        fi
        if [[ "${GITHUB_REF}" == refs/tags/production-v* ]]; then
          PRODUCTION_TAG=true
        fi
        # RELEASE_TAG = RC_TAG 或 PRODUCTION_TAG(用于 sign-image 等需要 release tag 触发的 job)
        RELEASE_TAG=false
        if [ "${RC_TAG}" = "true" ] || [ "${PRODUCTION_TAG}" = "true" ]; then
          RELEASE_TAG=true
        fi
        echo "Release target (master/main push): ${RELEASE_TARGET}"
        echo "RC tag (rc-v*): ${RC_TAG}"
        echo "Production tag (production-v*): ${PRODUCTION_TAG}"
        echo "Release tag (rc-v* or production-v*): ${RELEASE_TAG}"
        FAIL=0
        for entry in \
          "docker-build=${DOCKER_BUILD}" \
          "docker-digest-verify=${DOCKER_DIGEST_VERIFY}" \
          "oci-allowlist-verify=${OCI_ALLOWLIST_VERIFY}" \
          "validate-oci-rootfs=${VALIDATE_OCI_ROOTFS}" \
          "runtime-smoke-compose=${RUNTIME_SMOKE_COMPOSE}" \
          "compose-runtime-e2e=${COMPOSE_RUNTIME_E2E}" \
          "compose-config=${COMPOSE_CONFIG}" \
          "redis-acl-matrix=${REDIS_ACL_MATRIX}" \
          "schema-diff=${SCHEMA_DIFF}" \
          "restore-legacy-seal-gate=${RESTORE_LEGACY_SEAL_GATE}" \
          "i18n-strict-export-boundary-gate=${I18N_STRICT_EXPORT_BOUNDARY_GATE}" \
          "migration-manifest-gate=${MIGRATION_MANIFEST_GATE}" \
          "migration-binding-gate=${MIGRATION_BINDING_GATE}" \
          "button-flow-real-ux-gate=${BUTTON_FLOW_REAL_UX_GATE}" \
          "backup-restore-drill=${BACKUP_RESTORE_DRILL}" \
          "sbom=${SBOM}" \
          "pip-audit=${PIP_AUDIT}" \
          "trivy=${TRIVY}" \
          "sign-image=${SIGN_IMAGE}" \
          "verify-branch-protection=${VERIFY_BRANCH_PROTECTION}" \
          "verify-branch-ruleset=${VERIFY_BRANCH_RULESET}" \
          "verify-git-source-governance=${VERIFY_GIT_SOURCE_GOVERNANCE}" \
          "rc-continuity=${RC_CONTINUITY}" \
          "publish-attestation=${PUBLISH_ATTESTATION}" \
          "attestation-semantics-verify=${ATTESTATION_SEMANTICS_VERIFY}" \
          "verify-only-3x=${VERIFY_ONLY_3X}" \
          "tag-ruleset-verify=${TAG_RULESET_VERIFY}" \
          "crdb-ru-72h-attribution-gate=${CRDB_RU_72H_ATTRIBUTION_GATE}" \
          "production-evidence=${PRODUCTION_EVIDENCE}" \
          "production-promotion-gate=${PRODUCTION_PROMOTION_GATE}" \
          "verify-rc-identity=${VERIFY_RC_IDENTITY}" \
          "bind-runtime-config=${BIND_RUNTIME_CONFIG}"; do
          job="${entry%%=*}"
          conclusion="${entry##*=}"
          echo "  ${job}: ${conclusion}"
          # sign-image / publish-attestation / migration-binding-gate /
          # attestation-semantics-verify / verify-only-3x:
          # R70 P0-10: RC-only jobs — 仅 rc-v* tag 触发,master push 与 production-v* tag
          # 上均为 skipped(签名 / attestation / 验证链在 RC 阶段完成)。
          # verify-git-source-governance: master push + rc-v* + production-v* 都运行
          #   (PR 场景 commit 签名可放宽,因 PR commit 在合并时通常会被重新签名)
          # R66 P1-10: attestation-semantics-verify 同 RC-only 模式
          # R67 P0-01: verify-git-source-governance 在 master push + RC/production tag 都运行
          # R67 P0-04: verify-only-3x 同 RC-only 模式
          if [ "${job}" = "sign-image" ] || [ "${job}" = "publish-attestation" ] || [ "${job}" = "migration-binding-gate" ] || [ "${job}" = "attestation-semantics-verify" ] || [ "${job}" = "verify-only-3x" ]; then
            # R70 P0-10: RC-only jobs — 仅 RC_TAG=true 时必须 success
            # - master push: skipped (允许,master 不再触发签名)
            # - production-v* tag: skipped (允许,签名已在 RC 阶段完成)
            # - rc-v* tag: 必须 success (RC candidate 必须有完整签名链)
            # - PR: skipped (允许)
            if [ "${RC_TAG}" = "true" ]; then
              # RC tag: 必须成功(skipped = 供应链断裂,P0-06 必须兜住)
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on RC tag (got: ${conclusion})"
                echo "  R70 P0-10: RC candidate 必须有完整签名/attestation/验证链"
                FAIL=1
              fi
            else
              # master push / production-v* tag / PR: 允许 skipped,failure/cancelled 仍阻断
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "compose-runtime-e2e" ]; then
            # R71 Wave 2: compose-runtime-e2e 仅在 rc-v* tag 触发
            # (需要真实 Docker Compose + .env + 不可变 image digest)
            # - rc-v* tag (RC_TAG=true): 必须 success (RC candidate 必须通过 11 阶段 E2E)
            # - master push / production-v* tag / PR: 允许 skipped
            # R71 P0-05: compose_runtime_e2e.py 必须成为 Release Gates required job
            if [ "${RC_TAG}" = "true" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on RC tag (got: ${conclusion})"
                echo "  R71 P0-05/06/07: Compose Runtime E2E 必须通过(11 阶段 fail-closed)"
                FAIL=1
              fi
            else
              # 非 RC tag: 允许 skipped,failure/cancelled 仍阻断
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "verify-git-source-governance" ]; then
            # R67 P0-01: verify-git-source-governance 在 master push + rc-v* + production-v* 都运行
            # - master/main push (RELEASE_TARGET=true): 必须 success
            # - rc-v* tag (RC_TAG=true): 必须 success
            # - production-v* tag (PRODUCTION_TAG=true): 必须 success
            # - PR: 允许 skipped(if: github.event_name == 'push' 排除 PR)
            if [ "${RELEASE_TARGET}" = "true" ] || [ "${RC_TAG}" = "true" ] || [ "${PRODUCTION_TAG}" = "true" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on release target/tag (got: ${conclusion})"
                FAIL=1
              fi
            else
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed on PR (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "tag-ruleset-verify" ]; then
            # R66 P1-11: tag-ruleset-verify 在 push 时运行(dry-run or strict)
            # - release tag (rc-v* / production-v*): 必须 success(strict 模式)
            # - 非 release tag push: 必须 success(dry-run,允许 ruleset 未配置)
            # - PR: 允许 skipped(if: github.event_name == 'push' 排除 PR)
            if [ "${RELEASE_TAG}" = "true" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on release tag (got: ${conclusion})"
                echo "  R66 P1-11: tag ruleset strict 校验失败 — release tag 不可变性无法保证"
                FAIL=1
              fi
            else
              # PR / branch push: 允许 skipped 或 success
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "production-evidence" ]; then
            # R64 P1-12: production-evidence 是证据生成 job,失败不阻断 PR 合并
            # (完整证据是 release 晋级条件,而非 PR 条件;PR 上仅做快速 dry-run 验证)
            # 仅记录状态,failure/cancelled 不设 FAIL=1
            if [ "${conclusion}" != "success" ]; then
              echo "::warning::Job '${job}' did not succeed (got: ${conclusion}) — non-blocking (R64 P1-12)"
            fi
          elif [ "${job}" = "production-promotion-gate" ]; then
            # R70 P0-10: production-promotion-gate 仅在 production-v* tag 或 workflow_dispatch 触发
            # - production-v* tag (PRODUCTION_TAG=true): 必须 success(失败立即阻断 production 部署)
            # - workflow_dispatch: 必须 success(运维手动触发的晋级门禁)
            # - master push / rc-v* tag / PR: 允许 skipped
            if [ "${PRODUCTION_TAG}" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on production tag/dispatch (got: ${conclusion})"
                echo "R65 P0-04 / R70 P0-10: production promotion 证据不足,无法晋级"
                FAIL=1
              fi
            else
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "verify-rc-identity" ]; then
            # R71 P0-11: verify-rc-identity 仅在 production-v* tag 或 workflow_dispatch 触发
            # - production-v* tag (PRODUCTION_TAG=true): 必须 success 且 rc_verified=true
            #   (RC 身份核验失败 → production promotion 被阻断,无法 promote 未验证 digest)
            # - workflow_dispatch: 必须 success 且 rc_verified=true
            # - master push / rc-v* tag / PR: 允许 skipped(verify-rc-identity 仅在
            #   production 晋级场景运行,RC/master/PR 不需要核验 RC 身份)
            if [ "${PRODUCTION_TAG}" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on production tag/dispatch (got: ${conclusion})"
                echo "  R71 P0-11: RC 身份核验失败 — production promotion 被阻断(fail-closed)"
                FAIL=1
              else
                # job success 但 rc_verified 必须 = true(defense in depth)
                if [ "${VERIFY_RC_IDENTITY_RC_VERIFIED}" != "true" ]; then
                  echo "::error::Job '${job}' succeeded but rc_verified=${VERIFY_RC_IDENTITY_RC_VERIFIED} (要求 true)"
                  echo "  R71 P0-11: RC 身份字段与 evidence artifact 不一致"
                  FAIL=1
                fi
              fi
            else
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          elif [ "${job}" = "bind-runtime-config" ]; then
            # R71 Wave 7: bind-runtime-config 在 master/main push + rc-v* tag +
            #   production-v* tag + workflow_dispatch 时运行,PR 场景 skipped
            # - master/main push (RELEASE_TARGET=true): 必须 success
            # - rc-v* tag (RC_TAG=true): 必须 success(RC candidate 必须有身份绑定)
            # - production-v* tag (PRODUCTION_TAG=true): 必须 success
            # - workflow_dispatch: 必须 success
            # - PR: 允许 skipped,failure/cancelled 仍阻断
            if [ "${RELEASE_TARGET}" = "true" ] || [ "${RC_TAG}" = "true" ] || [ "${PRODUCTION_TAG}" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Job '${job}' did not succeed on release target/tag/dispatch (got: ${conclusion})"
                echo "  R71 P1-04/P1-05/P0-13: 运行配置 + artifacts 身份绑定校验失败"
                FAIL=1
              else
                # job success 但 image_valid 必须 = true(defense in depth)
                if [ "${BIND_RUNTIME_CONFIG_IMAGE_VALID}" != "true" ]; then
                  echo "::error::Job '${job}' succeeded but image_valid=${BIND_RUNTIME_CONFIG_IMAGE_VALID} (要求 true)"
                  echo "  R71 P1-04: TGJIEMA_IMAGE 格式校验未通过(严格正则)"
                  FAIL=1
                fi
                # R71 P0-13: source_sha 必须与 GITHUB_SHA 一致(当前候选绑定)
                if [ -n "${BIND_RUNTIME_CONFIG_SOURCE_SHA}" ] && [ "${BIND_RUNTIME_CONFIG_SOURCE_SHA}" != "${GITHUB_SHA}" ]; then
                  echo "::error::R71 P0-13: bind-runtime-config.source_sha=${BIND_RUNTIME_CONFIG_SOURCE_SHA} 与 GITHUB_SHA=${GITHUB_SHA} 不一致"
                  echo "  禁止使用父提交/PR head/旧 run 替代当前候选 SHA"
                  FAIL=1
                fi
              fi
            else
              if [ "${conclusion}" != "success" ] && [ "${conclusion}" != "skipped" ]; then
                echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
                FAIL=1
              fi
            fi
          else
            # 常驻 job: 任何场景都必须 success
            if [ "${conclusion}" != "success" ]; then
              echo "::error::Job '${job}' did not succeed (got: ${conclusion})"
              FAIL=1
            fi
          fi
        done
        if [ "${FAIL}" -ne 0 ]; then
          echo "::error::R60 P0-06: Release gate FAILED — one or more supply chain jobs did not succeed"
          echo "R60 P0-06: Any skipped/cancelled/failure in supply chain jobs blocks release"
          exit 1
        fi
        echo "PASS: All release gate jobs succeeded"
        # R65 P0-04 / R70 P0-10: 最终汇总报告 production_promotion_allowed 标记
        # - production-v* tag 或 workflow_dispatch 且 production-promotion-gate success → true
        # - rc-v* tag (RC candidate): false (RC 不等于 production,需手动晋级)
        # - master push / PR: false
        # R66 P0-05: defense in depth — 额外校验 crdb-ru-72h-attribution-gate
        #   的 evidence_status=production(production-promotion-gate 已校验,
        #   但 release-summary 作为最终聚合点再校验一次,防止单点失效)
        # R66 P1-04: 同时校验 evidence_present=true,显式区分"无数据"与"通过"
        #   - evidence_status=production 但 evidence_present!=true 视为证据缺失
        #   - 防止 dry-run success 被误计为 Production GO
        # R71 P0-11: defense in depth — 额外校验 verify-rc-identity.rc_verified=true
        #   (production-promotion-gate 已校验,但 release-summary 作为最终聚合点
        #   再校验一次,防止单点失效 — verify-rc-identity 是 RC 身份核验的唯一入口)
        PRODUCTION_PROMOTION_ALLOWED=false
        # R70 P0-10: production promotion 仅在 PRODUCTION_TAG=true 或 workflow_dispatch 时允许
        if [ "${PRODUCTION_TAG}" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          if [ "${PRODUCTION_PROMOTION_GATE}" = "success" ]; then
            if [ "${CRDB_RU_72H_EVIDENCE_STATUS}" = "production" ] && [ "${CRDB_RU_72H_EVIDENCE_PRESENT}" = "true" ]; then
              # R71 P0-11: verify-rc-identity 必须 success 且 rc_verified=true(defense in depth)
              if [ "${VERIFY_RC_IDENTITY}" = "success" ] && [ "${VERIFY_RC_IDENTITY_RC_VERIFIED}" = "true" ]; then
                PRODUCTION_PROMOTION_ALLOWED=true
              else
                echo "::error::R71 P0-11: production tag/dispatch 但 verify-rc-identity=${VERIFY_RC_IDENTITY} / rc_verified=${VERIFY_RC_IDENTITY_RC_VERIFIED}"
                echo "  defense in depth 校验失败 — RC 身份未通过完整核验"
                echo "  production 必须部署已验证的 RC 的 exact signed RepoDigest(不重建)"
                exit 1
              fi
            else
              echo "::error::R66 P0-05/P1-04: production tag/dispatch 但 evidence_status=${CRDB_RU_72H_EVIDENCE_STATUS} (要求 production) / evidence_present=${CRDB_RU_72H_EVIDENCE_PRESENT} (要求 true)"
              echo "  defense in depth 校验失败 — production promotion 拒绝"
              echo "  R66 P1-04: evidence_present=false 表示无真实数据(即便 job success 也是 dry-run)"
              exit 1
            fi
          else
            echo "::error::R70 P0-10: production tag/dispatch 但 production-promotion-gate=${PRODUCTION_PROMOTION_GATE} (要求 success)"
            exit 1
          fi
        fi
        echo ""
        echo "=== R65 P0-04 / R66 P0-05 / R66 P1-04 / R70 P0-10 / R71 P0-11: Production Promotion Summary ==="
        echo "production_promotion_allowed: ${PRODUCTION_PROMOTION_ALLOWED}"
        echo "  rc_tag: ${RC_TAG}"
        echo "  production_tag: ${PRODUCTION_TAG}"
        echo "  workflow_dispatch: $([ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && echo true || echo false)"
        echo "  production-promotion-gate: ${PRODUCTION_PROMOTION_GATE}"
        echo "  crdb-ru-72h-evidence-status: ${CRDB_RU_72H_EVIDENCE_STATUS}"
        echo "  crdb-ru-72h-evidence-present: ${CRDB_RU_72H_EVIDENCE_PRESENT}"
        echo "  verify-rc-identity: ${VERIFY_RC_IDENTITY}"
        echo "  verify-rc-identity.rc_verified: ${VERIFY_RC_IDENTITY_RC_VERIFIED}"
        echo "  verify-rc-identity.rc_tag: ${VERIFY_RC_IDENTITY_RC_TAG}"
        echo "  verify-rc-identity.image_digest: ${VERIFY_RC_IDENTITY_IMAGE_DIGEST}"
        echo "  verify-rc-identity.image_repo_digest: ${VERIFY_RC_IDENTITY_IMAGE_REPO_DIGEST}"

