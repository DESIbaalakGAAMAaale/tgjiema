# TG文件解码器 — Secretless CI/本地测试 Compose (R76 O6 / 10.E / 10.O-O6 / R79 §10.2)
#
# ════════════════════════════════════════════════════════════════════════
# R76 整改目标(P0-03 / P0-04 / 10.A / 10.E / 10.O-O6):
#   本 compose 文件提供"无真实凭证即可完整跑通全部功能"的隔离测试环境。
#   所有外部边界(Telegram Provider / 对象存储 / CockroachDB)使用协议兼容
#   模拟服务,Agent/开发者无需任何 Bot Token / R2 Key / 生产 CRDB Key。
#
# R79 §10.2 / P0-03 整改 — 单 CRDB 拓扑:
#   本文件通过覆盖基础 docker-compose.yml 的服务键 `cockroachdb` 注入
#   secretless 配置,不再新增第二套 `cockroachdb-secretless` 服务。
#   Compose override 合并语义下,所有现有 `depends_on: cockroachdb` 自动
#   指向 secretless 配置;resolved 服务图中只允许存在一个 CockroachDB。
#   禁止回退到双 CRDB 折中方案(旧方案同时等待 production 与 secretless
#   两个 CRDB,并以削弱 production 安全配置为代价修测试 — R79 P0-01/02)。
#
# 启动顺序(严格):
#   1. redis-acl-init (oneshot)         → 渲染 ACL 文件
#   2. redis / cockroachdb / minio / provider-sim  → 基础设施 healthy
#   3. migration (oneshot)              → DDL 执行完成
#   4. db_writer / crdb_sync / up / idx / dsp  → 业务消费者自然启动
#
# 测试只观察(禁止):
#   - 禁止 XADD / 直接 UPDATE job 状态
#   - 禁止调用 worker 私有函数(_process_one_pending / process_queue / _dispatch_media)
#   - 禁止 docker compose exec ... python -c 直调内部 handler
#   - 禁止 bot=None / print('OK') 作为成功标准
#
# 凭证来源:
#   - 所有 ${CI_*} 变量由 GitHub job / run_secretless_release_gates.py 临时生成
#   - 禁止读取 secrets.TEST_* / secrets.R2_* / secrets.COCKROACHDB_* / production Environment
#   - HMAC key / MinIO root 凭证 / contract token 单次 run 生成,job 结束销毁
#
# 使用:
#   # 1. 生成临时凭证(由 run_secretless_release_gates.py 自动完成)
#   export CI_REDIS_HEALTH_PASSWORD=$(openssl rand -hex 16)
#   export CI_REDIS_WRITER_PASSWORD=$(openssl rand -hex 16)
#   export CI_REDIS_READER_PASSWORD=$(openssl rand -hex 16)
#   export CI_REDIS_ADMIN_PASSWORD=$(openssl rand -hex 16)
#   export CI_MINIO_ROOT_USER=minio-ci
#   export CI_MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)
#   export CI_PROVIDER_CONTRACT_TOKEN=$(openssl rand -hex 24)
#   export CI_PROVIDER_RECEIPT_KEY=$(openssl rand -hex 32)
#   export CI_BACKUP_SIGNING_KEY=$(openssl rand -hex 32)
#
#   # 2. 启动
#   docker compose -f docker-compose.yml -f docker-compose.secretless.yml up -d
#
#   # 3. 销毁(job 结束)
#   docker compose -f docker-compose.yml -f docker-compose.secretless.yml down -v --remove-orphans
# ════════════════════════════════════════════════════════════════════════

services:
  # ────────────────────────────────────────────────────────────────
  # 基础设施:provider-sim (本地 Telegram Bot API 协议模拟器)
  # ────────────────────────────────────────────────────────────────
  # R76 O3 / 10.C: 实现与 Telegram Bot API 协议兼容的本地 HTTP 服务
  # - 真实生产代码通过 build_provider_client(settings) 连接本服务
  # - 文件下载由本服务真实返回字节流(不依赖 Update 内嵌内容)
  # - 出站消息持久化为签名 receipt
  # - 故障注入(401/429/500/timeout/duplicate)在协议层确定性触发
  provider-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgjiema-secretless-provider-sim:ci
    container_name: tgjiema-provider-sim
    restart: unless-stopped
    environment:
      - SERVICE_ROLE=provider_sim
      - PYTHONUNBUFFERED=1
      - APP_ENV=test
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - PROVIDER_RECEIPT_KEY=${CI_PROVIDER_RECEIPT_KEY:?CI_PROVIDER_RECEIPT_KEY must be set}
    # R76 O6: tests/ 在生产 Dockerfile 中被物理删除(R69 P0-5),
    # secretless CI 通过只读 bind mount 注入 tests/support/provider_simulator.py
    # 生产镜像和 production Compose 不得包含 simulator(R76 10.C 隔离要求)
    volumes:
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8088/health'); exit(0 if r.status==200 else 1)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ────────────────────────────────────────────────────────────────
  # 基础设施:MinIO (S3 兼容对象存储,替代 R2)
  # ────────────────────────────────────────────────────────────────
  # R76 O7 / 10.G: backup_engine / db_backup / backup_dr_validate
  # 通过 OBJECT_STORAGE_BACKEND=minio + S3_ENDPOINT_URL 切换到 MinIO
  # - 使用 RELEASE 时间戳 tag(不可变,禁止 latest)
  # - 单次 run 临时凭证(${CI_MINIO_ROOT_USER} / ${CI_MINIO_ROOT_PASSWORD})
  # - minio-init oneshot 创建测试 bucket
  # - 生产边界:docker-compose.prod.yml 不得包含 MinIO
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: tgjiema-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - MINIO_ROOT_PASSWORD=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # MinIO 初始化(oneshot)— 创建测试 bucket
  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: tgjiema-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MC_CONFIG_DIR=/tmp/.mc
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 ${CI_MINIO_ROOT_USER} ${CI_MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/tgjiema-backup;
      mc mb --ignore-existing local/tgjiema-payload;
      mc mb --ignore-existing local/tgjiema-manifest;
      mc anonymous set none local/tgjiema-backup;
      mc anonymous set none local/tgjiema-payload;
      mc anonymous set none local/tgjiema-manifest;
      mc stat local/tgjiema-backup >/dev/null;
      mc stat local/tgjiema-payload >/dev/null;
      mc stat local/tgjiema-manifest >/dev/null;
      echo 'MinIO buckets verified: tgjiema-backup tgjiema-payload tgjiema-manifest';
      "
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ────────────────────────────────────────────────────────────────
  # 基础设施:CockroachDB (单节点 insecure,仅 CI 网络)
  # ────────────────────────────────────────────────────────────────
  # R79 §10.2 / P0-03: 覆盖基础 docker-compose.yml 的 `cockroachdb` 服务键。
  # Compose merge 后 resolved 图中只有这一个 CockroachDB 服务;
  # 所有应用角色的 depends_on / DSN 统一指向 `cockroachdb`。
  #
  # 从基础服务继承(不在此重复声明,避免 merge 歧义):
  #   - container_name: tgjiema-cockroachdb
  #   - read_only: true / working_dir: /cockroach/run
  #   - tmpfs: /tmp、/cockroach/run、/cockroach/certs(最小写集合,R79 §10.1)
  #   - cap_drop: ALL / security_opt: no-new-privileges:true
  #   - deploy.resources.limits
  # 继承正确性由 scripts/validate_secretless_service_graph.py 在 resolved
  # config 上机器断言(R79 §10.3),不靠肉眼判断 overlay。
  #
  # CockroachDB v24.1 insecure 模式约束:
  #   1. --listen-addr hostname 必须为 127.0.0.1 或 localhost(insecure 安全约束)
  #   2. --listen-addr port 必须为 26257(insecure 安全约束,v24.1 起强制)
  #   3. --listen-addr 与 --sql-addr 不能同 host:port(否则 bind: address already in use)
  # 解决方案:
  #   - --listen-addr=localhost:26257 (内部 RPC,loopback+26257 满足 insecure 约束)
  #   - --sql-addr=0.0.0.0:26258 (SQL,不同端口避免 bind 冲突,允许 Compose 内
  #     其他容器通过 cockroachdb:26258 连接)
  #   - 所有 DATABASE_URL / COCKROACHDB_URL 使用 26258 端口
  # 安全考虑:CI 容器网络隔离,0.0.0.0:26258 仅对同一 Compose 网络的容器可见;
  # 继承自基础服务的 ports 映射绑定 127.0.0.1(loopback),无公网暴露。
  # R76 §10.M: CockroachDB v24.1.0 要求 --store size ≥ 640 MiB,调整为 1GiB。
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0@sha256:cc4e3ee67104d6f6434c81b555d69d4eb319f8aa0c5495931ffbe9273adfc4b5
    command: start-single-node --insecure --listen-addr=localhost:26257 --sql-addr=0.0.0.0:26258 --http-addr=0.0.0.0:8080 --store=type=mem,size=1GiB
    # R79 §10.1: 最小写集合加固 — rootfs 只读,writable 路径仅限 tmpfs + named volume
    # !override 防止与 docker-compose.yml 基础服务的 tmpfs 追加合并产生重复挂载
    read_only: true
    working_dir: /cockroach/run
    tmpfs: !override
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /cockroach/run:rw,nosuid,nodev,size=16m
      - /cockroach/certs:rw,nosuid,nodev,noexec,size=16m
    volumes:
      # 与基础服务同一挂载目标 — override 以相同 target 替换 volume 来源,
      # secretless 环境使用独立数据卷,与开发环境 cockroach_data 隔离。
      - cockroach_secretless_data:/cockroach/cockroach-data
    healthcheck:
      # R76 10.E / R78: healthcheck 显式连接 SQL 端口 26258
      # (显式 --sql-addr 后,26257 仅为 RPC listen 端口,不再讲 pgwire,
      #  healthcheck 连接 26257 会失败 — 不得回退到 26257)
      # 验证 SELECT 1 + 自动创建 tgjiema 数据库
      # (migration 会再次 CREATE DATABASE IF NOT EXISTS,幂等)
      test:
        - CMD-SHELL
        - >-
          cockroach sql --insecure --host=localhost:26258
          -e 'SELECT 1'
          -e 'CREATE DATABASE IF NOT EXISTS tgjiema'
          -e "SELECT database_name FROM [SHOW DATABASES] WHERE database_name='tgjiema'"
          || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ────────────────────────────────────────────────────────────────
  # migration (secretless 覆盖:使用 CRDB insecure DSN)
  # ────────────────────────────────────────────────────────────────
  # 覆盖 docker-compose.yml 中 migration 服务的 environment 和 depends_on
  # - CRDB 指向单 CRDB 服务 cockroachdb(R79 §10.2)
  # - DSN: postgresql://root@cockroachdb:26258/tgjiema?sslmode=disable
  # - SECRETLESS_MODE=true 强制 contract + minio backend
  migration:
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - OBJECT_STORAGE_BACKEND=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - S3_SECRET_ACCESS_KEY=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET_NAME=tgjiema-backup
      - SECRETLESS_CRDB_HOST=${SECRETLESS_CRDB_HOST:?SECRETLESS_CRDB_HOST must be set}
      - SECRETLESS_CRDB_SQL_PORT=${SECRETLESS_CRDB_SQL_PORT:?SECRETLESS_CRDB_SQL_PORT must be set}
      - SECRETLESS_CRDB_DATABASE=${SECRETLESS_CRDB_DATABASE:?SECRETLESS_CRDB_DATABASE must be set}
      - SECRETLESS_CRDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - COCKROACHDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - BACKUP_SIGNING_KEY=${CI_BACKUP_SIGNING_KEY:?CI_BACKUP_SIGNING_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # db_writer (secretless 覆盖:依赖 provider-sim + minio + cockroachdb)
  # ────────────────────────────────────────────────────────────────
  # R76 O6: db_writer 使用现有 entrypoint 和 SERVICE_ROLE=db_writer
  # 自然消费 Redis Stream,测试只观察 pending 数和 SQLite/CRDB 行状态
  db_writer:
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - OBJECT_STORAGE_BACKEND=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - S3_SECRET_ACCESS_KEY=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET_NAME=tgjiema-backup
      - SECRETLESS_CRDB_HOST=${SECRETLESS_CRDB_HOST:?SECRETLESS_CRDB_HOST must be set}
      - SECRETLESS_CRDB_SQL_PORT=${SECRETLESS_CRDB_SQL_PORT:?SECRETLESS_CRDB_SQL_PORT must be set}
      - SECRETLESS_CRDB_DATABASE=${SECRETLESS_CRDB_DATABASE:?SECRETLESS_CRDB_DATABASE must be set}
      - SECRETLESS_CRDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - COCKROACHDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - BACKUP_SIGNING_KEY=${CI_BACKUP_SIGNING_KEY:?CI_BACKUP_SIGNING_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # ────────────────────────────────────────────────────────────────
  # crdb_sync (secretless 覆盖)
  # ────────────────────────────────────────────────────────────────
  crdb_sync:
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - OBJECT_STORAGE_BACKEND=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - S3_SECRET_ACCESS_KEY=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET_NAME=tgjiema-backup
      - SECRETLESS_CRDB_HOST=${SECRETLESS_CRDB_HOST:?SECRETLESS_CRDB_HOST must be set}
      - SECRETLESS_CRDB_SQL_PORT=${SECRETLESS_CRDB_SQL_PORT:?SECRETLESS_CRDB_SQL_PORT must be set}
      - SECRETLESS_CRDB_DATABASE=${SECRETLESS_CRDB_DATABASE:?SECRETLESS_CRDB_DATABASE must be set}
      - SECRETLESS_CRDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - COCKROACHDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - BACKUP_SIGNING_KEY=${CI_BACKUP_SIGNING_KEY:?CI_BACKUP_SIGNING_KEY must be set}
    depends_on:
      cockroachdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # ────────────────────────────────────────────────────────────────
  # up Bot (secretless 覆盖)
  # ────────────────────────────────────────────────────────────────
  # R76 O6: up Bot 使用 build_provider_client(settings) 工厂
  # 在 SECRETLESS_MODE=true 下自动切换到 ContractProviderClient
  # 连接 provider-sim 而非真实 Telegram API
  up:
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - UPLOAD_BOT_TOKEN=ci-local-token
      - ACCOUNT_1_NAME=ci-test-account
      - ACCOUNT_1_CHANNELS=-1002000000001
      - RELAY_ENCRYPTION_KEY=Ku_IwLXkPUbbZ71_zW1z_0br1K6A19eAbbporoUQPJY=
      # R80 P0-02: secretless CI 无真实频道,运维逃生开关放行 force-join 检查
      - FORCE_JOIN_FAIL_OPEN=true
      - OBJECT_STORAGE_BACKEND=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - S3_SECRET_ACCESS_KEY=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET_NAME=tgjiema-backup
      - SECRETLESS_CRDB_HOST=${SECRETLESS_CRDB_HOST:?SECRETLESS_CRDB_HOST must be set}
      - SECRETLESS_CRDB_SQL_PORT=${SECRETLESS_CRDB_SQL_PORT:?SECRETLESS_CRDB_SQL_PORT must be set}
      - SECRETLESS_CRDB_DATABASE=${SECRETLESS_CRDB_DATABASE:?SECRETLESS_CRDB_DATABASE must be set}
      - SECRETLESS_CRDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - COCKROACHDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - BACKUP_SIGNING_KEY=${CI_BACKUP_SIGNING_KEY:?CI_BACKUP_SIGNING_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db_writer:
        condition: service_started
    # R80 P0-02: contract 模式下 up bot 内嵌 uvicorn 提供
    # /internal/contract/update 端点,E2E 驱动器从宿主机访问。
    ports:
      - "127.0.0.1:8000:8000"

  # ────────────────────────────────────────────────────────────────
  # idx Bot (secretless 覆盖)
  # ────────────────────────────────────────────────────────────────
  idx:
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
      - DECODER_BOT_TOKEN=ci-local-token
      - RELAY_ENCRYPTION_KEY=Ku_IwLXkPUbbZ71_zW1z_0br1K6A19eAbbporoUQPJY=
      - OBJECT_STORAGE_BACKEND=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${CI_MINIO_ROOT_USER:?CI_MINIO_ROOT_USER must be set}
      - S3_SECRET_ACCESS_KEY=${CI_MINIO_ROOT_PASSWORD:?CI_MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET_NAME=tgjiema-backup
      - SECRETLESS_CRDB_HOST=${SECRETLESS_CRDB_HOST:?SECRETLESS_CRDB_HOST must be set}
      - SECRETLESS_CRDB_SQL_PORT=${SECRETLESS_CRDB_SQL_PORT:?SECRETLESS_CRDB_SQL_PORT must be set}
      - SECRETLESS_CRDB_DATABASE=${SECRETLESS_CRDB_DATABASE:?SECRETLESS_CRDB_DATABASE must be set}
      - SECRETLESS_CRDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - COCKROACHDB_URL=${SECRETLESS_CRDB_URL:?SECRETLESS_CRDB_URL must be generated}
      - BACKUP_SIGNING_KEY=${CI_BACKUP_SIGNING_KEY:?CI_BACKUP_SIGNING_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db_writer:
        condition: service_started

  # ────────────────────────────────────────────────────────────────
