  # ────────────────────────────────────────────────────────────────
  # db_backup (secretless 覆盖:使用 MinIO 而非 R2)
  # ────────────────────────────────────────────────────────────────
  # R76 O7 / 10.G: db_backup 通过 OBJECT_STORAGE_BACKEND=minio
  # 切换到 MinIO,仍生成 payload/manifest/COMPLETE 三对象
  db_backup:
    # Step 14 identity anchor: resolved Compose config must expose the exact image
    # reference used by this service. The manifest builder re-resolves this tag
    # through Docker Engine and records only its immutable sha256 content ID.
    image: tgjiema-secretless-db-backup:ci
    environment:
      - APP_ENV=test
      - SECRETLESS_MODE=true
      - PROVIDER_BACKEND=contract
      - PROVIDER_BASE_URL=http://provider-sim:8088
      - PROVIDER_CONTRACT_TOKEN=${CI_PROVIDER_CONTRACT_TOKEN:?CI_PROVIDER_CONTRACT_TOKEN must be set}
