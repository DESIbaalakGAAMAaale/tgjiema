#
# R40 P2-3: 依赖锁定文件(含 SHA-256 hash 校验)
#
# 此文件由 pip-compile --generate-hashes 生成。
# 当前为格式占位版本,首次生产部署前必须按以下流程重新生成:
#
#   1. pip install pip-tools
#   2. pip-compile --generate-hashes --output-file=requirements.lock requirements.txt
#   3. 提交 PR,CI 会通过 `pip install --require-hashes -r requirements.lock` 验证
#
# CI 中安装逻辑(见 .github/workflows/ci.yml):
#   if [ -f requirements.lock ]; then
#     pip install --require-hashes -r requirements.lock || pip install -r requirements.txt
#   fi
#
# 占位 hash 说明:
#   下方每个依赖的 --hash 值为格式占位(64 位 hex),不会通过 PyPI 校验。
#   pip install --require-hashes 会因 hash 不匹配而失败,CI 自动回退到
#   requirements.txt(仅锁定版本,无 hash 校验)。
#   生产部署前必须用真实 hash 替换,完整流程见 docs/dependency-lock-hash.md。
#
# R44: 此文件需要运维在 Linux 环境用 `pip-compile --generate-hashes requirements.txt -o requirements.lock` 重新生成真实 hash
# 当前 hash 仍为占位,hash 校验在 release-gates.yml 的 pip-audit job 中通过 --strict 强制执行
# CI 中 ci.yml 直接用 requirements.txt 安装,不使用此 lock 文件
#

