# ─── R100 最终兜底 ─────────────────────────────────────────────
r100:
  channel: -1000000000999      # R100 兜底频道（必需）
  fallback: []

# ─── Mon 轮转配置 ─────────────────────────────────────────────
mon:
  active_window_size: 3       # 同一时刻活跃的频道数（窗口大小）
  rotation_files_per_slot: 500    # 每槽位接收文件数达到后切换下一批
  rotation_time_per_slot: 3600    # 每槽位最长使用时间（秒），达到后切换
  heartbeat_interval: 30       # 心跳间隔（秒）
  heartbeat_timeout: 90        # 超时阈值（秒）
  degrade_cooldown: 300        # 降级冷却时间（秒）