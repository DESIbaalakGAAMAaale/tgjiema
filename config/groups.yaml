# ─── 环形冗余拓扑 — 账号频道配置（部署用）────────────────────────
# 你只需提供每个账号的频道列表，系统自动分组为 (Active, Shadow1, Shadow2)
# 每个账号下，每 3 个频道自动编为一组（顺序即角色：第1个Active, 第2个Shadow1, 第3个Shadow2）
# 频道数必须是 3 的倍数。
#
# 获取频道 ID：在频道里转发消息给 @getidsbot。
# 注意：Telegram 频道 ID 是负数，如 -1001234567890。
#
# 用法：
#   python config/generate_topology.py       # 自动生成 topology.yaml
#   python admin/seed_topology.py --yes       # 写入数据库
# ────────────────────────────────────────────────────────────────

accounts:
  - name: "账号1"
    channels:
      - -1000000000001   # → 组1 Active (a1)
      - -1000000000011   # → 组1 Shadow1 (s1a)
      - -1000000000012   # → 组1 Shadow2 (s1b)

      - -1000000000002   # → 组2 Active (a2)
      - -1000000000021   # → 组2 Shadow1 (s2a)
      - -1000000000022   # → 组2 Shadow2 (s2b)

      - -1000000000003   # → 组3 Active (a3)
      - -1000000000031   # → 组3 Shadow1 (s3a)
      - -1000000000032   # → 组3 Shadow2 (s3b)

  - name: "账号2"
    channels:
      - -1000000000004   # → 组4 Active (a4)
      - -1000000000041   # → 组4 Shadow1 (s4a)
      - -1000000000042   # → 组4 Shadow2 (s4b)

      - -1000000000005   # → 组5 Active (a5)
      - -1000000000051   # → 组5 Shadow1 (s5a)
      - -1000000000052   # → 组5 Shadow2 (s5b)

      - -1000000000006   # → 组6 Active (a6)
      - -1000000000061   # → 组6 Shadow1 (s6a)
      - -1000000000062   # → 组6 Shadow2 (s6b)

      # 更多频道可继续添加（每3个一组）...
      # 如需 15 组，共需要 45 个频道

# ─── Mon 监控配置 ─────────────────────────────────────────────
mon:
  heartbeat_interval: 30       # 心跳间隔（秒）
  heartbeat_timeout: 90        # 超时阈值（秒）
  degrade_cooldown: 300        # 降级冷却时间（秒）
  r100_managed: false          # R100 由 Mon 自动管理？false=仅手动
  r100_group: -1               # R100 所在组号（-1 = 最后一组）