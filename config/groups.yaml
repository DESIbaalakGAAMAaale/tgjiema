# ─── 环形冗余拓扑 — 账号频道配置（部署用）────────────────────────
# 5 个 Telegram 账号，每个账号提供 9 个频道 = 共 45 频道 = 15 组
#
# 配对策略（三不同账号原则）：
#   每组 (Active, Shadow1, Shadow2) 来自 3 个不同的 Telegram 账号
#   5 账号轮转：账号 1→2→3→4→5→1... 滑动窗口
#
#   R100：独立于环形调度之外，仅作最终兜底存档，不参与取件/转发。
#
# 用法：
#   python config/generate_topology.py       # 生成 topology.yaml
#   python admin/seed_topology.py --yes       # 写入数据库
# ────────────────────────────────────────────────────────────────

accounts:
  - name: "账号1"
    channels:
      - -1000000000001
      - -1000000000002
      - -1000000000003
      - -1000000000004
      - -1000000000005
      - -1000000000006
      - -1000000000007
      - -1000000000008
      - -1000000000009

  - name: "账号2"
    channels:
      - -1000000000010
      - -1000000000011
      - -1000000000012
      - -1000000000013
      - -1000000000014
      - -1000000000015
      - -1000000000016
      - -1000000000017
      - -1000000000018

  - name: "账号3"
    channels:
      - -1000000000019
      - -1000000000020
      - -1000000000021
      - -1000000000022
      - -1000000000023
      - -1000000000024
      - -1000000000025
      - -1000000000026
      - -1000000000027

  - name: "账号4"
    channels:
      - -1000000000028
      - -1000000000029
      - -1000000000030
      - -1000000000031
      - -1000000000032
      - -1000000000033
      - -1000000000034
      - -1000000000035
      - -1000000000036

  - name: "账号5"
    channels:
      - -1000000000037
      - -1000000000038
      - -1000000000039
      - -1000000000040
      - -1000000000041
      - -1000000000042
      - -1000000000043
      - -1000000000044
      - -1000000000045

# ─── R100 最终兜底 ─────────────────────────────────────────────
# 不参与环形调度，不参与取件/转发，仅留存底文件。
# 提供 1 个频道即可（或 3 个备选，只使用首个）。
r100:
  channel: -1000000000999      # R100 兜底频道（必需）
  # 可选：额外备选频道（若提供，按序使用）
  fallback: []

# ─── Mon 监控配置 ─────────────────────────────────────────────
mon:
  active_count: 3            # 三活态并行：同一时刻仅 3 个 Active 工作
  heartbeat_interval: 30     # 心跳间隔（秒）
  heartbeat_timeout: 90      # 超时阈值（秒）
  degrade_cooldown: 300      # 降级冷却时间（秒）