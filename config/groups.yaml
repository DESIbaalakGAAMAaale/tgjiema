# ─── 环形冗余拓扑 — 账号频道配置（部署用）────────────────────────
# 你只需提供每个账号的频道列表，系统自动跨账号配对：
#
#   奇数组: Active(账号1) + Shadow1/2(账号2)
#   偶数组: Active(账号2) + Shadow1/2(账号1)
#
# 确保每组 Active 和 Shadow 在不同账号上，实现账号级冗余。
# 每组消耗：奇数组(账号1×1 + 账号2×2)，偶数组(账号2×1 + 账号1×2)
# 两个账号频道数必须相同，且为 3 的倍数（每 2 组消耗各账号 3 个频道）。
#
# 获取频道 ID：在频道里转发消息给 @getidsbot。
# 注意：Telegram 频道 ID 是负数，如 -1001234567890。
#
# 用法：
#   python config/generate_topology.py       # 自动生成 topology.yaml
#   python admin/seed_topology.py --yes       # 写入数据库
# ────────────────────────────────────────────────────────────────

accounts:
  - name: "账号1"
    channels:
      - -1000000000001
      - -1000000000002
      - -1000000000003
      - -1000000000004
      - -1000000000005
      - -1000000000006
      - -1000000000007
      - -1000000000008
      - -1000000000009

  - name: "账号2"
    channels:
      - -1000000000010
      - -1000000000011
      - -1000000000012
      - -1000000000013
      - -1000000000014
      - -1000000000015
      - -1000000000016
      - -1000000000017
      - -1000000000018

# ─── Mon 监控配置 ─────────────────────────────────────────────
mon:
  active_count: 3            # 三活态并行：同一时刻仅 3 个 Active 工作
  heartbeat_interval: 30     # 心跳间隔（秒）
  heartbeat_timeout: 90      # 超时阈值（秒）
  degrade_cooldown: 300      # 降级冷却时间（秒）
  r100_managed: false        # R100 由 Mon 自动管理？false=仅手动
  r100_group: -1             # R100 所在组号（-1 = 最后一组）