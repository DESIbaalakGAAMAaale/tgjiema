# 环形冗余拓扑 — 账号频道配置（占位模板，实际使用 .env 配置）
# 5 个 Telegram 账号，每个账号提供 9 个频道 = 共 45 频道 = 15 组
#
# 配置来源优先级：
#   1. .env 环境变量（推荐）
#   2. 本文件（groups.yaml，备选方案）
#   3. 管理员 Bot 运行时配置（存 DB）

