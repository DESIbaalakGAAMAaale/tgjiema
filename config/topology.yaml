  - slot_id: "a1"
    channel_id: -1000000000001
    status: "active"
    next_active_chat_id: -1000000000002
    prev_slot_id: "s1b"

  - slot_id: "s1a"
    channel_id: -1000000000011
    status: "shadow1"
    next_active_chat_id: null
    prev_slot_id: "a1"

