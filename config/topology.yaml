    next_active_chat_id: -1000000000015
    prev_slot_id: "s4a"

  # ─── 组 5 — 账号1(A) / 账号2(S) ───
  - slot_id: "a5"
    channel_id: -1000000000007
    status: "active"
    next_active_chat_id: -1000000000018
    prev_slot_id: "s5b"

  - slot_id: "s5a"
    channel_id: -1000000000016
    status: "shadow1"
    next_active_chat_id: null
    prev_slot_id: "a5"

  - slot_id: "s5b"
    channel_id: -1000000000017
    status: "shadow2"
    next_active_chat_id: -1000000000007
    prev_slot_id: "s5a"

  # ─── 组 6 — 账号2(A) / 账号1(S) (R100) ───
  - slot_id: "a6"
    channel_id: -1000000000018
    status: "r100"
    next_active_chat_id: -1000000000001
    prev_slot_id: "s6b"
    is_r100: true

  - slot_id: "s6a"
    channel_id: -1000000000008
