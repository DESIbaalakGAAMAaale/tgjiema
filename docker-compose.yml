# TG文件解码器 — Docker Compose 多服务部署（开发版本）
# R36 H8: 从 config/services.yaml 派生,与 systemd 一致的服务清单
# 环形冗余 v2 架构(up / idx / dsp / mon / admin_bot / admin / db_writer / crdb_sync / db_backup)
#
# ════════════════════════════════════════════════════════════════════════
# R70 Wave 4: 这是开发版本（docker-compose.yml），仅供本地开发/测试使用
# ════════════════════════════════════════════════════════════════════════
# 生产部署必须使用 docker-compose.prod.yml：
#   docker compose -f docker-compose.prod.yml up -d
#
# 开发版本与生产版本的关键差异：
#   - 开发版本使用 `build: .`（本地构建镜像）
#   - 生产版本使用 `image: ${TGJIEMA_IMAGE:?...}`（不可变 digest）
#   - 开发版本挂载 `./config:/app/config`（便于代码热重载）
#   - 生产版本禁止代码 bind mount（只挂载配置数据文件）
#
# 校验生产 compose 不可变性：
#   python scripts/check_compose_static_rules.py --compose docker-compose.prod.yml --immutable
# ════════════════════════════════════════════════════════════════════════
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │ R41 P0-3 醒目说明: 首次启动前必须准备 .env 中的 REDIS_*_PASSWORD   │
# │ ─────────────────────────────────────────────────────────────────── │
# │   首次 `docker compose up` 前,需在 .env 中配置以下 4 个变量:       │
# │     REDIS_HEALTH_PASSWORD=...   (healthcheck 用户,仅 PING 权限)     │
# │     REDIS_WRITER_PASSWORD=...   (tgjiema_writer 用户,业务写权限)    │
# │     REDIS_READER_PASSWORD=...   (tgjiema_reader 用户,只读权限)      │
# │     REDIS_ADMIN_PASSWORD=...     (tgjiema_admin 用户,管理权限)       │
# │   R41 P0-3 fail-closed: 任一变量缺失 → docker compose 启动失败,    │
# │   redis-acl-init/render_acl.sh 也会 exit 1(不再随机生成密码)。     │
# │   R41 P1-9: mon_bot / admin_bot / admin 后台使用 tgjiema_admin。     │
# │   ACL 模板: config/redis/users.acl.template                         │
# │   渲染脚本: config/redis/render_acl.sh                               │
# │   校验: render_acl.sh 拒绝含 '<' 或默认密码占位符的输出,失败 exit 1│
# └──────────────────────────────────────────────────────────────────────┘
#
# 部署步骤(开发):
#   1. 创建 .env 文件(从 .env.example 复制并填写,务必设置 REDIS_*_PASSWORD)
#   2. 编辑 config/groups.yaml(填写 15 组的 channel_id)
#   3. docker-compose up -d --build
#      - redis-acl-init 先于 redis 启动,渲染 /data/users.acl
#      - redis 主容器以 --aclfile /data/users.acl 加载渲染后的 ACL
#   4. 拓扑已自动初始化(run_all.py 启动时自动执行 seed_topology)
#
# R36 H8: 每个服务使用最小 secrets 注入(.env.secrets.<service>),
#         不再共享完整 .env,与 systemd 模型一致。

services:
  # ── redis-acl-init (一次性,渲染 ACL 文件到共享卷) ──
  # R40 P0-3: 先于 redis 启动,从 REDIS_*_PASSWORD 环境变量渲染 users.acl
  # 渲染流程: sed 替换 <REDIS_*_PASSWORD> 占位符 → /data/users.acl
  # 校验: 输出文件不得含 '<' 或未替换的默认密码,否则 exit 1
  redis-acl-init:
    image: redis:7-alpine
    container_name: tgjiema-redis-acl-init
    restart: "no"
    # R71 RC7 fix: redis:7-alpine 默认以 `redis` 用户运行(Dockerfile USER redis),
    # /data named volume 默认 owner=root,redis 用户无写权限,导致
    # render_acl.sh 写入 /data/users.acl 时 Permission denied。
    # oneshot 容器仅渲染 ACL 后立即退出,安全性由 cap_drop: ALL +
    # no-new-privileges + restart: "no" 保证,root 用户无长期运行风险。
    user: root
    # R71 RC8 fix: cap_drop: ALL 移除了 CAP_DAC_OVERRIDE 和 CAP_CHOWN。
    # redis:7-alpine Dockerfile 执行 `chown redis:redis /data`,named volume
    # redis_data:/data 属主为 redis:redis(755)。user: root(UID=0)在没有
    # DAC_OVERRIDE 时须遵守权限位 — root 对 /data 是 "other"(r-x,无 write),
    # 导致 sed > /data/users.acl Permission denied(RC7 复现)。
    # cap_add 恢复两个最小 capabilities:
    #   DAC_OVERRIDE — root 可绕过权限位写入 redis:redis 拥有的 /data
    #   CHOWN        — chown users.acl → redis:redis,使 redis 主容器读取 600 ACL
    # 安全性:oneshot + cap_drop: ALL(其余移除)+ no-new-privileges + restart: "no"
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    environment:
      - REDIS_HEALTH_PASSWORD=${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
      - REDIS_WRITER_PASSWORD=${REDIS_WRITER_PASSWORD:?REDIS_WRITER_PASSWORD must be set in .env}
      - REDIS_READER_PASSWORD=${REDIS_READER_PASSWORD:?REDIS_READER_PASSWORD must be set in .env}
      # R41 P1-9: tgjiema_admin 用户密码(mon_bot/admin_bot/admin 后台使用)
      - REDIS_ADMIN_PASSWORD=${REDIS_ADMIN_PASSWORD:?REDIS_ADMIN_PASSWORD must be set in .env}
      - ACL_TEMPLATE_PATH=/app/config/redis/users.acl.template
      - ACL_OUTPUT_PATH=/data/users.acl
    volumes:
      - redis_data:/data
      - ./config/redis:/app/config/redis:ro
    entrypoint: ["/bin/sh", "/app/config/redis/render_acl.sh"]
    # R37 P2-4: 镜像安全加固(init 容器短任务,资源限制放宽)
    # R71 RC6 fix: 移除 read_only: true — render_acl.sh 需要写入 named volume
    # redis_data:/data。read_only: true 导致 /data/users.acl Permission denied。
    # 安全性由 cap_drop: ALL + no-new-privileges 保证。
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # ── Redis (基础设施) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # R40 P0-3: 从 redis_data 共享卷加载渲染后的 ACL(/data/users.acl 由 redis-acl-init 生成)
    # R38 P1-8: 启用 ACL(--aclfile),各服务使用独立用户连接 Redis
    # R71 RC9 fix: redis:7-alpine 镜像 entrypoint.sh 在以 root 启动时会尝试
    # `setpriv --reuid=redis --regid=redis --clear-groups` 切换到 redis 用户,
    # 这需要 CAP_SETUID 和 CAP_SETGID capabilities。cap_drop: ALL 移除了这些
    # capabilities,导致 `setpriv: setresuid failed: Operation not permitted`(RC8 复现)。
    # 显式指定 user: redis 让 Docker 直接以 redis 用户启动容器,entrypoint.sh
    # 检测 `id -u != 0` 直接 `exec "$@"`,绕过 setpriv 切换。
    # /data named volume 的 owner 是 redis:redis(redis:7-alpine Dockerfile
    # 执行 `chown redis:redis /data`),redis 用户有读写权限。
    # users.acl 的 owner 也是 redis:redis(render_acl.sh 末尾 chown 设置)。
    user: redis
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --aclfile /data/users.acl
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # R39 P0-1: healthcheck 改用专用 health 用户(仅允许 PING),
    # 不再使用被禁用的 default 用户导致认证失败。
    # R40 P0-3: REDIS_HEALTH_PASSWORD 由 .env 顶层注入(由 redis-acl-init 同样读取)。
    # R41 P0-3: fail-closed — 缺失 REDIS_HEALTH_PASSWORD 时 compose 启动失败(不再回退默认健康密码)。
    # 注意: $$ 转义避免 Compose 插值,运行时由 shell 展开 $REDIS_HEALTH_PASSWORD。
    environment:
      - REDIS_HEALTH_PASSWORD=${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
    depends_on:
      redis-acl-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user health -a $$REDIS_HEALTH_PASSWORD --no-auth-warning ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── CockroachDB (基础设施,CI/开发环境单节点) ──
  # R75 P0-03: 使用真实 CockroachDB 替代 PostgreSQL — CockroachDB 有不同的事务语义、
  # UPSERT、TTL、retry 行为,不能用 PostgreSQL 作为 RC 验证的替代品。
  # R75 P0-02: 不使用 GitHub Actions service container(不支持 entrypoint/command 参数),
  # 改为在 compose 中定义 CRDB 服务,与应用容器在同一网络。
  # R75 P2-02: 固定 image digest(multi-arch manifest list digest),
  # 禁止使用浮动 tag(如 latest-v24.1)或仅版本 tag。
  # Digest 来源: docker hub manifest list (amd64+arm64)
  # 生产环境使用外部 CockroachDB Cloud/独立部署,不使用此服务。
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0@sha256:cc4e3ee67104d6f6434c81b555d69d4eb319f8aa0c5495931ffbe9273adfc4b5
    container_name: tgjiema-cockroachdb
    restart: unless-stopped
    # R79 §10.1: 修复 R78 引入的 listen/sql 端口冲突 —
    #   listen-addr=127.0.0.1:26257 与 sql-addr=0.0.0.0:26257 同端口,
    #   0.0.0.0 包含 127.0.0.1,SQL bind 与 RPC bind 冲突(EADDRINUSE),
    #   容器启动即崩溃,表现为 "CockroachDB (production) did not become healthy"。
    # v24.1 insecure 约束: listen-addr 必须 loopback:26257;
    # SQL listener 因此移到显式 --sql-addr=0.0.0.0:26258(与 secretless 拓扑一致)。
    command: start-single-node --insecure --listen-addr=localhost:26257 --sql-addr=0.0.0.0:26258 --http-addr=0.0.0.0:8080 --store=type=mem,size=256MiB
    ports:
      # R79 §10.1: SQL 端口随 --sql-addr 迁移到 26258(loopback 绑定不变)
      - "127.0.0.1:26258:26258"
      - "127.0.0.1:8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    # R79 §10.1 / P0-02 / P1-06: 生产 CRDB 文件系统显式契约(最小写集合)
    # R78 曾以 "v24.1 需要可写 workdir/FIFO" 为由删除 read_only,扩大为整个
    # rootfs 可写 — 属于生产安全回退。此处恢复 read_only 并以最小写集合替代:
    #   只读: 整个 rootfs(含 /cockroach 下二进制与全部系统目录)
    #   tmpfs: /tmp            — Go runtime / CLI 临时文件
    #          /cockroach/run  — 工作目录(server_fifo 等运行时文件;working_dir)
    #          /cockroach/certs — v24.1 启动时创建/探测的证书目录(insecure 也会 touch)
    #   named volume: /cockroach/cockroach-data — 数据目录(唯一持久化写路径)
    # 契约由 scripts/verify_crdb_filesystem_contract.py(docker diff 断言)与
    # tests/test_crdb_filesystem_contract.py(写负测/持久化/tmpfs 易失)回归验证。
    read_only: true
    working_dir: /cockroach/run
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /cockroach/run:rw,nosuid,nodev,size=16m
      - /cockroach/certs:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # R76 10.E: healthcheck 增加 tgjiema 数据库存在和版本查询
    # 1. SELECT 1 — 基础连通性
    # 2. CREATE DATABASE IF NOT EXISTS tgjiema — 幂等确保 tgjiema 数据库存在
    #    (避免 chicken-and-egg: migration 依赖 cockroachdb healthy 才能启动,
    #     但 migration 创建 tgjiema 数据库;此处 healthcheck 幂等创建,
    #     让 depends_on.cockroachdb.condition: service_healthy 可用)
    # 3. SELECT version() — CockroachDB 版本可读(cluster identity)
    healthcheck:
      # R79 §10.1: SQL listener 已迁移到显式 26258,healthcheck 必须连接
      # SQL 端口而非 RPC listen 端口 26257(显式 --sql-addr 后 26257 不再讲 pgwire)。
      test:
        - CMD-SHELL
        - >-
          cockroach sql --insecure --host=localhost:26258
          -e 'SELECT 1 AS ping'
          -e 'CREATE DATABASE IF NOT EXISTS tgjiema'
          -e 'SELECT version() AS crdb_version'
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── migration (oneshot,DDL 执行) ──
  # R37 P0-1: migration 必须加载 .env.secrets.migration(含 COCKROACHDB_URL)
  migration:
    build: .
    container_name: tgjiema-migration
    restart: "no"
    env_file:
      - .env.shared
      - .env.secrets.migration
    environment:
      - SERVICE_ROLE=migration
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    # R37 P1-8: 调用 migration_runner 执行 DDL(唯一允许的 DDL/TTL/版本写入入口)
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=migration
    # 映射到 `python -m services.migration_runner`
    depends_on:
      redis:
        condition: service_healthy
      # R76 10.E: migration 必须等待 cockroachdb healthy(含 tgjiema 数据库幂等创建)
      cockroachdb:
        condition: service_healthy
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── db_writer (Redis Stream 消费 → CRDB 写入) ──
  db_writer:
    build: .
    container_name: tgjiema-db_writer
    restart: on-failure
    env_file:
      - .env.shared
    environment:
      - SERVICE_ROLE=db_writer
      - PYTHONUNBUFFERED=1
      # R71 RC23 fix: db_writer 需要 REDIS_URL 消费 Redis Stream(XREADGROUP)。
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs  # R38 P2-4: 只读容器需要可写日志挂载
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=db_writer
    # 映射到 `python run_all.py --standalone db_writer`
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 cache_store.db 近 10 分钟有写入(活跃写入证明进程存活)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; f='/app/data/cache_store.db'; exit(0 if os.path.exists(f) and (time.time()-os.path.getmtime(f))<600 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── crdb_sync (单一 CRDB 同步服务) ──
  # R37 P0-1: 使用标准 env_file 字段加载 secrets(不再使用非标准字段)
  crdb_sync:
    build: .
    container_name: tgjiema-crdb_sync
    restart: on-failure
    env_file:
      - .env.shared
      - .env.secrets.crdb_sync
    environment:
      - SERVICE_ROLE=crdb_sync
      - PYTHONUNBUFFERED=1
      # R40 P0-3: 统一 REDIS_URL 格式(tgjiema_writer 用户 + Compose 插值密码)
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs  # R38 P2-4: 只读容器需要可写日志挂载
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=crdb_sync 映射
    depends_on:
      migration:
        condition: service_completed_successfully
      # R76 10.E: crdb_sync 显式依赖 cockroachdb healthy
      cockroachdb:
        condition: service_healthy
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 crdb_sync 进程在运行(cmdline 含 crdb_sync)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'crdb_sync' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── up (上传接收 Bot) ──
  up:
    build: .
    container_name: tgjiema-up
    restart: always
    env_file:
      - .env.shared
      - .env.secrets.up
    environment:
      - SERVICE_ROLE=up
      - PYTHONUNBUFFERED=1
      # R40 P0-3: 统一 REDIS_URL 格式(tgjiema_writer 用户 + Compose 插值密码)
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=up 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 up Bot 进程在运行(cmdline 含 up)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone up' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── idx (解码索引 Bot) ──
  idx:
    build: .
    container_name: tgjiema-idx
    restart: always
    env_file:
      - .env.shared
      - .env.secrets.idx
    environment:
      - SERVICE_ROLE=idx
      - PYTHONUNBUFFERED=1
      # R40 P0-3: 统一 REDIS_URL 格式(tgjiema_writer 用户 + Compose 插值密码)
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=idx 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 idx Bot 进程在运行(cmdline 含 idx)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone idx' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── dsp (派送分发 Bot) ──
  dsp:
    build: .
    container_name: tgjiema-dsp
    restart: always
    env_file:
      - .env.shared
      - .env.secrets.dsp
    environment:
      - SERVICE_ROLE=dsp
      - PYTHONUNBUFFERED=1
      # R40 P0-3: 统一 REDIS_URL 格式(tgjiema_writer 用户 + Compose 插值密码)
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=dsp 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 dsp Bot 进程在运行(cmdline 含 dsp)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone dsp' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── mon (监控管理 Bot) ──
  mon:
    build: .
    container_name: tgjiema-mon
    restart: always
    env_file:
      - .env.shared
      - .env.secrets.mon
    environment:
      - SERVICE_ROLE=mon
      - PYTHONUNBUFFERED=1
      # R41 P1-9: mon 需要管理权限(XAUTOCLAIM/XTRIM/EVAL)→ 改用 tgjiema_admin 用户
      # tgjiema_writer 缺少 XAUTOCLAIM/EVAL,mon 切换 leader lease / 修复 PEL 时需要
      - REDIS_URL=redis://tgjiema_admin:${REDIS_ADMIN_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=mon 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 mon Bot 进程在运行(cmdline 含 mon)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone mon' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── admin_bot (管理员 Bot) ──
  admin_bot:
    build: .
    container_name: tgjiema-admin_bot
    restart: always
    env_file:
      - .env.shared
      - .env.secrets.admin_bot
    environment:
      - SERVICE_ROLE=admin_bot
      - PYTHONUNBUFFERED=1
      # R41 P1-9: admin_bot 需要管理权限(管理消费组/重置 PEL)→ 改用 tgjiema_admin
      - REDIS_URL=redis://tgjiema_admin:${REDIS_ADMIN_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=admin_bot 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 admin_bot 进程在运行(cmdline 含 admin_bot)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone admin_bot' in cmd else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── admin (Web 管理后台) ──
  admin:
    build: .
    container_name: tgjiema-admin
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.shared
      - .env.secrets.admin
    environment:
      - SERVICE_ROLE=admin
      - PYTHONUNBUFFERED=1
      # R41 P1-9: admin 后台需要管理权限(管理消费组/EVAL Lua)→ 改用 tgjiema_admin
      - REDIS_URL=redis://tgjiema_admin:${REDIS_ADMIN_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=admin 映射
    depends_on:
      redis:
        condition: service_healthy
      db_writer:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固(read_only + tmpfs + security_opt + 资源限制)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8080/health'); exit(0 if r.status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  # ── db_backup (数据库备份,增量 watermark + 加密) ──
  db_backup:
    build: .
    container_name: tgjiema-db_backup
    restart: on-failure
    env_file:
      - .env.shared
      - .env.secrets.db_backup
    environment:
      - SERVICE_ROLE=db_backup
      - PYTHONUNBUFFERED=1
      # R40 P0-3: 统一 REDIS_URL 格式(tgjiema_writer 用户 + Compose 插值密码)
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据 SERVICE_ROLE=db_backup 映射
    depends_on:
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # R38 P1-7: 角色专属 healthcheck — 检查 db_backup 进程在运行(cmdline 含 db_backup)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmd=open('/proc/1/cmdline','rb').read().replace(b'\\x00',b' ').decode(); exit(0 if 'standalone db_backup' in cmd else 1)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── prometheus_exporter (指标导出,R38 P1-9) ──
  # 独立 HTTP server,监听 0.0.0.0:9100/metrics
  # 从 SQLite cache_store / relay_pool 读取指标,不依赖 Redis/CRDB
  prometheus_exporter:
    build: .
    container_name: tgjiema-prometheus_exporter
    restart: always
    env_file:
      - .env.shared
    environment:
      - SERVICE_ROLE=prometheus_exporter
      - PYTHONUNBUFFERED=1
      - PROMETHEUS_EXPORTER_HOST=0.0.0.0
      - PROMETHEUS_EXPORTER_PORT=9100
    volumes:
      - ./data:/app/data:ro  # 只读挂载(exporter 不写数据)
      - ./config:/app/config
    # R70 Wave 2: 移除 command 覆盖,由 docker/entrypoint.py 根据
    # SERVICE_ROLE=prometheus_exporter 映射到 `python -m services.prometheus_exporter`
    depends_on:
      migration:
        condition: service_completed_successfully
    # R37 P2-4: 镜像安全加固
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9100:9100"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    # R38 P1-7: 角色专属 healthcheck — 检查 /metrics 端点可访问
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:9100/health'); exit(0 if r.status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  cockroach_data:
