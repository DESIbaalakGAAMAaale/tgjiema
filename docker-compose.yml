# TG文件解码器 — Docker Compose 一键部署
# 环形冗余 v2 架构（up / idx / dsp / mon / admin_bot）
# file_bot 已独立部署至 CF Workers
#
# 部署步骤:
#   1. 创建 .env 文件（从 .env.example 复制并填写）
#   2. 编辑 config/groups.yaml（填写 15 组的 channel_id）
#   3. docker-compose up -d --build
#   4. 拓扑已自动初始化（run_all.py 启动时自动执行 seed_topology）

services:
  app:
    build: .
    container_name: tgjiema
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data        # SQLite relay_pool.db 持久化
      - ./logs:/app/logs        # 日志持久化
      - ./config:/app/config    # 配置文件挂载（方便修改）
    # 可选：单独启动某个组件
    # command: python run_all.py up idx dsp mon admin_bot
    command: python run_all.py
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    # 健康检查:使用 ps + grep 替代 pgrep(更可靠)
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_all.py' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"