# TG文件解码器 — 生产 Compose（不可变镜像 digest）
# R70 Wave 4: 不可变生产 Compose
#
# 与 docker-compose.yml（开发版本）的关键差异：
#   1. 所有应用服务使用 `image: ${TGJIEMA_IMAGE:?...}` 而非 `build: .`
#      - TGJIEMA_IMAGE 必须指向不可变 digest：
#        ghcr.io/maxiuquan/tgjiema@sha256:<64 hex>
#      - 禁止 mutable tag（latest / master / staging / v1.2.3 无 digest）
#   2. 移除 `./config:/app/config` 代码 bind mount
#      - Python 代码（config/__init__.py, environment.py, registry.py, settings.py）
#        必须来自镜像，禁止 host 覆盖
#      - 只挂载运行时配置数据文件（文件级挂载，非目录级）
#   3. 硬编码 APP_ENV=production（在 .env.shared 中也应为 production）
#   4. 显式 unset 所有测试逃生舱变量（I18N_ALLOW_FALLBACK / ALLOW_LEGACY_RESTORE 等）
#   5. Build Once / Verify Many / Deploy Same Digest：
#      所有服务运行同一个候选 digest，禁止部署阶段重新 build
#
# 部署步骤：
#   1. 在 .env 中配置 REDIS_*_PASSWORD（4 个）和 TGJIEMA_IMAGE
#      TGJIEMA_IMAGE=ghcr.io/maxiuquan/tgjiema@sha256:<64 hex>
#   2. 准备 config/groups.yaml（账号频道配置）
#   3. docker compose -f docker-compose.prod.yml up -d
#      - 所有服务使用同一个不可变镜像 digest
#      - 拓扑自动初始化（run_all.py 启动时自动执行 seed_topology）
#
# 校验：
#   python scripts/check_compose_static_rules.py --compose docker-compose.prod.yml --immutable
#   （--immutable 启用不可变性校验：禁止 build:、要求 image digest、禁止代码 bind mount）

services:
  # ── redis-acl-init (一次性,渲染 ACL 文件到共享卷) ──
  # 基础设施服务,使用官方 redis 镜像,不需要应用镜像
  redis-acl-init:
    image: redis:7-alpine
    container_name: tgjiema-redis-acl-init
    restart: "no"
    environment:
      - REDIS_HEALTH_PASSWORD=${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
      - REDIS_WRITER_PASSWORD=${REDIS_WRITER_PASSWORD:?REDIS_WRITER_PASSWORD must be set in .env}
      - REDIS_READER_PASSWORD=${REDIS_READER_PASSWORD:?REDIS_READER_PASSWORD must be set in .env}
      - REDIS_ADMIN_PASSWORD=${REDIS_ADMIN_PASSWORD:?REDIS_ADMIN_PASSWORD must be set in .env}
      - ACL_TEMPLATE_PATH=/app/config/redis/users.acl.template
      - ACL_OUTPUT_PATH=/data/users.acl
    volumes:
      - redis_data:/data
      # 文件级挂载：只挂载 ACL 模板（配置数据,非 Python 代码）
      - ./config/redis/users.acl.template:/app/config/redis/users.acl.template:ro
      - ./config/redis/render_acl.sh:/app/config/redis/render_acl.sh:ro
    entrypoint: ["/bin/sh", "/app/config/redis/render_acl.sh"]
    # R71 RC6 fix: 移除 read_only: true — render_acl.sh 需要写入 named volume
    # redis_data:/data 生成 users.acl。read_only: true 在 CI 环境中导致
    # /data/users.acl Permission denied(Docker named volume 在 read_only
    # 容器中不可写)。安全性由 cap_drop: ALL + no-new-privileges 保证。
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # ── Redis (基础设施) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --aclfile /data/users.acl
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - REDIS_HEALTH_PASSWORD=${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
    depends_on:
      redis-acl-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user health -a $$REDIS_HEALTH_PASSWORD --no-auth-warning ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── migration (oneshot,DDL 执行) ──
  # R70 Wave 4: 使用不可变 image digest,禁止 build:
  migration:
    image: ${TGJIEMA_IMAGE:?TGJIEMA_IMAGE must be set to ghcr.io/maxiuquan/tgjiema@sha256:<digest>}
    container_name: tgjiema-migration
    restart: "no"
    env_file:
      - .env.shared
      - .env.secrets.migration
    environment:
      - SERVICE_ROLE=migration
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      # R70 Wave 3: 显式 unset 所有测试逃生舱（防止 .env 误设）
      - I18N_ALLOW_FALLBACK=
      - ALLOW_LEGACY_RESTORE=
      - TEST_ONLY=
      - DEV_ONLY=
      - BYPASS=
      - SKIP_VERIFY=
      - SKIP_VALIDATION=
      - ALLOW_INSECURE=
    volumes:
      - ./data:/app/data
      # 文件级挂载：只挂载运行时配置数据文件（非 Python 代码）
      - ./config/groups.yaml:/app/config/groups.yaml:ro
      - ./config/topology.yaml:/app/config/topology.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── db_writer (Redis Stream 消费 → CRDB 写入) ──
  db_writer:
    image: ${TGJIEMA_IMAGE:?TGJIEMA_IMAGE must be set to ghcr.io/maxiuquan/tgjiema@sha256:<digest>}
    container_name: tgjiema-db_writer
    restart: on-failure
    env_file:
      - .env.shared
    environment:
      - SERVICE_ROLE=db_writer
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - I18N_ALLOW_FALLBACK=
      - ALLOW_LEGACY_RESTORE=
      - TEST_ONLY=
      - DEV_ONLY=
      - BYPASS=
      - SKIP_VERIFY=
      - SKIP_VALIDATION=
      - ALLOW_INSECURE=
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncio,os; from services.health import check_readiness; r=asyncio.run(check_readiness(os.environ.get('SERVICE_ROLE',''))); exit(0 if r.healthy else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── crdb_sync (单一 CRDB 同步服务) ──
  crdb_sync:
    image: ${TGJIEMA_IMAGE:?TGJIEMA_IMAGE must be set to ghcr.io/maxiuquan/tgjiema@sha256:<digest>}
    container_name: tgjiema-crdb_sync
    restart: on-failure
    env_file:
      - .env.shared
      - .env.secrets.crdb_sync
    environment:
      - SERVICE_ROLE=crdb_sync
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://tgjiema_writer:${REDIS_WRITER_PASSWORD}@redis:6379/0
      - I18N_ALLOW_FALLBACK=
      - ALLOW_LEGACY_RESTORE=
      - TEST_ONLY=
      - DEV_ONLY=
      - BYPASS=
      - SKIP_VERIFY=
      - SKIP_VALIDATION=
      - ALLOW_INSECURE=
    volumes:
