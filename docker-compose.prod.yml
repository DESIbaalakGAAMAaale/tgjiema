      - I18N_ALLOW_FALLBACK=
      - ALLOW_LEGACY_RESTORE=
      - TEST_ONLY=
      - DEV_ONLY=
      - BYPASS=
      - SKIP_VERIFY=
      - SKIP_VALIDATION=
      - ALLOW_INSECURE=
